<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Igarin — Kas Rumah</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230D4F45'/%3E%3Cpath d='M14 40c6-3 10-9 14-16 3 6 6 10 10 12 4 2 8 1 12-3' stroke='%23E8A020' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='50' cy='20' r='5' fill='%23E8A020'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230D4F45'/%3E%3Cpath d='M14 40c6-3 10-9 14-16 3 6 6 10 10 12 4 2 8 1 12-3' stroke='%23E8A020' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta name="theme-color" content="#0D4F45">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F0EFE9;
  --card:#FFFFFF;
  --ink:#15221F;
  --ink-2:#5F726D;
  --line:#DFDDD3;
  --nil:#0D4F45;
  --nil-2:#14695C;
  --nil-pale:#DCEBE6;
  --saffron:#E8A020;
  --saffron-pale:#FBEBCD;
  --lunas:#1A7F52;
  --lunas-pale:#DDF0E5;
  --sebagian:#A86F06;
  --belum:#B93A31;
  --belum-pale:#FAE3E0;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--paper);color:var(--ink);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
}
h1,h2,h3,.dsp{font-family:"Bricolage Grotesque","Plus Jakarta Sans",sans-serif;font-weight:800;letter-spacing:-.025em;margin:0;line-height:1.12}
h1{font-size:1.75rem}
h2{font-size:1.2rem}
h3{font-size:1rem;font-weight:600}
p{margin:0 0 .6em}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px;border-radius:8px}
.muted{color:var(--ink-2);font-size:.87rem}
.tiny{color:var(--ink-2);font-size:.75rem}
.sp{flex:1}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.center{text-align:center}
.mt{margin-top:16px}.mt-s{margin-top:8px}
.hide{display:none !important}

/* ---------- struktur ---------- */
.shell{max-width:900px;margin:0 auto;padding:0 16px calc(104px + env(safe-area-inset-bottom))}
.bar{position:sticky;top:0;z-index:30;background:var(--paper);padding:12px 16px 8px;max-width:900px;margin:0 auto;display:flex;align-items:center;gap:10px}
.bar h2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid{display:grid;gap:12px}
@media(min-width:760px){.grid.two{grid-template-columns:1fr 1fr}}
.sec{display:flex;align-items:baseline;gap:10px;margin:24px 0 10px}
.sec h2{flex:1;font-size:1.05rem}

/* ---------- kartu ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.pad-s{padding:12px}
.card.flat{background:transparent;border-style:dashed}

/* ---------- kartu saldo (motif kuitansi) ---------- */
.kas{
  position:relative;overflow:hidden;border-radius:22px;padding:20px 18px 16px;color:#fff;
  background:radial-gradient(130% 110% at 88% -10%, rgba(232,160,32,.34), transparent 60%),
             linear-gradient(165deg,var(--nil-2),var(--nil) 74%);
}
.kas .lbl{font-size:.8rem;color:var(--nil-pale);letter-spacing:.02em}
.kas .big{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:2.6rem;line-height:1.02;margin-top:2px}
.kas .big i{font-style:normal;font-size:.95rem;font-weight:600;opacity:.7;margin-left:7px;font-family:"Plus Jakarta Sans",sans-serif}
.kas .spark{position:absolute;right:0;bottom:0;width:54%;opacity:.45}
/* garis perforasi seperti sobekan kuitansi */
.kas .perf{position:relative;margin:14px -18px 0;border-top:2px dashed rgba(255,255,255,.28)}
.kas .perf::before,.kas .perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--paper)}
.kas .perf::before{left:-10px}
.kas .perf::after{right:-10px}
.kas .duo{display:flex;gap:18px;padding-top:12px;position:relative;z-index:2}
.kas .duo div{flex:1}
.kas .duo b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.15rem}
.kas .duo span{font-size:.72rem;color:var(--nil-pale)}

/* ---------- tombol ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;
  border-radius:14px;border:1.5px solid var(--nil);background:var(--nil);color:#fff;font-weight:600;font-size:.95rem;
  transition:transform .1s ease,filter .15s ease}
.btn:active{transform:scale(.98)}
.btn.soft{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--nil)}
.btn.gold{background:var(--saffron);border-color:var(--saffron);color:#3B2B03}
.btn.danger{background:var(--belum);border-color:var(--belum)}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 13px;font-size:.85rem;border-radius:11px}
.btn.xs{min-height:36px;padding:0 10px;font-size:.8rem;border-radius:10px}
.btn[disabled]{opacity:.4}
.btn svg{width:18px;height:18px;flex:0 0 auto;stroke-width:2}

/* ---------- chips geser ---------- */
.slide{display:flex;gap:8px;overflow-x:auto;padding:3px 16px 5px;margin:0 -16px;scrollbar-width:none;scroll-snap-type:x proximity}
.slide::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:44px;display:inline-flex;align-items:center;gap:7px;padding:0 15px;border-radius:99px;
  border:1.5px solid var(--line);background:#fff;font-size:.88rem;font-weight:600;color:var(--ink);scroll-snap-align:start}
.chip.on{background:var(--nil);color:#fff;border-color:var(--nil)}
.chip.gold.on{background:var(--saffron);border-color:var(--saffron);color:#3B2B03}
.chip svg{width:17px;height:17px;stroke-width:1.9}

/* ---------- input ---------- */
label.f{display:block;margin-bottom:14px}
label.f>span{display:block;font-size:.82rem;font-weight:600;margin-bottom:6px}
label.f .hint{font-weight:400;color:var(--ink-2)}
input,select,textarea{width:100%;min-height:48px;padding:11px 13px;border:1.5px solid var(--line);border-radius:13px;
  background:#fff;font-family:inherit;font-size:1rem;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--nil);outline:none}
textarea{min-height:84px;resize:vertical}
input[type=checkbox]{width:24px;height:24px;min-height:24px;accent-color:var(--nil)}
.check{display:flex;align-items:center;gap:10px;min-height:48px;font-size:.92rem}
.err{color:var(--belum);font-size:.83rem;margin:-6px 0 10px;font-weight:600}
.money{position:relative}
.money input{font-family:"Bricolage Grotesque",sans-serif;font-size:1.7rem;font-weight:800;padding-right:56px;min-height:62px}
.money span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--ink-2);font-weight:700;font-size:.9rem}

/* ---------- daftar ---------- */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);text-align:left;
  background:none;border-left:0;border-right:0;border-top:0;width:100%;color:inherit;font:inherit;min-height:56px}
.li:last-child{border-bottom:0}
.li .bd{flex:1;min-width:0}
.li .bd b{display:block;font-size:.95rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .bd span{font-size:.77rem;color:var(--ink-2)}
.li .amt{font-weight:700;font-size:.95rem;white-space:nowrap}
.amt.in{color:var(--lunas)}
.amt.out{color:var(--belum)}
.ava{width:40px;height:40px;border-radius:13px;background:var(--nil-pale);color:var(--nil);display:grid;place-items:center;
  font-weight:700;font-size:.9rem;flex:0 0 auto}
.ava.gold{background:var(--saffron-pale);color:var(--sebagian)}
.tag{display:inline-block;padding:4px 10px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap}
.tag.ok{background:var(--lunas-pale);color:var(--lunas)}
.tag.no{background:var(--belum-pale);color:var(--belum)}
.tag.part{background:var(--saffron-pale);color:var(--sebagian)}
.tag.plain{background:var(--paper);color:var(--ink-2);border:1px solid var(--line)}

/* ---------- papan iuran ---------- */
.pays{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:600px){.pays{grid-template-columns:1fr 1fr}}
.pay{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:15px;border:1.5px solid var(--line);
  background:#fff;width:100%;text-align:left;min-height:66px}
.pay .bd{flex:1;min-width:0}
.pay .bd b{display:block;font-size:.94rem;font-weight:600}
.pay .bd span{font-size:.76rem;color:var(--ink-2)}
.pay.ok{border-color:var(--lunas);background:var(--lunas-pale)}
.pay.part{border-color:var(--saffron);background:var(--saffron-pale)}
.tick{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:0 0 auto;background:#fff}
.pay.ok .tick{background:var(--lunas);border-color:var(--lunas)}
.pay.ok .tick svg{stroke:#fff}
.pay .tick svg{width:16px;height:16px;stroke:transparent;stroke-width:3}

/* ---------- progres titik ---------- */
.pips{display:flex;gap:4px;flex-wrap:wrap;margin-top:12px}
.pip{height:7px;flex:1 1 18px;max-width:34px;border-radius:99px;background:rgba(255,255,255,.3)}
.pip.ok{background:#8FE3B8}
.pip.part{background:#F6CE7A}

/* ---------- tabel ---------- */
.scroll-x{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;color:var(--ink-2);font-weight:700}
td.n,th.n{text-align:right}
tr.tot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}

/* ---------- navigasi ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav-in{max-width:900px;margin:0 auto;display:flex}
.nav button{flex:1;background:none;border:0;padding:6px 2px;color:var(--ink-2);display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:.68rem;font-weight:600;min-height:54px;border-radius:12px}
.nav button.on{color:var(--nil)}
.nav svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- identitas pemakai ---------- */
.me{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 12px;border-radius:99px;
  border:1.5px solid var(--line);background:#fff;font-size:.82rem;font-weight:600;color:var(--ink)}
.me i{width:8px;height:8px;border-radius:50%;background:var(--lunas);font-style:normal}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(21,34,31,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:600px){.scrim{align-items:center}}
.sheet{background:var(--paper);width:100%;max-width:520px;max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;
  padding:8px 16px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:600px){.sheet{border-radius:24px;max-height:88dvh}}
.grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:6px auto 2px}
.sheet-hd{position:sticky;top:0;background:var(--paper);padding:10px 0 12px;display:flex;align-items:center;gap:10px;z-index:2}
.sheet-hd h2{flex:1}
.x{background:none;border:0;font-size:1.5rem;line-height:1;color:var(--ink-2);min-width:44px;min-height:44px}

/* ---------- tab belanja: lega + font lebih kecil ---------- */
.belanja .card{padding:18px}
.belanja .card + .card,.belanja .card + .row,.belanja .row + .card{margin-top:14px}
.belanja .money input{font-size:1.45rem;min-height:58px}
.belanja .li{padding:14px 0;min-height:62px;gap:14px}
.belanja .li .bd b{font-size:.9rem;font-weight:600}
.belanja .li .bd span{font-size:.73rem;line-height:1.45;margin-top:3px;display:block}
.belanja .li .amt{font-size:.9rem}
.belanja .sec{margin:28px 0 12px}
.belanja .sec h2{font-size:.98rem}
.belanja .dsp{font-size:1.25rem !important}
.belanja .tiny{line-height:1.5}
.belanja .slide{padding:4px 16px 8px}
.belanja .chip{font-size:.84rem;min-height:42px}
.belanja input{font-size:.95rem}
.belanja .card > .row{gap:12px}

/* ---------- FAB bulat, zona jempol ---------- */
.fab{position:fixed;right:20px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:45;
  width:60px;height:60px;border-radius:50%;border:0;background:var(--saffron);color:#3B2B03;
  display:grid;place-items:center;box-shadow:0 8px 22px -6px rgba(232,160,32,.85);transition:transform .1s ease}
.fab:active{transform:scale(.94)}
.fab svg{width:28px;height:28px;stroke-width:2.6}
@media(min-width:900px){.fab{right:calc(50vw - 430px)}}

/* kartu bayar: area ketuk besar + tombol detail terpisah */
.pay{padding:0;overflow:hidden}
.paytap{flex:1;display:flex;align-items:center;gap:11px;padding:12px;background:none;border:0;color:inherit;
  font:inherit;text-align:left;min-height:68px;min-width:0}
.paymore{width:46px;align-self:stretch;background:none;border:0;border-left:1px solid var(--line);color:var(--ink-2)}
.paymore svg{width:18px;height:18px}
.split-note{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.9rem;color:var(--ink-2);
  background:var(--paper);border-radius:12px;padding:10px 12px}
.split-note b{color:var(--ink);font-size:1.05rem;font-family:"Bricolage Grotesque",sans-serif}

/* ---------- lain-lain ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(124px + env(safe-area-inset-bottom));
  background:var(--ink);color:#fff;padding:12px 17px;border-radius:14px;z-index:80;font-size:.88rem;max-width:88vw;
  box-shadow:0 12px 30px -12px rgba(21,34,31,.6)}
.empty{padding:24px 12px;text-align:center;color:var(--ink-2);font-size:.88rem;border:1.5px dashed var(--line);border-radius:15px}
.legend{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.legend div{display:flex;align-items:center;gap:8px;font-size:.8rem}
.legend i{width:11px;height:11px;border-radius:4px;flex:0 0 auto}
.legend .v{margin-left:auto;font-weight:700}
.rule{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.rule:last-child{border-bottom:0}
.rule .no{width:23px;height:23px;border-radius:8px;background:var(--saffron-pale);color:var(--sebagian);display:grid;
  place-items:center;font-size:.72rem;font-weight:700;flex:0 0 auto}
.scrollbox{max-height:176px;overflow:auto}

/* ---------- halaman depan ---------- */
.land{max-width:520px;margin:0 auto;padding:28px 18px 56px}
.brand{display:flex;align-items:center;gap:10px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.15rem}
.mark{width:36px;height:36px;border-radius:12px;background:var(--nil);color:#fff;display:grid;place-items:center;font-size:1rem}
.land h1{font-size:2.15rem;margin:26px 0 12px}
.land .lede{font-size:1.05rem;color:var(--ink-2);margin-bottom:22px}
.pt{display:flex;gap:11px;align-items:flex-start;padding:11px 0;font-size:.93rem}
.pt svg{width:20px;height:20px;flex:0 0 auto;margin-top:2px;stroke:var(--nil);fill:none;stroke-width:2.2}
.price{display:flex;align-items:baseline;gap:9px}
.price b{font-family:"Bricolage Grotesque",sans-serif;font-size:2rem}
.code-in{font-size:1.55rem;letter-spacing:.3em;text-align:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800}

/* ================= 3D, BAYANGAN, TEKAN ================= */
:root{
  --sh-1:0 1px 2px rgba(13,79,69,.06), 0 2px 6px rgba(13,79,69,.06);
  --sh-2:0 2px 4px rgba(13,79,69,.07), 0 10px 22px -10px rgba(13,79,69,.28);
  --sh-3:0 4px 8px rgba(13,79,69,.09), 0 18px 38px -14px rgba(13,79,69,.42);
}
.card{box-shadow:var(--sh-1);transition:box-shadow .26s ease, transform .22s cubic-bezier(.22,.8,.3,1)}
.land .card{box-shadow:var(--sh-2)}
.kas{box-shadow:var(--sh-3)}
.pay{box-shadow:var(--sh-1)}
.nav{box-shadow:0 -2px 16px -6px rgba(13,79,69,.22)}
.sheet{box-shadow:0 -10px 50px -12px rgba(13,79,69,.5)}

/* kartu miring halus saat disentuh/hover — kesan 3D */
.tilt{transform-style:preserve-3d}
@media(hover:hover){
  .tilt:hover{transform:translateY(-3px) rotateX(1.6deg);box-shadow:var(--sh-3)}
}

/* TEKAN: mengecil + masuk ke dalam, balik lagi dengan pantulan kecil */
.press{transition:transform .13s cubic-bezier(.3,.8,.4,1), box-shadow .13s ease, filter .13s ease}
.press:active{transform:scale(.955) translateY(1px);box-shadow:var(--sh-1);filter:brightness(.97)}
.press.pushed{animation:pushBack .32s cubic-bezier(.34,1.5,.5,1)}
@keyframes pushBack{0%{transform:scale(.94) translateY(2px)}55%{transform:scale(1.025) translateY(-1px)}100%{transform:none}}
.btn{box-shadow:var(--sh-1)}
.btn.gold{box-shadow:0 2px 4px rgba(232,160,32,.28), 0 10px 22px -10px rgba(232,160,32,.8)}
.fab{transition:transform .14s cubic-bezier(.3,.8,.4,1),box-shadow .18s ease}
.fab:active{transform:scale(.9)}
.fab.pushed{animation:pushBack .36s cubic-bezier(.34,1.6,.5,1)}
.tick{transition:background .22s ease,border-color .22s ease,transform .2s cubic-bezier(.34,1.5,.5,1)}

/* ---------- halaman depan: hero, ilustrasi, CTA ---------- */
.land3d{position:relative;z-index:1}
#bg3d{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;opacity:.85}
.hero-h1{font-size:2.25rem;line-height:1.08}
.art{margin:6px -6px 18px;perspective:900px}
.art svg{width:100%;height:auto;display:block}
.art .bar{transform-origin:50% 100%;animation:barUp .85s cubic-bezier(.22,.9,.3,1) both}
.art .b1{animation-delay:.05s}.art .b2{animation-delay:.15s}.art .b3{animation-delay:.25s}.art .b4{animation-delay:.35s}
@keyframes barUp{from{transform:scaleY(.05);opacity:0}to{transform:scaleY(1);opacity:1}}
.art .trend{stroke-dasharray:260;stroke-dashoffset:260;animation:draw 1.1s .45s cubic-bezier(.3,.8,.3,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.art .dot{opacity:0;animation:popIn .4s 1.4s cubic-bezier(.34,1.5,.5,1) forwards}
.art .coin{transform-origin:248px 58px;animation:coinFloat 3.6s 1.2s ease-in-out infinite}
@keyframes coinFloat{0%,100%{transform:translateY(0) rotateZ(0)}50%{transform:translateY(-7px) rotateZ(-4deg)}}

/* CTA utama: besar, kontras, timbul */
.cta-big{display:flex;align-items:center;gap:14px;width:100%;padding:20px 18px;border:0;border-radius:22px;
  background:linear-gradient(150deg,#17695C,#0D4F45 76%);color:#fff;text-align:left;
  box-shadow:0 6px 14px rgba(13,79,69,.28), 0 20px 40px -16px rgba(13,79,69,.75);position:relative;overflow:hidden}
.cta-big::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 100% at 85% -20%,rgba(232,160,32,.35),transparent 60%)}
.cta-ic{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:0 0 auto;position:relative;z-index:2}
.cta-ic svg{width:26px;height:26px;stroke:#fff;stroke-width:2}
.cta-tx{flex:1;position:relative;z-index:2}
.cta-tx b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.3rem;letter-spacing:-.02em}
.cta-tx span{font-size:.82rem;opacity:.82}

    closed: (bundle.periods||[]).filter(p=>p.status==='tertutup').map(p=>`${p.tahun}-${String(p.bulan).padStart(2,'0')}`)
  };
}
async function reloadHouse(){

}
function subscribeRealtime(houseId){

  const ch = sb.channel('house-'+houseId);

    ch.on('postgres_changes', {event:'*', schema:'public', table:tbl, filter:`house_id=eq.${houseId}`}, kick);
  });
  ch.on('postgres_changes', {event:'*', schema:'public', table:'houses', filter:`id=eq.${houseId}`}, kick);

  realtimeChannel = ch;
}

/* ---------- perhitungan ----------
   Semua hitungan dipakai belasan kali tiap render (kartu saldo, tiap baris
   anggota, grafik). Tanpa cache, satu render = puluhan kali menyapu seluruh
   array -> klik terasa berat. Cache dibuang tiap data berubah (bumpCalc).   */
let calcCache = new Map(), calcVer = 0;
function bumpCalc(){ calcVer++; calcCache = new Map(); }
function memo(key, fn){
  const k = calcVer + '|' + key;
  if(calcCache.has(k)) return calcCache.get(k);
  const v = fn(); calcCache.set(k, v); return v;
}
function aktif(h){ return memo('aktif', ()=> h.members.filter(m=>m.status==='aktif'||m.status==='cuti')); }

/* Iuran dibagi rata otomatis: belanja periode itu / jumlah anggota aktif.
   Kalau periode belum ada belanja, pakai nominal tetap (kalau diisi) supaya
   iuran awal bulan tetap bisa ditagih di muka. */
/* Bagi rata, tapi anggota yang punya iuran khusus dihitung duluan:
     sisa = belanja − jumlah iuran khusus
     share = ceil(sisa / jumlah anggota tanpa iuran khusus)
   Anggota tanpa iuran khusus bayar share; yang punya bayar nominalnya sendiri. */
function bagi(h, period){
  const p = period || thisPeriod();
  return memo('bagi:'+p, ()=>{
    const ms = aktif(h);
    const khusus = ms.filter(m=>m.nominal!=null && m.nominal>=0);
    const rata = ms.filter(m=>!(m.nominal!=null && m.nominal>=0));
    const belanja = keluar(h, p);
    const dasar = belanja > 0 ? belanja : tetap(h) * ms.length;   // belum ada belanja -> pakai cadangan
    const sisa = Math.max(0, dasar - khusus.reduce((a,b)=>a+(+b.nominal||0),0));
    const share = rata.length ? Math.ceil(sisa / rata.length) : 0;
    return { share, dasar, belanja, khususCount: khusus.length, rataCount: rata.length };
  });
}
function tagihanOf(h, memberId, period){
  const m = h.members.find(x=>x.id===memberId);
  if(m && m.nominal!=null && m.nominal>=0) return +m.nominal;
  return bagi(h, period).share;
}
function tagihan(h, period){ return bagi(h, period).share; }
function totalTagihan(h, period){
  return memo('totalTagihan:'+(period||thisPeriod()), ()=>
    aktif(h).reduce((a,m)=>a+tagihanOf(h,m.id,period),0));
}
function tetap(h){ return (h.setting.iuranTypes||[]).reduce((a,b)=>a+(+b.nominal||0),0); }
function paidOf(h, memberId, period){
  return memo('paid:'+memberId+':'+period, ()=>
    h.payments.filter(p=>p.memberId===memberId && p.period===period).reduce((a,b)=>a+(+b.nominal||0),0));
}
function statusOf(h, memberId, period){
  const p = paidOf(h, memberId, period), t = tagihanOf(h, memberId, period);
  if(p<=0) return 'belum';
  if(t>0 && p < t) return 'sebagian';
  return 'lunas';
}
function masuk(h, period){ return memo('masuk:'+period, ()=>
  h.payments.filter(p=>!period||p.period===period).reduce((a,b)=>a+(+b.nominal||0),0)); }
function keluar(h, period){ return memo('keluar:'+period, ()=>
  h.expenses.filter(e=>!period||e.tanggal.slice(0,7)===period).reduce((a,b)=>a+(+b.nominal||0),0)); }
function saldo(h){ return (+h.setting.saldoAwal||0) + masuk(h) - keluar(h); }
function saldoHingga(h, period){
  const mIn = h.payments.filter(p=>p.period<=period).reduce((a,b)=>a+(+b.nominal||0),0);
  const mOut = h.expenses.filter(e=>e.tanggal.slice(0,7)<=period).reduce((a,b)=>a+(+b.nominal||0),0);
  return (+h.setting.saldoAwal||0) + mIn - mOut;
}
function lastPeriods(n){
  const out=[]; let p=thisPeriod();
  for(let i=0;i<n;i++){ out.unshift(p); p=pShift(p,-1); }
  return out;
}
function locked(h, period){ return (h.closed||[]).includes(period); }

/* ---------- grafik (SVG tangan sendiri) ---------- */
const PIE_COLORS = ['#0E4A46','#E09B13','#1C8A57','#8A5FBF','#C2443B','#2C7DA0','#B47708','#56736D','#4E9A6B','#9A4E78'];
function donut(data){
  const total = data.reduce((a,b)=>a+b.v, 0);
  if(!total) return `<div class="empty">Belum ada pengeluaran pada periode ini.</div>`;
  const R=54, C=2*Math.PI*R; let off=0;
  const arcs = data.map((d,i)=>{
    const len = C*(d.v/total);
    const s = `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${PIE_COLORS[i%10]}" stroke-width="22"
      stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"
      transform="rotate(-90 70 70)"><title>${esc(d.k)}: ${egp(d.v)}</title></circle>`;
    off += len; return s;
  }).join('');
  const legend = data.map((d,i)=>`<div><i style="background:${PIE_COLORS[i%10]}"></i>${esc(d.k)}
    <span class="v">${Math.round(d.v/total*100)}% · ${egp(d.v)}</span></div>`).join('');
  return `<div class="row" style="align-items:center;gap:14px;flex-wrap:wrap">
    <svg viewBox="0 0 140 140" style="width:140px;height:140px;flex:0 0 auto" role="img" aria-label="Proporsi pengeluaran per kategori">
      ${arcs}
      <text x="70" y="66" text-anchor="middle" font-size="9" fill="#56736D" font-family="Plus Jakarta Sans">Total</text>
      <text x="70" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#102E2A" font-family="Bricolage Grotesque">${nf.format(total)}</text>
    </svg>
    <div class="legend sp" style="min-width:190px">${legend}</div></div>`;
}
function bars(rows){
  const max = Math.max(1, ...rows.map(r=>Math.max(r.in, r.out)));
  const W=320, H=150, pad=22, gw=(W-pad)/rows.length;
  const body = rows.map((r,i)=>{
    const x = pad + i*gw, bw=(gw-12)/2;
    const hi = (H-34)*(r.in/max), ho=(H-34)*(r.out/max);
    return `<rect x="${x+2}" y="${H-24-hi}" width="${bw}" height="${Math.max(hi,1)}" rx="3" fill="#1C8A57"><title>Masuk ${pShort(r.p)}: ${egp(r.in)}</title></rect>
      <rect x="${x+bw+6}" y="${H-24-ho}" width="${bw}" height="${Math.max(ho,1)}" rx="3" fill="#C2443B"><title>Keluar ${pShort(r.p)}: ${egp(r.out)}</title></rect>
      <text x="${x+gw/2-3}" y="${H-8}" font-size="9" text-anchor="middle" fill="#56736D">${pShort(r.p).split(' ')[0]}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Pemasukan dan pengeluaran 6 bulan terakhir" font-family="Plus Jakarta Sans">
    <line x1="${pad}" y1="${H-24}" x2="${W}" y2="${H-24}" stroke="#D6E3DE"/>
    <text x="0" y="14" font-size="9" fill="#56736D">${nf.format(max)}</text>${body}</svg>
    <div class="legend"><div><i style="background:#1C8A57"></i>Iuran masuk</div><div><i style="background:#C2443B"></i>Pengeluaran</div></div>`;
}
function line(rows){
  const vals = rows.map(r=>r.v), max=Math.max(...vals,1), min=Math.min(...vals,0);
  const W=320,H=120,pad=8;
  const x = i => pad + i*((W-pad*2)/Math.max(1,rows.length-1));
  const y = v => 14 + (H-34) * (1 - (v-min)/Math.max(1,(max-min)));
  const pts = rows.map((r,i)=>`${x(i).toFixed(1)},${y(r.v).toFixed(1)}`).join(' ');
  const dots = rows.map((r,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(r.v).toFixed(1)}" r="3" fill="#0E4A46"><title>${pShort(r.p)}: ${egp(r.v)}</title></circle>`).join('');
  const labels = rows.map((r,i)=>`<text x="${x(i).toFixed(1)}" y="${H-4}" font-size="9" text-anchor="middle" fill="#56736D">${pShort(r.p).split(' ')[0]}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Tren saldo kas" font-family="Plus Jakarta Sans">
    <polygon points="${pts} ${x(rows.length-1).toFixed(1)},${H-20} ${pad},${H-20}" fill="rgba(14,74,70,.10)"/>
    <polyline points="${pts}" fill="none" stroke="#0E4A46" stroke-width="2.2" stroke-linejoin="round"/>${dots}${labels}</svg>`;
}
function sparkline(rows){
  const vals = rows.map(r=>r.v), max=Math.max(...vals,1), min=Math.min(...vals,0);
  const pts = rows.map((r,i)=>`${i*(100/Math.max(1,rows.length-1))},${(40-36*((r.v-min)/Math.max(1,max-min))).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 100 44" preserveAspectRatio="none" aria-hidden="true">
    <polygon points="${pts} 100,44 0,44" fill="rgba(255,255,255,.16)"/>
    <polygon points="${pts} 100,44 0,44" fill="rgba(255,255,255,.16)"/>
    <polyline points="${pts}" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="1.6"/></svg>`;
}

/* ---------- LAPORAN ---------- */
function vLaporan(){
  const h = house(), p = S.period || thisPeriod();
  const lock = locked(h,p);
  const kat = {};
  h.expenses.filter(e=>e.tanggal.slice(0,7)===p).forEach(e=>{ kat[e.kategori]=(kat[e.kategori]||0)+ +e.nominal; });
  const rows = Object.entries(kat).sort((a,b)=>b[1]-a[1]);
  const inn = masuk(h,p), out = keluar(h,p);
  const awal = saldoHingga(h, pShift(p,-1)), akhir = awal + inn - out;
  const barRows = lastPeriods(6).map(x=>({p:x, in:masuk(h,x), out:keluar(h,x)}));
  return `${periodNav(p)}
    <div class="card mt-s">
      <h3>${esc(h.nama)} — ${pLabel(p)}</h3>
      <p class="tiny">Semua nilai dalam EGP.</p>

        <tr><td>Iuran masuk</td><td class="n">${nf.format(inn)}</td></tr>
        <tr><td>Belanja</td><td class="n">−${nf.format(out)}</td></tr>
        <tr class="tot"><td>Saldo akhir</td><td class="n">${nf.format(akhir)}</td></tr>

      <div class="sec"><h2>Per kategori</h2></div>

        <tbody>${rows.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${nf.format(v)}</td><td class="n">${out?Math.round(v/out*100):0}%</td></tr>`).join('')
          || '<tr><td colspan="3">Tidak ada belanja.</td></tr>'}</tbody></table></div>
      <div class="sec"><h2>Iuran per anggota</h2></div>
      <div class="scroll-x"><table><thead><tr><th>Anggota</th><th class="n">Dibayar</th><th>Status</th></tr></thead>
        <tbody>${aktif(h).map(m=>`<tr><td>${esc(m.nama)}</td><td class="n">${nf.format(paidOf(h,m.id,p))}</td><td>${statusOf(h,m.id,p)}</td></tr>`).join('')}</tbody></table></div>
    </div>

      <button class="btn soft sm" data-a="csv">Unduh CSV</button>
      <button class="btn soft sm" data-a="print">Cetak / PDF</button>

/* ---------- SIMULASI ---------- */
function vSimulasi(){
  const h = house();
  const d = S.sim || { orang: aktif(h).length||6, mode:'maju', iuran:1500,
    items: (h.setting.iuranTypes||[]).map(x=>({nama:x.nama, v:+x.nominal * (aktif(h).length||6)})) };
  S.sim = d;
  const total = d.items.reduce((a,b)=>a+(+b.v||0),0);
  const per = d.orang? total/d.orang : 0;
  const ok = per>=RANGE[0] && per<=RANGE[1];
  const dana = d.iuran * d.orang;
  const rata3 = lastPeriods(3).reduce((a,x)=>a+keluar(h,x),0)/3;
  return `<div class="slide">
      <button class="chip ${d.mode==='maju'?'on':''}" data-a="sim-mode" data-v="maju">Belanja → iuran</button>
      <button class="chip ${d.mode==='balik'?'on':''}" data-a="sim-mode" data-v="balik">Iuran → dana</button>
    </div>
    <div class="card mt-s">
      <label class="f"><span>Jumlah anggota</span>
        <input type="number" min="1" max="40" value="${d.orang}" data-a="sim-orang" inputmode="numeric"></label>
      ${d.mode==='maju'? `
        ${d.items.map((it,i)=>`<label class="f"><span>${esc(it.nama)} <span class="hint">per bulan</span></span>
          <input type="number" min="0" value="${it.v}" data-a="sim-item" data-i="${i}" inputmode="numeric"></label>`).join('')}
        <button class="btn soft sm" data-a="sim-add">+ Pos pengeluaran</button>
        <div class="scroll-x mt"><table><tbody>
          <tr><td>Total belanja</td><td class="n">${nf.format(total)}</td></tr>
          <tr><td>Dibagi</td><td class="n">${d.orang} orang</td></tr>
          <tr class="tot"><td>Iuran per orang</td><td class="n">${nf.format(Math.ceil(per))}</td></tr>
        </tbody></table></div>
        <div class="card pad-s mt" style="background:${ok?'var(--lunas-pale)':'var(--saffron-pale)'};border-color:transparent">
          <b>${ok?'Masih wajar':'Di luar rentang umum'}</b>
          <p class="tiny" style="margin:4px 0 0">Rentang umum ${nf.format(RANGE[0])}–${nf.format(RANGE[1])} EGP per orang.</p></div>
        <button class="btn block mt" data-a="sim-pakai" data-v="${Math.ceil(per)}">Pakai jadi nominal iuran</button>
      ` : `
        <label class="f"><span>Iuran per orang</span>
          <input type="number" min="0" value="${d.iuran}" data-a="sim-iuran" inputmode="numeric"></label>
        <div class="scroll-x"><table><tbody>
          <tr><td>Dana terkumpul</td><td class="n">${nf.format(dana)}</td></tr>
          <tr><td>Rata-rata belanja 3 bulan</td><td class="n">${nf.format(rata3)}</td></tr>
          <tr class="tot"><td>Selisih</td><td class="n">${nf.format(dana-rata3)}</td></tr>
        </tbody></table></div>
        <button class="btn block mt" data-a="sim-pakai" data-v="${d.iuran}">Pakai jadi nominal iuran</button>
      `}
    </div>`;
}

function renderLayer(){
  const L = document.getElementById('layer');
  const h = house();
  if(S.rulesPopup && h){
    const rs = (h.rules||[]).filter(r=>r.aktif).sort((a,b)=>a.urutan-b.urutan);
    L.innerHTML = sheet('Peraturan rumah', `
      <p class="muted">Kesepakatan bersama penghuni ${esc(h.nama)}.</p>
      <div class="card">${rs.map((r,i)=>`<div class="rule"><span class="no">${i+1}</span><div>${esc(r.teks)}</div></div>`).join('')}</div>
      <button class="btn block mt" data-a="rules-ok">Mengerti</button>`);
    return;
  }
  if(!S.sheet){ L.innerHTML=''; return; }
  const {name, id} = S.sheet;
  const p = S.period || thisPeriod();

  if(name==='bayar'){
    const m0 = id ? id : (aktif(h)[0]||{}).id;
    const t = m0? tagihanOf(h,m0,p) : 0;
    const m = id ? h.members.find(x=>x.id===id) : aktif(h)[0];
    const paid = m? paidOf(h,m.id,p) : 0;
    const riwayat = m? h.payments.filter(x=>x.memberId===m.id&&x.period===p) : [];
    L.innerHTML = sheet('Catat pembayaran', `
      ${locked(h,p)? '<p class="err">Buku bulan ini ditutup.</p>':''}
      <label class="f"><span>Anggota</span><select id="member">
        ${aktif(h).map(x=>`<option value="${x.id}" ${m&&m.id===x.id?'selected':''}>${esc(x.nama)}</option>`).join('')}</select></label>
      <label class="f"><span>Periode</span><select id="period">
        ${lastPeriods(6).slice().reverse().map(x=>`<option value="${x}" ${x===p?'selected':''}>${pLabel(x)}</option>`).join('')}</select></label>
      <label class="f"><span>Jumlah dibayar <span class="hint">tagihan ${nf.format(t)}${paid?`, sudah masuk ${nf.format(paid)}`:''}</span></span>

/* =====================================================================
   LATAR 3D (three.js) — koin & kartu melayang, ikut gerak scroll.
   Aturan main: hiasan, bukan beban. Mati sendiri kalau perangkat lemah,
   kalau user minta hemat gerak, kalau tab tidak terlihat, atau kalau
   three.js gagal dimuat. App tetap jalan penuh tanpa ini.
   ===================================================================== */
const Bg3D = (()=>{
  let renderer, scene, cam, benda = [], raf = 0, hidup = false, targetScroll = 0, curScroll = 0, t0 = 0;

  function bolehJalan(){
    if(typeof THREE === 'undefined') return false;
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return false;
    if((navigator.hardwareConcurrency || 4) < 4) return false;          // HP lemah
    if(navigator.deviceMemory && navigator.deviceMemory < 3) return false;
    if(navigator.connection && navigator.connection.saveData) return false;
    return true;
  }

  function start(){
    const cv = document.getElementById('bg3d');
    if(!cv || hidup) return;
    if(!bolehJalan()){ cv.style.display='none'; return; }
    try{
      renderer = new THREE.WebGLRenderer({canvas:cv, alpha:true, antialias:false, powerPreference:'low-power'});
    }catch(e){ cv.style.display='none'; return; }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.6));   // jangan 3x di HP retina
    renderer.setSize(window.innerWidth, window.innerHeight, false);

    scene = new THREE.Scene();
    cam = new THREE.PerspectiveCamera(52, window.innerWidth/window.innerHeight, 0.1, 100);
    cam.position.z = 14;

    scene.add(new THREE.AmbientLight(0xffffff, .72));
    const key = new THREE.DirectionalLight(0xffffff, .95); key.position.set(4,7,9); scene.add(key);
    const rim = new THREE.DirectionalLight(0xE8A020, .55); rim.position.set(-6,-3,4); scene.add(rim);

    const geoKoin  = new THREE.CylinderGeometry(1, 1, .17, 30);
    const geoKartu = new THREE.BoxGeometry(2.3, 1.5, .12);
    const emas = new THREE.MeshPhongMaterial({color:0xE8A020, shininess:70, specular:0x5a3d05});
    const hijau= new THREE.MeshPhongMaterial({color:0x0D4F45, shininess:45, specular:0x123f38});
    const krem = new THREE.MeshPhongMaterial({color:0xDCEBE6, shininess:30});

    const resep = [
      {g:geoKoin,  m:emas,  p:[-5.2, 3.6,-2], s:1.0},
      {g:geoKoin,  m:emas,  p:[ 5.6, 1.2,-4], s:.75},
      {g:geoKoin,  m:emas,  p:[-4.4,-4.2,-5], s:.6},
      {g:geoKartu, m:hijau, p:[ 4.6, 4.6,-3], s:1.0},
      {g:geoKartu, m:krem,  p:[-6.0,-.6,-6], s:.9},
      {g:geoKoin,  m:hijau, p:[ 2.4,-5.0,-4], s:.8}
    ];
    benda = resep.map((r,i)=>{
      const mesh = new THREE.Mesh(r.g, r.m);
      mesh.position.set(r.p[0], r.p[1], r.p[2]);
      mesh.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*.5);
      mesh.scale.setScalar(r.s);
      mesh.userData = {y0:r.p[1], spd:.18+ i*.045, amp:.32+ (i%3)*.12, par:.0016 + i*.0004};
      scene.add(mesh);
      return mesh;
    });

    hidup = true; t0 = performance.now();
    window.addEventListener('resize', onResize, {passive:true});
    window.addEventListener('scroll', onScroll, {passive:true});
    document.addEventListener('visibilitychange', onVis);
    loop();
  }

  function onResize(){
    if(!hidup) return;
    cam.aspect = window.innerWidth/window.innerHeight;
    cam.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight, false);
  }
  function onScroll(){ targetScroll = window.scrollY || 0; }
  function onVis(){ if(document.hidden){ cancelAnimationFrame(raf); raf=0; } else if(hidup && !raf){ loop(); } }

  function loop(){
    raf = requestAnimationFrame(loop);
    // scroll diperhalus: kejar target pelan-pelan, jadi gerakannya meluncur
    curScroll += (targetScroll - curScroll) * .075;
    const t = (performance.now() - t0) / 1000;
    for(const b of benda){
      const u = b.userData;
      b.position.y = u.y0 + Math.sin(t*u.spd*2.1) * u.amp - curScroll * u.par;
      b.rotation.y += .0022 + u.spd*.0016;
      b.rotation.x += .0011;
    }
    cam.position.y = -curScroll * .0012;
    renderer.render(scene, cam);
  }

  function stop(){
    if(!hidup) return;
    cancelAnimationFrame(raf); raf = 0; hidup = false;
    window.removeEventListener('resize', onResize);
    window.removeEventListener('scroll', onScroll);
    document.removeEventListener('visibilitychange', onVis);
    benda.forEach(b=>scene.remove(b)); benda = [];
    try{ renderer.dispose(); }catch(e){}
    renderer = scene = cam = null;
  }
  return { start, stop, get hidup(){ return hidup; } };
})();

/* =====================================================================
   ROUTER
   ===================================================================== */
const JUDUL = {beranda:null, tagihan:'Iuran & anggota', belanja:'Belanja', lainnya:'Lainnya',
  laporan:'Laporan bulanan', simulasi:'Simulasi iuran', 'jenis-iuran':'Nominal iuran', kategori:'Kategori belanja',
  peraturan:'Peraturan rumah', log:'Riwayat input', setting:'Setting rumah'};
/* Gambar ulang tanpa mengganggu yang sedang mengetik:
   simpan fokus + posisi kursor + posisi scroll, pasang lagi sesudahnya.
   Animasi masuk hanya dinyalakan saat layar benar-benar berganti. */
let viewKey = '';
function render(){
  const app = document.getElementById('app');
  const act = document.activeElement;
  const simpan = (act && act.id && (act.tagName==='INPUT'||act.tagName==='TEXTAREA'))
    ? {id:act.id, s:act.selectionStart, e:act.selectionEnd, v:act.value} : null;
  const sy = window.scrollY;
  const key = [S.route, S.tab, S.page, S.period, S.sheet&&S.sheet.name].join('/');
  const pindah = key !== viewKey;
  viewKey = key;
  document.body.classList.toggle('anim', pindah);
  if(S.route==='landing') app.innerHTML = vLanding();
  else if(S.route==='aktivasi') app.innerHTML = vAktivasi();
  else if(S.route==='masuk') app.innerHTML = vMasuk();
  else if(S.route==='owner') app.innerHTML = vOwner();
  else if(S.route==='siapa') app.innerHTML = vSiapa();
  else if(S.route==='app'){
    if(!house()){ S.route='landing'; return render(); }
    let inner = '', page = S.page;
    if(page==='laporan') inner = vLaporan();
    else if(page==='simulasi') inner = vSimulasi();
    else if(page==='jenis-iuran') inner = vJenisIuran();
    else if(page==='kategori') inner = vKategori();
    else if(page==='peraturan') inner = vPeraturan();
    else if(page==='log') inner = vLog();
    else if(page==='setting') inner = vSetting();
    else if(S.tab==='tagihan') inner = vTagihan();
    else if(S.tab==='belanja') inner = vBelanja();
    else if(S.tab==='lainnya') inner = vLainnya();
    else inner = vBeranda();
    const back = page? `<button class="btn ghost sm" data-a="tab" data-v="lainnya">← Lainnya</button>` : '';
    app.innerHTML = chrome((back? back : '') + inner, JUDUL[page || S.tab]);
  }
  renderLayer();
  if(simpan){
    const el = document.getElementById(simpan.id);
    if(el && el !== document.activeElement){
      if(el.value === '' && simpan.v) el.value = simpan.v;   // jangan hilangkan ketikan
      el.focus({preventScroll:true});
      try{ el.setSelectionRange(simpan.s, simpan.e); }catch(e){}
    }
  }
  if(!pindah && Math.abs(window.scrollY - sy) > 1) window.scrollTo({top:sy, behavior:'auto'});
  if(pindah) window.scrollTo({top:0, behavior:'auto'});
  // latar 3D cuma di halaman depan; layar lain harus ringan & fokus ke data
  if(S.route === 'landing'){ requestAnimationFrame(()=>Bg3D.start()); }
  else if(Bg3D.hidup){ Bg3D.stop(); }
}
function go(route){ S.route=route; S.page=null; S.sheet=null; render(); }
function openTab(t){ S.tab=t; S.page=null; S.sheet=null; S.period=null; render(); }
function closeSheet(){ S.sheet=null; renderLayer(); }
function ferr(msg){
  const e = document.getElementById('err-f') || document.getElementById('err-q');
  if(e){ e.textContent=msg; e.hidden=false; } else toast(msg);
}
const val = id => { const el=document.getElementById(id); return el? el.value.trim() : ''; };
const num = id => { const v=parseFloat(val(id)); return isNaN(v)?0:v; };
const chk = id => { const el=document.getElementById(id); return !!(el&&el.checked); };
function maybePopup(){
  const h = house(); if(!h) return;
  const rs = (h.rules||[]).filter(r=>r.aktif);
  const f = h.setting.popupFreq;
  if(!rs.length || f==='mati') return;
  if(f==='harian' && DB.session.rulesSeen === today()) return;
  DB.session.rulesSeen = today();
  S.rulesPopup = true;
}
// Sesudah login: kalau HP ini belum tahu "aku siapa", tanya sekali.
function afterLogin(){
  S.me = getMe();
  if(!S.me){ S.route='siapa'; }
  else { S.route='app'; S.tab='beranda'; maybePopup(); }
}

/* Umpan balik tekan: tombol memantul balik sesudah dilepas.
   Ditaruh di listener terpisah supaya animasi jalan lebih dulu,
   tidak menunggu aksi datanya selesai. */
document.addEventListener('pointerdown', (ev)=>{
  const b = ev.target.closest('.press, .fab, .btn, .chip, .paytap');
  if(!b) return;
  b.classList.remove('pushed');
  const lepas = ()=>{
    b.classList.add('pushed');
    setTimeout(()=>b.classList.remove('pushed'), 380);
    b.removeEventListener('pointerup', lepas);
    b.removeEventListener('pointerleave', lepas);
  };
  b.addEventListener('pointerup', lepas);
  b.addEventListener('pointerleave', lepas);
}, {passive:true});

document.addEventListener('click', async (ev)=>{
  const el = ev.target.closest('[data-a]');
  if(!el) return;
  const a = el.dataset.a, v = el.dataset.v, id = el.dataset.id;
  const h = house();
  if(a==='close-scrim' && ev.target !== el) return;

  switch(a){
    /* ---- navigasi ---- */
    case 'go': go(v); return;
    case 'close': case 'close-scrim': closeSheet(); return;
    case 'tab': openTab(v); return;
    case 'page': S.page=v; S.sheet=null; render(); return;
    case 'per': S.period = pShift(S.period||thisPeriod(), +v); render(); return;
    case 'sheet': S.sheet={name:v, id:id||null}; if(v==='checkout') S.step=1; renderLayer(); return;
    case 'rules-ok': S.rulesPopup=false; renderLayer(); return;
    case 'keluar': { stopRealtime(); await sb.auth.signOut(); DB={houses:{},session:{}}; go('landing'); return; }

    /* ---- identitas pemakai ---- */
    case 'ganti-aku': S.sheet={name:'aku'}; renderLayer(); return;
    case 'aku': {
      setMe(v); closeSheet();
      if(S.route==='siapa'){ S.route='app'; S.tab='beranda'; maybePopup(); }
      render(); toast('Halo, ' + v + '.'); return;
    }
    case 'aku-simpan': {
      const nama = val('aku-baru');
      if(!nama){ const e=document.getElementById('err-aku')||document.getElementById('err-f');
        if(e){e.textContent='Tulis dulu namamu.';e.hidden=false;} return; }
      if(chk('aku-daftar') && !h.members.some(m=>m.nama.toLowerCase()===nama.toLowerCase())){
        const ok = await doAction(async()=>{
          await insertRow('members', {house_id:h.id, nama, status:'aktif', tanggal_gabung:today()});
          await catatLog(nama, `Tambah anggota ${nama}`, 'members');
        });
        if(!ok) return;
      }
      setMe(nama); closeSheet();
      if(S.route==='siapa'){ S.route='app'; S.tab='beranda'; maybePopup(); }
      render(); toast('Halo, ' + nama + '.'); return;
    }

    /* ---- masuk & aktivasi ---- */
    case 'demo': {
      try{ await seedDemo(); afterLogin(); render(); }
      catch(e){ toast(e.message || 'Gagal menyiapkan rumah contoh.'); }
      return;
    }
    case 'aktivasi': {
      const kode=val('kode'), nama=val('nama'), kontak=val('kontak'), u=val('user'), p1=val('pass'), p2=val('pass2');
      const e = document.getElementById('err-kode');
      const show = m => { e.textContent=m; e.hidden=false; };
      e.hidden = true;
      if(!/^\d{9}$/.test(kode)) return show('Kode harus 9 angka.');
      if(!nama) return show('Isi nama rumah.');
      if(!u || u.length<3) return show('Username minimal 3 karakter.');
      if(p1.length<6) return show('Password minimal 6 karakter.');
      if(p1!==p2) return show('Dua password belum sama.');
      try{
        await signUpAndSignIn(u, p1);
        const { error } = await sb.rpc('redeem_code', { p_kode:kode, p_nama:nama, p_kontak:kontak });
        if(error) throw error;
        await reloadHouse();
        S.route='siapa'; render();
      }catch(err){
        show(err.message && /registered/i.test(err.message) ? 'Username sudah dipakai rumah lain.'
          : (err.message || 'Kode tidak ditemukan atau sudah terpakai.'));
      }
      return;
    }
    case 'masuk': {
      const u=val('user'), p=val('pass');
      const e = document.getElementById('err-login'); e.hidden=true;
      try{
        const { error } = await sb.auth.signInWithPassword({ email: emailFor(u), password: p });
        if(error) throw error;
        await reloadHouse(); afterLogin(); render();
      }catch(err){ e.textContent='Username atau password salah.'; e.hidden=false; }
      return;
    }

    /* ---- iuran: satu ketuk ---- */
    case 'toggle-bayar': {
      const p = S.period || thisPeriod();
      if(locked(h,p)) return toast('Buku periode ini ditutup.');
      const me = getMe(); if(!me){ S.sheet={name:'aku'}; renderLayer(); return; }
      const m = h.members.find(x=>x.id===id);
      const st = statusOf(h, id, p);
      const t = tagihanOf(h,id,p);
      if(st === 'belum'){
        if(!t){ S.sheet={name:'bayar', id}; renderLayer(); return toast('Belum ada belanja & iuran cadangan kosong — isi manual.'); }
        const tmp = 'tmp-'+uidLite();
        quick(
          ()=> h.payments.push({id:tmp, memberId:id, period:p, nominal:t, status:'lunas', tanggal:today(), dicatatOleh:me}),
          async()=>{
            await insertRow('payments', {house_id:h.id, member_id:id, periode:p, nominal:t, tanggal_bayar:today(), dicatat_oleh:me});
            await catatLog(me, `Tandai lunas ${m?m.nama:''} ${pShort(p)} ${nf.format(t)} EGP`, 'payments');
          },
          `${m?m.nama:''} lunas ${egp(t)}.`);
      } else {
        const recs = h.payments.filter(x=>x.memberId===id && x.period===p);
        quick(
          ()=>{ h.payments = h.payments.filter(x=>!(x.memberId===id && x.period===p)); },
          async()=>{
            for(const r of recs) if(!String(r.id).startsWith('tmp-')) await deleteRow('payments', r.id);
            await catatLog(me, `Batalkan catatan iuran ${m?m.nama:''} ${pShort(p)}`, 'payments');
          },
          'Dibatalkan.');
      }
      return;
    }
    case 'sv-bayar': {
      const p = val('period');
      if(locked(h,p)) return ferr('Buku periode itu ditutup.');
      const me = getMe(); if(!me) return ferr('Pilih dulu nama kamu di pojok atas.');
      const mid = val('member'); if(!mid) return ferr('Pilih anggota.');
      const n = num('nominal'); if(n<=0) return ferr('Nominal harus lebih dari 0.');
      const m = h.members.find(x=>x.id===mid);
      const ok = await doAction(async()=>{
        await insertRow('payments', {house_id:h.id, member_id:mid, periode:p, nominal:n, tanggal_bayar:val('tanggal')||today(), dicatat_oleh:me});
        await catatLog(me, `Catat iuran ${m?m.nama:''} ${pShort(p)} ${nf.format(n)} EGP`, 'payments');
      });
      if(ok){ closeSheet(); render(); toast('Iuran tercatat.'); }
      return;
    }
    case 'del-bayar': {
      const me = getMe()||'—';
      const ok = await doAction(async()=>{ await deleteRow('payments', id); await catatLog(me,'Hapus catatan iuran','payments'); });
      if(ok){ closeSheet(); render(); toast('Catatan dihapus.'); }
      return;
    }

    /* ---- belanja cepat ---- */
    case 'co-step': S.step = +v; renderLayer(); return;
    case 'salin-rek': {
      const t = BAYAR.rekening;
      try{ navigator.clipboard.writeText(t); toast('Nomor rekening disalin.'); }
      catch(e){ toast('Nomor: ' + t); }
      return;
    }
    case 'pilih-kat': S.kat = v; if(S.sheet) renderLayer(); else render(); return;
    case 'q-simpan': {
      const p = S.period || thisPeriod();
      if(locked(h,p)) return ferr('Buku periode ini ditutup.');
      const me = getMe(); if(!me){ S.sheet={name:'aku'}; renderLayer(); return; }
      const n = num('q-nominal'); if(n<=0) return ferr('Isi nominalnya dulu.');
      const d = val('q-deskripsi'); if(!d) return ferr('Tulis belanjanya untuk apa.');
      const kat = S.kat || (h.setting.kategori||[])[0] || 'Lain-lain';
      const ms = aktif(h).length;
      const tambahan = ms? Math.ceil(n/ms) : 0;
      quick(
        ()=>{ h.expenses.push({id:'tmp-'+uidLite(), tanggal:today(), kategori:kat, deskripsi:d, nominal:n, besar:false, dicatatOleh:me, bukti:''});
              const el1=document.getElementById('q-nominal'), el2=document.getElementById('q-deskripsi');
              if(el1) el1.value=''; if(el2) el2.value=''; },
        async()=>{
          await insertRow('expenses', {house_id:h.id, tanggal:today(), kategori:kat, deskripsi:d, nominal:n, is_besar:false, dicatat_oleh:me});
          await catatLog(me, `Catat belanja ${d} ${nf.format(n)} EGP`, 'expenses');
        },
        ms? `${egp(n)} · ${kat} — tagihan/orang +${nf.format(tambahan)}` : `Tercatat ${egp(n)} · ${kat}`);
      if(S.sheet && S.sheet.name==='cepat') closeSheet();
      return;
    }
    case 'sv-belanja': {
      const tgl = val('tanggal')||today();
      if(locked(h, tgl.slice(0,7))) return ferr('Buku periode itu ditutup.');
      const me = getMe(); if(!me) return ferr('Pilih dulu nama kamu di pojok atas.');
      const d = val('deskripsi'); if(!d) return ferr('Tulis belanjanya untuk apa.');
      const n = num('nominal'); if(n<=0) return ferr('Nominal harus lebih dari 0.');
      const data = {tanggal:tgl, kategori:val('kategori'), deskripsi:d, nominal:n, is_besar:chk('besar'), dicatat_oleh:me, bukti_foto_url:val('bukti')||null};
      const ok = await doAction(async()=>{
        if(id){ await updateRow('expenses', id, data); await catatLog(me, `Ubah belanja ${d}`, 'expenses'); }
        else { await insertRow('expenses', {house_id:h.id, ...data}); await catatLog(me, `Catat belanja ${d} ${nf.format(n)} EGP`, 'expenses'); }
      });
      if(ok){ closeSheet(); render(); toast('Tersimpan.'); }
      return;
    }
    case 'del-belanja': {
      const me = getMe()||'—';
      const rec = h.expenses.find(x=>x.id===id);
      const ok = await doAction(async()=>{ await deleteRow('expenses', id); await catatLog(me, `Hapus belanja ${rec?rec.deskripsi:''}`, 'expenses'); });
      if(ok){ closeSheet(); render(); toast('Dihapus.'); }
      return;
    }
    case 'sv-rencana': {
      const me = getMe(); if(!me) return ferr('Pilih dulu nama kamu di pojok atas.');
      const d = val('deskripsi'); if(!d) return ferr('Tulis rencananya.');
      const ok = await doAction(async()=>{
        await insertRow('planned_expenses', {house_id:h.id, tanggal_rencana:val('tanggal')||today(), deskripsi:d, estimasi_nominal:num('nominal'), dicatat_oleh:me});
        await catatLog(me, `Tambah rencana ${d}`, 'planned_expenses');
      });
      if(ok){ closeSheet(); render(); toast('Rencana dicatat.'); }
      return;
    }
    case 'sv-realisasi': {
      const me = getMe(); if(!me) return ferr('Pilih dulu nama kamu di pojok atas.');
      const pl = h.planned.find(x=>x.id===id);
      const tgl = val('tanggal')||today();
      if(locked(h, tgl.slice(0,7))) return ferr('Buku periode itu ditutup.');
      const ok = await doAction(async()=>{
        await insertRow('expenses', {house_id:h.id, tanggal:tgl, kategori:val('kategori'), deskripsi:pl.deskripsi, nominal:num('nominal'), is_besar:chk('besar'), dicatat_oleh:me});
        await updateRow('planned_expenses', id, {status:'selesai'});
        await catatLog(me, `Realisasi rencana ${pl.deskripsi}`, 'expenses');
      });
      if(ok){ closeSheet(); render(); toast('Jadi belanja.'); }
      return;
    }
    case 'hapus-rencana': {
      const ok = await doAction(async()=>{ await deleteRow('planned_expenses', id); await catatLog(getMe()||'—','Hapus rencana','planned_expenses'); });
      if(ok){ closeSheet(); render(); }
      return;
    }

    /* ---- anggota ---- */
    case 'q-anggota': {
      const me = getMe();
      const nama = val('q-anggota'); if(!nama) return ferr('Ketik nama dulu.');
      if(h.members.some(m=>m.nama.toLowerCase()===nama.toLowerCase())) return ferr(nama + ' sudah ada di daftar.');
      if(!getMe()) setMe(nama);
      quick(
        ()=>{ h.members.push({id:'tmp-'+uidLite(), nama, kamar:null, status:'aktif', tglGabung:today(), tglKeluar:null});
              const el=document.getElementById('q-anggota'); if(el){ el.value=''; el.focus(); } },
        async()=>{
          await insertRow('members', {house_id:h.id, nama, status:'aktif', tanggal_gabung:today()});
          await catatLog(me||nama, `Tambah anggota ${nama}`, 'members');
        },
        nama + ' ditambahkan.');
      return;
    }
    case 'sv-anggota': {
      const me = getMe()||'—';
      const nama = val('nama'); if(!nama) return ferr('Isi nama anggota.');
      const raw = val('nominal-iuran');
      const data = {nama, no_kamar:val('kamar')||null, status:val('status'), tanggal_gabung:val('gabung')||today(),
        tanggal_keluar:val('keluar')||null, nominal_iuran: raw==='' ? null : (parseFloat(raw)||0)};
      const ok = await doAction(async()=>{
        if(id){ await updateRow('members', id, data); await catatLog(me, `Ubah data anggota ${nama}`, 'members'); }
        else { await insertRow('members', {house_id:h.id, ...data}); await catatLog(me, `Tambah anggota ${nama}`, 'members'); }
      });
      if(ok){ closeSheet(); render(); toast('Tersimpan.'); }
      return;
    }
    case 'del-anggota': {
      const rec = h.members.find(x=>x.id===id);
      const ok = await doAction(async()=>{ await deleteRow('members', id); await catatLog(getMe()||'—', `Hapus anggota ${rec?rec.nama:''}`, 'members'); });
      if(ok){ closeSheet(); render(); }
      return;
    }

    /* ---- peraturan ---- */
    case 'q-rule': {
      const teks = val('q-rule'); if(!teks) return ferr('Tulis peraturannya.');
      const me = getMe()||'—';
      const ok = await doAction(async()=>{
        await insertRow('house_rules', {house_id:h.id, deskripsi:teks, aktif:true, urutan:(h.rules.length+1)});
        await catatLog(me,'Tambah peraturan rumah','house_rules');
      });
      if(ok){ render(); toast('Peraturan ditambahkan.'); }
      return;
    }
    case 'sv-peraturan': {
      const teks = val('teks'); if(!teks) return ferr('Tulis isi peraturannya.');
      const me = getMe()||'—';
      const ok = await doAction(async()=>{
        if(id){ await updateRow('house_rules', id, {deskripsi:teks, aktif:chk('aktif')}); await catatLog(me,'Ubah peraturan','house_rules'); }
        else { await insertRow('house_rules', {house_id:h.id, deskripsi:teks, aktif:chk('aktif'), urutan:(h.rules.length+1)}); await catatLog(me,'Tambah peraturan','house_rules'); }
      });
      if(ok){ closeSheet(); render(); toast('Tersimpan.'); }
      return;
    }
    case 'del-peraturan': {
      const ok = await doAction(async()=>{
        await deleteRow('house_rules', id);
        const sisa = h.rules.filter(x=>x.id!==id).sort((a,b)=>a.urutan-b.urutan);
        for(let i=0;i<sisa.length;i++) if(sisa[i].urutan!==i+1) await updateRow('house_rules', sisa[i].id, {urutan:i+1});
        await catatLog(getMe()||'—','Hapus peraturan','house_rules');
      });
      if(ok){ closeSheet(); render(); }
      return;
    }
    case 'rule-move': {
      const rs = h.rules.slice().sort((a,b)=>a.urutan-b.urutan);
      const i = rs.findIndex(x=>x.id===id), j = i + (+v);
      if(i<0||j<0||j>=rs.length) return;
      const ok = await doAction(async()=>{
        await updateRow('house_rules', rs[i].id, {urutan: rs[j].urutan});
        await updateRow('house_rules', rs[j].id, {urutan: rs[i].urutan});
      });
      if(ok) render();
      return;
    }

    /* ---- jenis iuran & kategori ---- */
    case 'q-jenis': {
      const nama = val('q-jenis'); if(!nama) return ferr('Isi nama iuran.');
      const n = parseFloat(val('q-jenis-nom'))||0;
      const ok = await doAction(async()=>{
        await insertRow('iuran_types', {house_id:h.id, nama_iuran:nama, nominal_default:n});
        await catatLog(getMe()||'—', `Tambah iuran ${nama}`, 'iuran_types');
      });
      if(ok){ render(); toast('Ditambahkan.'); }
      return;
    }
    case 'sv-jenis': {
      const nama = val('nama'); if(!nama) return ferr('Isi nama iuran.');
      const n = num('nominal');
      const ok = await doAction(async()=>{
        if(id){ await updateRow('iuran_types', id, {nama_iuran:nama, nominal_default:n}); }
        else { await insertRow('iuran_types', {house_id:h.id, nama_iuran:nama, nominal_default:n}); }
        await catatLog(getMe()||'—', `Atur iuran ${nama}`, 'iuran_types');
      });
      if(ok){ closeSheet(); render(); toast('Tersimpan.'); }
      return;
    }
    case 'del-jenis': {
      const ok = await doAction(async()=>{ await deleteRow('iuran_types', id); await catatLog(getMe()||'—','Hapus jenis iuran','iuran_types'); });
      if(ok){ closeSheet(); render(); }
      return;
    }
    case 'q-kat': {
      const k = val('q-kat'); if(!k) return;
      if(h.setting.kategori.includes(k)) return ferr('Kategori itu sudah ada.');
      const ok = await doAction(()=>updateRow('houses', h.id, {kategori: h.setting.kategori.concat(k)}));
      if(ok){ render(); toast('Kategori ditambahkan.'); }
      return;
    }
    case 'kat-hapus': {
      const ok = await doAction(()=>updateRow('houses', h.id, {kategori: h.setting.kategori.filter(k=>k!==v)}));
      if(ok) render();
      return;
    }

    /* ---- password ---- */
    case 'sv-pass': {
      const p0=val('p0'), p1=val('p1'), p2=val('p2');
      if(p1.length<6) return ferr('Password baru minimal 6 karakter.');
      if(p1!==p2) return ferr('Dua password belum sama.');
      try{
        const { error:e1 } = await sb.auth.signInWithPassword({ email: emailFor(h.auth.username), password: p0 });
        if(e1) return ferr('Password lama salah.');
        const { error:e2 } = await sb.auth.updateUser({ password: p1 });
        if(e2) throw e2;
        await catatLog(getMe()||'—','Ganti password rumah','houses');
        closeSheet(); toast('Password diganti. Kabari penghuni lain.');
      }catch(err){ ferr(err.message || 'Gagal mengganti password.'); }
      return;
    }

    /* ---- laporan ---- */
    case 'print': window.print(); return;
    case 'csv': {
      const p = S.period||thisPeriod();
      const rows = [['Laporan', h.nama, pLabel(p)], [], ['Anggota','Dibayar (EGP)','Status']];
      aktif(h).forEach(m=>rows.push([m.nama, paidOf(h,m.id,p), statusOf(h,m.id,p)]));
      rows.push([], ['Tanggal','Kategori','Deskripsi','Nominal (EGP)','Besar','Dicatat oleh']);
      h.expenses.filter(e=>e.tanggal.slice(0,7)===p).forEach(e=>rows.push([e.tanggal,e.kategori,e.deskripsi,e.nominal,e.besar?'ya':'',e.dicatatOleh]));
      rows.push([], ['Saldo awal', saldoHingga(h,pShift(p,-1))], ['Iuran masuk', masuk(h,p)], ['Belanja', keluar(h,p)], ['Saldo akhir', saldoHingga(h,p)]);
      unduh(`igarin-${p}.csv`, rows.map(r=>r.map(x=>`"${String(x==null?'':x).replace(/"/g,'""')}"`).join(',')).join('\n'));
      return;
    }
    case 'tutup-buku': {
      const p = S.period||thisPeriod();
      const [y,m] = p.split('-').map(Number);
      const akanTutup = !locked(h,p);
      const ok = await doAction(async()=>{
        const { error } = await sb.rpc('set_period_status', { p_bulan:m, p_tahun:y, p_status: akanTutup?'tertutup':'terbuka' });
        if(error) throw error;
        await catatLog(getMe()||'—', akanTutup? `Tutup buku ${pLabel(p)}` : `Buka kembali buku ${pLabel(p)}`, 'periods');
      });
      if(ok){ render(); toast(akanTutup? `Buku ${pLabel(p)} ditutup.` : `Buku ${pLabel(p)} dibuka kembali.`); }
      return;
    }

    /* ---- simulasi ---- */
    case 'sim-mode': S.sim.mode=v; render(); return;
    case 'sim-add': { const nama = prompt('Nama pos pengeluaran'); if(nama) S.sim.items.push({nama, v:0}); render(); return; }
    case 'sim-pakai': {
      const target = +v, types = h.setting.iuranTypes||[], cur = tetap(h);
      const ok = await doAction(async()=>{
        if(!types.length || !cur){ await insertRow('iuran_types', {house_id:h.id, nama_iuran:'Iuran bulanan', nominal_default:target}); }
        else { const f = target/cur; for(const t of types) await updateRow('iuran_types', t.id, {nominal_default: Math.round(t.nominal*f)}); }
        await catatLog(getMe()||'—', `Set iuran ${nf.format(target)} EGP per orang`, 'iuran_types');
      });
      if(ok){ S.page=null; S.tab='tagihan'; render(); toast('Nominal iuran jadi ' + egp(target) + ' per orang.'); }
      return;
    }

    /* ---- panel pemilik ---- */
    case 'owner-unlock': {
      const pass = val('ownpass');
      try{
        const { data, error } = await sb.rpc('owner_bundle', { p_passcode: pass });
        if(error) throw error;
        S.owner = data; S.ownerPass = pass; render();
      }catch(err){ const e=document.getElementById('err-own'); e.textContent='Sandi salah.'; e.hidden=false; }
      return;
    }
    case 'own-filter': S.filter=v; render(); return;
    case 'own-batch': {
      try{
        const { data:n, error } = await sb.rpc('owner_generate_codes', { p_passcode:S.ownerPass, p_n:100 });
        if(error) throw error;
        const { data } = await sb.rpc('owner_bundle', { p_passcode:S.ownerPass });
        S.owner = data; render(); toast(n + ' kode ditambahkan.');
      }catch(err){ toast(err.message); }
      return;
    }
    case 'own-csv': {
      const rows = [['kode','status','rumah','tanggal_terpakai','batch']].concat(
        (S.owner.codes||[]).map(c=>[c.kode, c.status, c.nama_rumah||'', c.tgl_terpakai||'', c.batch]));
      unduh('igarin-kode.csv', rows.map(r=>r.join(',')).join('\n')); return;
    }
    case 'sv-sale': {
      const nama=val('nama'); if(!nama) return ferr('Isi nama pembeli.');
      const kode=val('kode'); if(!kode) return ferr('Tidak ada kode tersedia.');
      try{
        const { error } = await sb.rpc('owner_record_sale', { p_passcode:S.ownerPass, p_nama:nama, p_kontak:val('kontak'), p_kode:kode, p_nominal:num('nominal') });
        if(error) throw error;
        const { data } = await sb.rpc('owner_bundle', { p_passcode:S.ownerPass });
        S.owner = data; closeSheet(); render(); toast('Tercatat. Kirim kode ' + kode + ' ke pembeli.');
      }catch(err){ ferr(err.message); }
      return;
    }
  }
});

/* Enter di kolom cepat = simpan, supaya tidak perlu pindah tangan ke tombol */
document.addEventListener('keydown', async (ev)=>{
  if(ev.key === 'Escape'){ if(S.rulesPopup) S.rulesPopup=false; S.sheet=null; renderLayer(); return; }
  if(ev.key !== 'Enter') return;
  const t = ev.target;
  if(!t || !t.id) return;
  const map = {'q-anggota':'q-anggota','q-deskripsi':'q-simpan','q-nominal':'q-simpan','q-rule':'q-rule','q-kat':'q-kat','q-jenis-nom':'q-jenis','aku-baru':'aku-simpan'};
  const aksi = map[t.id];
  if(!aksi) return;
  ev.preventDefault();
  const btn = document.querySelector(`[data-a="${aksi}"]`);
  if(btn) btn.click();
});

document.addEventListener('change', async (ev)=>{
  const el = ev.target.closest('[data-a]'); if(!el) return;
  const a = el.dataset.a, h = house();
  if(a==='sim-orang'){ S.sim.orang = Math.max(1, parseInt(el.value)||1); render(); }
  else if(a==='sim-item'){ S.sim.items[+el.dataset.i].v = parseFloat(el.value)||0; render(); }
  else if(a==='sim-iuran'){ S.sim.iuran = parseFloat(el.value)||0; render(); }
  else if(a==='set-nama'){ await doAction(()=>updateRow('houses', h.id, {nama_rumah: el.value.trim()||h.nama})); render(); }
  else if(a==='set-kontak'){ await doAction(()=>updateRow('houses', h.id, {kontak: el.value.trim()})); }
  else if(a==='set-waktu'){ await doAction(()=>updateRow('houses', h.id, {waktu_penagihan: el.value})); render(); }
  else if(a==='set-saldo'){ await doAction(()=>updateRow('houses', h.id, {saldo_awal: parseFloat(el.value)||0})); render(); }
  else if(a==='set-popup'){ await doAction(()=>updateRow('houses', h.id, {popup_freq: el.value})); render(); }
});

function unduh(nama, teks){
  try{
    const b = new Blob([teks], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = nama; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    toast('Berkas diunduh.');
  }catch(e){
    const w = window.open('', '_blank');
    if(w){ w.document.write('<pre>'+esc(teks)+'</pre>'); toast('Unduhan diblokir, dibuka di tab baru.'); }
    else toast('Unduhan diblokir peramban.');
  }
}

/* ---------- mulai ---------- */
(async function(){
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if(session){ await reloadHouse(); afterLogin(); }
  }catch(e){}
  render();
  sb.rpc('stok_tersedia').then(({data,error})=>{ if(!error){ stokTersedia = data; if(S.route==='landing') render(); } });
})();
