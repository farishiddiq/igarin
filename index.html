<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Igarin — Catatan Belanja Rumah</title>
<meta name="theme-color" content="#EDEFEA">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Igarin">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%230E2A22'/%3E%3Cpath d='M14 42c7-2 11-10 16-18 4 7 8 11 12 12s6-1 8-4' stroke='%23CFF27B' stroke-width='5.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230E2A22'/%3E%3Cpath d='M14 42c7-2 11-10 16-18 4 7 8 11 12 12s6-1 8-4' stroke='%23CFF27B' stroke-width='5.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDEFEA; --card:#fff; --soft:#F2F4F0; --ink:#0D1411; --ink-2:#67706B; --ink-3:#9AA29D; --line:#E3E6E0;
  --forest:#0E2A22; --forest-2:#1A4A3C; --lime:#CFF27B; --lime-2:#B4E052; --lime-ink:#1B2505;
  --red:#D93F31; --red-pale:#FCE6E3; --green:#178A4B; --green-pale:#DDF3E5;
  --r-lg:28px; --r:22px;
  --sh:0 1px 2px rgba(14,42,34,.04),0 10px 26px -14px rgba(14,42,34,.2);
  --sh-lg:0 26px 50px -22px rgba(14,42,34,.55);
  --sb:env(safe-area-inset-bottom); --st:env(safe-area-inset-top);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Urbanist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.02em}
p{margin:0}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2.5px solid var(--forest);outline-offset:2px;border-radius:12px}
svg.i{width:22px;height:22px;flex:0 0 auto}
.sp{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.mt{margin-top:16px}.mt-s{margin-top:10px}.mt-l{margin-top:26px}
.muted{color:var(--ink-2);font-size:.9rem}
.tiny{color:var(--ink-2);font-size:.78rem}
.center{text-align:center}

/* ---------- kerangka ---------- */
.app{max-width:480px;margin:0 auto;min-height:100dvh;padding:calc(var(--st) + 10px) 18px calc(118px + var(--sb))}
.top{display:flex;align-items:center;gap:12px;padding:6px 0 18px}
.top .who{flex:1;min-width:0}
.top .who small{display:block;font-size:.8rem;color:var(--ink-2);font-weight:500}
.top .who b{display:block;font-size:1.15rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.95rem;
  background:var(--lime);color:var(--lime-ink);flex:0 0 auto}
.av.sm{width:40px;height:40px;font-size:.85rem}
.icb{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:var(--sh);position:relative;flex:0 0 auto}
.icb .dot{position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:99px;background:var(--lime);color:var(--lime-ink);
  font-size:.64rem;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.tbar{display:flex;align-items:center;gap:12px;padding:6px 0 18px}
.tbar h1{flex:1;text-align:center;font-size:1.2rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar .ph{width:46px;flex:0 0 auto}

/* ---------- kartu utama gelap ---------- */
.hero{position:relative;overflow:hidden;border-radius:var(--r-lg);background:var(--forest);color:#fff;box-shadow:var(--sh-lg)}
.hero .hin{position:relative;padding:22px 22px 18px}
.hero::before{content:"";position:absolute;right:-70px;top:-90px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(207,242,123,.26),transparent 66%)}
.hero .wave{position:absolute;left:0;right:0;bottom:62px;width:100%;height:80px;opacity:.55}
.lbl{font-size:.85rem;color:rgba(255,255,255,.68);font-weight:500}
.big{font-size:2.65rem;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin-top:4px}
.big .dec{opacity:.42}
.big .cur{font-size:.9rem;font-weight:700;opacity:.55;margin-left:6px;letter-spacing:0}
.hero .strip{position:relative;display:flex;align-items:center;gap:10px;background:var(--lime);color:var(--lime-ink);padding:14px 22px}
.hero .strip small{display:block;font-size:.72rem;font-weight:600;opacity:.7}
.hero .strip b{font-size:1.05rem;font-weight:800}
.pill{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:99px;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill svg{width:14px;height:14px}
.pill.lime{background:var(--lime);color:var(--lime-ink)}
.pill.glass{background:rgba(255,255,255,.12);color:#fff}
.pill.up{background:var(--red-pale);color:var(--red)}
.pill.down{background:var(--green-pale);color:var(--green)}
.pill.soft{background:var(--soft);color:var(--ink-2)}

/* ---------- aksi cepat ---------- */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;background:#fff;border-radius:var(--r);padding:14px 6px 12px;box-shadow:var(--sh)}
.qa button{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:.8rem;font-weight:600}
.qa .c{width:54px;height:54px;border-radius:50%;background:var(--soft);display:grid;place-items:center;transition:transform .15s}
.qa button:first-child .c{background:var(--lime);color:var(--lime-ink)}
.qa button:active .c{transform:scale(.9)}

/* ---------- judul bagian ---------- */
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 2px 12px}
.sec h2{font-size:1.1rem;font-weight:700}
.link{font-size:.86rem;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:2px;min-height:36px}
.link svg{width:16px;height:16px}

/* ---------- kartu kategori warna-warni (model dompet) ---------- */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kc{position:relative;display:flex;flex-direction:column;width:100%;height:100%;padding-top:14px;color:#fff;border-radius:22px;transition:transform .15s}
.kc:active{transform:scale(.97)}
.kc::before{content:"";position:absolute;inset:0 0 auto 0;height:64px;border-radius:22px;background:var(--c);filter:brightness(.85)}
.kc::after{content:"";position:absolute;left:9px;right:9px;top:6px;height:40px;border-radius:14px;background:rgba(255,255,255,.92)}
.kc .face{flex:1;position:relative;z-index:1;background:var(--c);border-radius:20px;padding:14px;min-height:118px;
  display:flex;flex-direction:column;justify-content:space-between;gap:10px;box-shadow:0 -6px 14px -8px rgba(0,0,0,.25)}
.kc .ico{width:36px;height:36px;border-radius:12px;background:rgba(0,0,0,.16);display:grid;place-items:center}
.kc .ico svg{width:19px;height:19px}
.kc .nm,.kc .am,.kc .bar{display:block}
.kc .nm{font-size:.86rem;font-weight:600;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc .am{font-size:1.28rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kc .am small{font-size:.68rem;font-weight:700;opacity:.75;margin-left:3px}
.kc .bar{height:5px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden;margin-top:7px}
.kc .bar i{display:block;height:100%;background:#fff;border-radius:99px}
.kbar{display:flex;gap:4px;height:12px}
.kbar span{border-radius:99px;min-width:8px}

/* ---------- kartu & daftar transaksi ---------- */
.card{background:#fff;border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.card.list{padding:4px 16px}
.tx{display:flex;align-items:center;gap:12px;padding:12px 0;width:100%;min-height:66px}
.tx+.tx{border-top:1px solid var(--line)}
.ti{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--cp,var(--soft));color:var(--c,var(--ink));flex:0 0 auto}
.ti svg{width:21px;height:21px}
.tx .bd{flex:1;min-width:0}
.tx .bd b{display:block;font-weight:600;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx small{display:block;font-size:.78rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .rt{text-align:right;flex:0 0 auto;max-width:44%}
.tx .rt b{display:block;font-weight:700;font-size:.98rem}
.glabel{display:flex;align-items:center;gap:10px;font-size:.7rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 0}
.glabel::after{content:"";flex:1;height:1px;background:var(--line)}
.empty{padding:26px 14px;text-align:center;color:var(--ink-2);font-size:.9rem}
.tag{display:inline-block;padding:3px 9px;border-radius:99px;font-size:.7rem;font-weight:700;background:var(--soft);color:var(--ink-2)}
.tag.lime{background:var(--lime);color:var(--lime-ink)}
.tag.red{background:var(--red-pale);color:var(--red)}

/* ---------- kontrol ---------- */
.seg{display:flex;background:#fff;border-radius:99px;padding:4px;gap:4px}
.seg button{flex:1;min-height:42px;border-radius:99px;font-size:.9rem;font-weight:600;color:var(--ink-2);text-align:center;transition:background .2s,color .2s}
.seg button.on{background:var(--lime);color:var(--lime-ink)}
.dark .seg{background:rgba(255,255,255,.08)}
.dark .seg button{color:rgba(255,255,255,.62)}
.dark .seg button.on{color:var(--lime-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:40px;padding:0 15px;border-radius:99px;background:#fff;border:1.5px solid var(--line);font-size:.88rem;font-weight:600;
  white-space:nowrap;display:inline-flex;align-items:center;gap:7px;transition:background .18s,border-color .18s}
.chip.on{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.pnav{display:flex;align-items:center;gap:10px}
.pnav b{flex:1;text-align:center;font-size:1rem;font-weight:700}
.pnav button{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:var(--sh)}
.pnav button[disabled]{opacity:.35}
.dark .pnav button{background:rgba(255,255,255,.1);box-shadow:none;color:#fff}
.dark .pnav b{color:#fff}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 22px;border-radius:99px;font-weight:700;
  font-size:1rem;background:var(--forest);color:#fff;text-align:center;transition:transform .12s,filter .15s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn svg{width:19px;height:19px}
.btn.lime{background:var(--lime);color:var(--lime-ink)}
.btn.soft{background:var(--soft);color:var(--ink)}
.btn.line{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.red{background:var(--red-pale);color:var(--red)}
.btn.block{width:100%}
.btn.sm{min-height:42px;padding:0 16px;font-size:.88rem}
.btn[disabled]{opacity:.45;pointer-events:none}

.f{display:block;margin-bottom:14px}
.f>span{display:block;font-size:.82rem;font-weight:600;color:var(--ink-2);margin:0 0 6px 4px}
.in{width:100%;min-height:52px;border-radius:16px;border:1.5px solid transparent;background:var(--soft);padding:12px 16px;font-size:1rem;outline:none;-webkit-appearance:none;appearance:none}
.in:focus{border-color:var(--forest);background:#fff}
textarea.in{min-height:92px;resize:vertical}
select.in{background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);
  background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
.code-in{font-size:1.6rem;letter-spacing:.28em;text-align:center;font-weight:800}
.err{color:var(--red);font-size:.86rem;font-weight:600;margin:2px 4px 12px}
.check{display:flex;align-items:center;gap:10px;min-height:46px;font-weight:500}
.check input{width:22px;height:22px;accent-color:var(--forest)}
.field{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:18px;padding:0 6px 0 14px;min-height:52px}
.field>svg{width:20px;height:20px;color:var(--ink-3)}
.field input{flex:1;border:0;background:none;outline:none;min-height:50px;font-size:1rem;min-width:0}
.plus-in{display:flex;gap:8px}
.plus-in .in{flex:1}
.plus-in .btn{min-height:52px;width:52px;padding:0;flex:0 0 auto}

/* ---------- statistik ---------- */
.dark{background:var(--forest);color:#fff;margin:calc(-10px - var(--st)) -18px 0;padding:calc(var(--st) + 16px) 18px 46px}
.dark .tbar h1{text-align:left;color:#fff}
.dark .icb{background:rgba(255,255,255,.1);box-shadow:none;color:#fff}
.dark .lbl{text-align:center;margin-top:16px}
.dark .big{text-align:center;font-size:2.5rem}
.chart{position:relative;margin:18px -18px 0;height:190px;touch-action:pan-y}
.chart svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.chart .vl{position:absolute;top:0;bottom:0;width:0;border-left:1.5px solid rgba(255,255,255,.35);pointer-events:none}
.chart .cdot{position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;border:4px solid var(--lime);transform:translate(-50%,-50%);pointer-events:none}
.tip{position:absolute;transform:translate(-50%,calc(-100% - 14px));background:var(--lime);color:var(--lime-ink);font-weight:800;font-size:.8rem;
  padding:5px 10px;border-radius:10px;white-space:nowrap;pointer-events:none}
.tip::after{content:"";position:absolute;left:50%;bottom:-4px;width:9px;height:9px;background:var(--lime);transform:translateX(-50%) rotate(45deg);border-radius:2px}
.xl{display:flex;justify-content:space-between;font-size:.72rem;color:rgba(255,255,255,.5);margin-top:6px;padding:0 4px}
.legend{display:flex;justify-content:center;gap:16px;font-size:.75rem;color:rgba(255,255,255,.7);margin-top:10px}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.sheetpanel{position:relative;background:#fff;margin:-28px -18px calc(-118px - var(--sb));border-radius:30px 30px 0 0;padding:8px 18px calc(130px + var(--sb));min-height:55dvh}

/* ---------- anggaran ---------- */
.bud{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bc{background:#fff;border-radius:20px;padding:14px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px;width:100%}
.bc .hd{display:flex;align-items:center;gap:8px;font-size:.84rem;font-weight:600;color:var(--ink-2);min-width:0}
.bc .hd span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc .hd i{width:28px;height:28px;border-radius:9px;background:var(--cp);color:var(--c);display:grid;place-items:center;flex:0 0 auto}
.bc .hd i svg{width:16px;height:16px}
.bc b{font-size:1.3rem;font-weight:800;letter-spacing:-.02em}
.bc .left{font-size:.78rem;color:var(--ink-2);text-align:right}
.bc .left.over{color:var(--red);font-weight:700}
.prog{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:var(--c)}

/* ---------- menu ---------- */
.menu .mrow{display:flex;align-items:center;gap:14px;min-height:66px;width:100%;padding:8px 0}
.menu .mrow+.mrow{border-top:1px solid var(--line)}
.menu .mi{width:44px;height:44px;border-radius:14px;background:var(--soft);display:grid;place-items:center;flex:0 0 auto}
.menu .mi svg{width:21px;height:21px}
.menu b{display:block;font-weight:600}
.menu small{display:block;font-size:.8rem;color:var(--ink-2)}
.people{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px}
.people::-webkit-scrollbar{display:none}
.people button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.78rem;font-weight:600;width:58px;flex:0 0 auto}
.people .av{width:54px;height:54px}
.people .add .av{background:none;border:2px dashed var(--forest-2);color:var(--forest-2)}
.people span{max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rule{display:flex;gap:12px;padding:12px 0;font-size:.95rem;align-items:flex-start}
.rule+.rule{border-top:1px solid var(--line)}
.rule .no{width:26px;height:26px;border-radius:9px;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;font-size:.75rem;font-weight:800;flex:0 0 auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
td,th{padding:10px 4px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:.72rem;color:var(--ink-2);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.n{text-align:right;white-space:nowrap}
tr.tot td{font-weight:800;border-bottom:0}
.scroll-x{overflow-x:auto}

/* ---------- navigasi bawah ---------- */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--sb));width:min(calc(100% - 24px),456px);height:72px;
  border-radius:99px;background:#0F1512;display:flex;align-items:center;padding:0 8px;z-index:40;box-shadow:0 18px 40px -14px rgba(0,0,0,.55)}
.nav>button{flex:1;height:58px;border-radius:99px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:rgba(255,255,255,.5);font-size:.68rem;font-weight:600;transition:color .2s}
.nav>button svg{width:22px;height:22px}
.nav>button.on{color:#fff}
.nav>button.on svg{color:var(--lime)}
.nav .fab{flex:0 0 58px;width:58px;height:58px;margin:0 6px;border-radius:50%;background:var(--lime);color:var(--lime-ink);
  display:grid;place-items:center;box-shadow:0 8px 20px -6px rgba(180,224,82,.75);transition:transform .14s}
.nav .fab:active{transform:scale(.9)}
.nav .fab svg{width:26px;height:26px}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,18,14,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s both}
.sheet{width:100%;max-width:480px;max-height:94dvh;overflow-y:auto;background:#fff;border-radius:30px 30px 0 0;
  padding:6px 18px calc(18px + var(--sb));animation:up .34s cubic-bezier(.2,.9,.3,1) both;overscroll-behavior:contain}
.grab{width:42px;height:5px;border-radius:99px;background:var(--line);margin:6px auto 6px}
.sh-hd{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
.sh-hd h2{flex:1;font-size:1.18rem;font-weight:700}
.x{width:42px;height:42px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:0 0 auto}
.x svg{width:18px;height:18px}

/* keypad catat */
.amt{background:var(--soft);border-radius:26px;padding:16px 16px 14px;text-align:center}
.amt .v{font-size:2.8rem;font-weight:800;letter-spacing:-.035em;line-height:1.1;display:flex;justify-content:center;align-items:center;min-height:3.2rem}
.amt .v.zero{color:var(--ink-3)}
.amt .v .caret{display:inline-block;width:3px;height:2.1rem;background:var(--lime-2);margin-left:3px;border-radius:2px;animation:blink 1.05s steps(1) infinite}
.amt small{display:block;color:var(--ink-2);font-size:.85rem;font-weight:500}
.quick{display:flex;gap:8px;overflow-x:auto;margin:12px -18px 0;padding:0 18px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:1 0 auto;min-height:40px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);font-weight:600;font-size:.88rem;text-align:center}
.quick button:active{background:var(--lime);border-color:var(--lime)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.keys button{height:clamp(44px,6.6dvh,58px);border-radius:20px;background:var(--soft);font-size:1.45rem;font-weight:600;display:grid;place-items:center;transition:background .1s,transform .1s}
.keys button:active{background:var(--line);transform:scale(.95)}
.keys svg{width:26px;height:26px}
.kpick{display:flex;gap:6px;overflow-x:auto;margin:14px -18px 0;padding:4px 18px 4px;scrollbar-width:none}
.kpick::-webkit-scrollbar{display:none}
.kp{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;width:70px;font-size:.74rem;font-weight:600;color:var(--ink-2)}
.kp .o{width:52px;height:52px;border-radius:50%;background:var(--cp);color:var(--c);display:grid;place-items:center;transition:all .18s}
.kp .o svg{width:22px;height:22px}
.kp.on{color:var(--ink)}
.kp.on .o{background:var(--c);color:#fff;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--c)}
.kp span{max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kp.add .o{background:none;border:2px dashed var(--line);color:var(--ink-2)}
.dates{display:flex;gap:8px;margin-top:10px;align-items:center}
.dates .chip{min-height:38px;font-size:.84rem}
.dates input[type=date]{min-height:38px;border-radius:99px;border:1.5px solid var(--line);background:#fff;padding:0 12px;font-size:.84rem;font-weight:600;flex:1;min-width:0}

/* struk sukses */
.rcpt{background:var(--soft);border-radius:24px;padding:22px 18px 16px;margin-top:4px;text-align:center}
.rcpt .ok{width:58px;height:58px;border-radius:50%;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;margin:0 auto 10px}
.rcpt .ok svg{width:28px;height:28px}
.perf{border-top:2px dashed var(--line);margin:18px -18px 10px;position:relative}
.perf::before,.perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:#fff}
.perf::before{left:-10px}.perf::after{right:-10px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:.9rem;text-align:left}
.kv span{color:var(--ink-2)}
.kv b{font-weight:600;text-align:right}

/* ---------- halaman depan ---------- */
.land{max-width:480px;margin:0 auto;padding:calc(var(--st) + 18px) 18px 44px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem;letter-spacing:-.02em}
.mark{width:40px;height:40px;border-radius:13px;background:var(--forest);display:grid;place-items:center}
.mark svg{width:26px;height:26px}
.onb{background:var(--lime);border-radius:32px;padding:26px 22px 22px;margin-top:18px;position:relative;overflow:hidden;color:var(--lime-ink)}
.onb h1{font-size:2.35rem;font-weight:800;letter-spacing:-.04em;line-height:1.02}
.onb h1 .arr{display:inline-grid;place-items:center;width:64px;height:38px;border-radius:99px;background:var(--forest);color:var(--lime);vertical-align:middle;margin:0 2px}
.onb h1 .arr svg{width:22px;height:22px}
.onb p{margin-top:12px;font-weight:500;opacity:.8}
.mock{margin-top:20px;background:var(--forest);border-radius:24px;padding:16px;color:#fff;box-shadow:0 20px 34px -18px rgba(14,42,34,.7);transform:rotate(-2deg)}
.mock .big{font-size:1.9rem}
.mock .kbar{height:9px;margin-top:12px}
.mock-tx{background:#fff;color:var(--ink);border-radius:18px;padding:4px 12px;margin:-10px 14px 0;position:relative;transform:rotate(1.5deg);box-shadow:var(--sh)}
.cta{display:flex;align-items:center;gap:14px;width:100%;margin-top:18px;background:var(--forest);color:#fff;border-radius:99px;padding:8px 8px 8px 24px;min-height:68px}
.cta b{flex:1;font-size:1.05rem;font-weight:700}
.cta span{width:52px;height:52px;border-radius:50%;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center}
.pt{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
.pt .ti{width:40px;height:40px}
.pt .ti svg{width:19px;height:19px}
.price b{font-size:2rem;font-weight:800;letter-spacing:-.03em}
.co-price{background:var(--forest);color:#fff;border-radius:22px;padding:18px}
.co-price b{display:block;font-size:2rem;font-weight:800}
.qr-box{background:var(--soft);border-radius:22px;padding:14px;display:grid;place-items:center;aspect-ratio:1/1;width:100%;max-width:240px;max-height:36dvh;margin:0 auto}
.qr-box img{width:100%;height:100%;object-fit:contain;border-radius:12px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--sb));background:var(--ink);color:#fff;padding:12px 18px;border-radius:99px;
  z-index:90;font-size:.9rem;font-weight:600;max-width:calc(100vw - 32px);box-shadow:0 12px 30px -12px rgba(0,0,0,.5);animation:toastIn .26s cubic-bezier(.2,.9,.3,1) both;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes blink{50%{opacity:0}}
.anim .app>*,.anim .land>*{animation:fadeUp .36s cubic-bezier(.22,.8,.3,1) both}
.anim .app>*:nth-child(2),.anim .land>*:nth-child(2){animation-delay:.04s}
.anim .app>*:nth-child(3),.anim .land>*:nth-child(3){animation-delay:.08s}
.anim .app>*:nth-child(n+4),.anim .land>*:nth-child(n+4){animation-delay:.12s}
.anim .app>.dark,.anim .app>.sheetpanel{animation:none}

@media (min-width:700px){ body{background:#E2E5DF} .app{background:var(--bg);box-shadow:0 0 0 1px var(--line)} }
@media print{ .nav,.noprint,.tbar button{display:none!important} body,.app{background:#fff} .card{box-shadow:none;border:1px solid #ddd} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- util tanggal & angka (pakai waktu lokal, bukan UTC) ---------- */

const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today = () => iso(new Date());
const thisPeriod = () => today().slice(0,7);
function pShift(p, n){ const [y,m]=p.split('-').map(Number); return iso(new Date(y, m-1+n, 1)).slice(0,7); }
function dShift(s, n){ const [y,m,d]=s.split('-').map(Number); return iso(new Date(y, m-1, d+n)); }
function daysIn(p){ const [y,m]=p.split('-').map(Number); return new Date(y, m, 0).getDate(); }
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const HARI = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
function pLabel(p){ const [y,m]=p.split('-'); return BULAN[+m-1]+' '+y; }
function pShort(p){ const [y,m]=p.split('-'); return BULAN[+m-1].slice(0,3)+' '+y.slice(2); }
function dLabel(s){ if(!s) return '—'; const [y,m,d]=s.split('-'); return `${+d} ${BULAN[+m-1].slice(0,3)} ${y}`; }
function dRel(s){ return s===today()? 'Hari ini' : s===dShift(today(),-1)? 'Kemarin' : dLabel(s); }
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat('id-ID', {maximumFractionDigits:2});
const nf0 = new Intl.NumberFormat('id-ID', {maximumFractionDigits:0});
const egp = n => nf.format(+n||0) + ' EGP';
const idr = n => 'Rp' + nf0.format(+n||0);
function bigMoney(n){
  const [a,b] = nf.format(Math.round((+n||0)*100)/100).split(',');
  return `${a}${b?`<span class="dec">,${b}</span>`:''}<span class="cur">EGP</span>`;
}
function initials(n){ return String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function house(){ return DB.houses[DB.session.houseId] || null; }
function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2800);
}

const ic = (n, cls='i') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]||ICON.tag}</svg>`;
const LOGO = `<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M14 42c7-2 11-10 16-18 4 7 8 11 12 12s6-1 8-4" stroke="#CFF27B" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

/* ---------- warna kategori: urutan di daftar kategori rumah -> tidak ada dua kategori berwarna sama ---------- */
const KAT_PALETTE = [
  {c:'#7C4DEB', p:'#EEE7FE'}, {c:'#C77C02', p:'#FDF1D6'}, {c:'#1E88E5', p:'#E1EFFC'}, {c:'#E8620F', p:'#FDEADB'},
  {c:'#4F5FE8', p:'#E6E8FD'}, {c:'#0E948D', p:'#DDF3F1'}, {c:'#179A4D', p:'#DFF4E6'}, {c:'#D63A78', p:'#FCE4EE'}
];
function katColor(k){
  const h = house(), list = h ? h.setting.kategori : KAT_DEFAULT;
  let i = list.indexOf(k);
  if(i < 0){ i = 0; for(const ch of String(k||'')) i = (i*31 + ch.charCodeAt(0)) >>> 0; }
  return KAT_PALETTE[i % KAT_PALETTE.length];
}
const katVars = k => { const c = katColor(k); return `--c:${c.c};--cp:${c.p}`; };
function katIcon(k){
  const s = String(k||'').toLowerCase();
  if(/dapur|makan|masak|belanja|groceries|pasar/.test(s)) return 'bag';
  if(/listrik|kahraba|token/.test(s)) return 'bolt';
  if(/^air|galon|water/.test(s)) return 'drop';
  if(/gas|tabung/.test(s)) return 'flame';
  if(/internet|wifi|pulsa|data/.test(s)) return 'wifi';
  if(/bersih|sabun|sampah/.test(s)) return 'spray';
  if(/sewa|ijar|kontrak|rent/.test(s)) return 'key';
  if(/transport|ongkos|taksi|uber|bensin/.test(s)) return 'car';
  if(/obat|sehat|dokter/.test(s)) return 'pill';
  if(/perabot|alat|servis|perbaikan/.test(s)) return 'box';
  return 'tag';
}

/* ---------- data: Supabase atau memori (rumah contoh) ---------- */
async function insertRow(table, row){
  if(DEMO){
    const r = {id:uid(), created_at:new Date().toISOString(), ...row};
    if(table==='planned_expenses' && !r.status) r.status='rencana';
    (DEMO[table] = DEMO[table]||[])[table==='activity_log'?'unshift':'push'](r);
    return;
  }
  const {error} = await sb.from(table).insert(row); if(error) throw error;
}
async function updateRow(table, id, patch){
  if(DEMO){ const r = table==='houses' ? DEMO.house : (DEMO[table]||[]).find(x=>x.id===id); if(r) Object.assign(r, patch); return; }
  const {error} = await sb.from(table).update(patch).eq('id', id); if(error) throw error;
}
async function deleteRow(table, id){
  if(DEMO){ DEMO[table] = (DEMO[table]||[]).filter(x=>x.id!==id); return; }
  const {error} = await sb.from(table).delete().eq('id', id); if(error) throw error;
}
async function catatLog(nama, aksi, tabel){
  const h = house(); if(!h) return;
  try{ await insertRow('activity_log', {house_id:h.id, member_nama:nama||'—', aksi, tabel_terkait:tabel}); }catch(e){}
}
async function doAction(fn){
  try{ await fn(); bumpCalc(); await reloadHouse(); return true; }
  catch(e){ ferr(e && e.message ? e.message : 'Gagal menyimpan, coba lagi.'); return false; }
}
/* Ubah cache lokal + gambar ulang sekarang, kirim ke server di belakang. Gagal -> tarik ulang data. */
function quick(ubahLokal, keServer, pesan){
  try{ ubahLokal(); }catch(e){}
  bumpCalc(); render(); if(pesan) toast(pesan);
  (async()=>{
    try{ await keServer(); await reloadHouse(); render(); }
    catch(e){ toast('Gagal simpan ke server — dikembalikan.'); try{ await reloadHouse(); render(); }catch(_){} }
  })();
}

function normalize(b, username){
  const hh = b.house;
  return {
    id:hh.id, nama:hh.nama_rumah, kontak:hh.kontak||'', kodeAktivasi:hh.kode_aktivasi, tanggalAktivasi:hh.tanggal_aktivasi,
    auth:{username},
    setting:{ popupFreq:hh.popup_freq||'harian', kategori:(hh.kategori&&hh.kategori.length)? hh.kategori : KAT_DEFAULT.slice() },
    // tabel iuran_types dipakai ulang sebagai ANGGARAN bulanan per kategori (nama_iuran = nama kategori)
    budget:(b.iuran_types||[]).map(x=>({id:x.id, kat:x.nama_iuran, v:+x.nominal_default||0})),
    members:(b.members||[]).map(m=>({id:m.id, nama:m.nama, kamar:m.no_kamar, status:m.status, tglGabung:m.tanggal_gabung, tglKeluar:m.tanggal_keluar})),

async function reloadHouse(){
  let h;
  if(DEMO){ h = normalize(DEMO, 'contoh'); }
  else {
    const { data:bundle, error } = await sb.rpc('get_house_bundle');
    if(error || !bundle) throw error || new Error('Rumah tidak ditemukan.');
    const { data:{ user } } = await sb.auth.getUser();
    h = normalize(bundle, user ? user.email.split('@')[0] : '');
    subscribeRealtime(h.id);
  }
  bumpCalc();
  DB.houses = {[h.id]:h}; DB.session.houseId = h.id;
}
function subscribeRealtime(houseId){
  if(realtimeChannel && realtimeChannel.__hid===houseId) return;
  stopRealtime();
  let t = null;
  const kick = () => { clearTimeout(t); t = setTimeout(async()=>{ try{ await reloadHouse(); render(); }catch(e){} }, 500); };
  const ch = sb.channel('house-'+houseId);
  ['expenses','members','house_rules','planned_expenses','iuran_types','periods'].forEach(tbl=>
    ch.on('postgres_changes', {event:'*', schema:'public', table:tbl, filter:`house_id=eq.${houseId}`}, kick));
  ch.on('postgres_changes', {event:'*', schema:'public', table:'houses', filter:`id=eq.${houseId}`}, kick);
  ch.subscribe(); ch.__hid = houseId; realtimeChannel = ch;
}
function stopRealtime(){ if(realtimeChannel && sb){ sb.removeChannel(realtimeChannel); } realtimeChannel = null; }

/* ---------- perhitungan (di-cache, dibuang tiap data berubah) ---------- */
let calcCache = new Map(), calcVer = 0;
function bumpCalc(){ calcVer++; calcCache = new Map(); }
function memo(key, fn){ const k = calcVer+'|'+key; if(!calcCache.has(k)) calcCache.set(k, fn()); return calcCache.get(k); }
const aktif = h => memo('aktif', ()=> h.members.filter(m=>m.status==='aktif'||m.status==='cuti'));
const expIn = (h, pfx) => memo('exp:'+pfx, ()=> h.expenses.filter(e=>e.tanggal.startsWith(pfx)).sort((a,b)=>b.tanggal.localeCompare(a.tanggal)));
const expBetween = (h, a, b) => h.expenses.filter(e=>e.tanggal>=a && e.tanggal<=b).sort((x,y)=>y.tanggal.localeCompare(x.tanggal));
const sum = list => list.reduce((a,e)=>a+(+e.nominal||0), 0);
const keluar = (h, pfx) => memo('sum:'+pfx, ()=> sum(expIn(h, pfx)));
function perKat(list){
  const m = {}; list.forEach(e=>{ m[e.kategori] = (m[e.kategori]||0) + (+e.nominal||0); });
  return Object.entries(m).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);
}
const budgetOf = (h, k) => h.budget.find(b=>b.kat===k) || null;
const totalBudget = h => h.budget.reduce((a,b)=>a+b.v, 0);
const locked = (h, p) => h.closed.includes(p);
function pct(now, before){ if(!before) return null; return Math.round((now-before)/before*100); }

function txRow(e, withDate){

function txGrouped(list, max){
  if(!list.length) return `<div class="empty">Belum ada catatan belanja.</div>`;

function katBar(data){
  const tot = data.reduce((a,b)=>a+b.v,0) || 1;
  return `<div class="kbar" role="img" aria-label="Porsi belanja per kategori">${data.map(d=>

function sparkWave(vals){
  const max = Math.max(1, ...vals), n = Math.max(1, vals.length-1);
  const pts = vals.map((v,i)=>[i/n*100, 40 - v/max*34]);
  const d = smooth(pts);
  return `<svg class="wave" viewBox="0 0 100 44" preserveAspectRatio="none" aria-hidden="true">
    <path d="${d} L100,44 L0,44 Z" fill="rgba(207,242,123,.12)"/>
    <path d="${d}" fill="none" stroke="#CFF27B" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
}
function smooth(pts){
  if(!pts.length) return '';
  if(pts.length===1) return `M${pts[0][0]},${pts[0][1]}`;
  const ys = pts.map(p=>p[1]), lo = Math.min(...ys), hi = Math.max(...ys);
  const cl = y => Math.min(hi, Math.max(lo, y));
  let d = `M${pts[0][0].toFixed(2)},${pts[0][1].toFixed(2)}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    d += ` C${(p1[0]+(p2[0]-p0[0])/6).toFixed(2)},${cl(p1[1]+(p2[1]-p0[1])/6).toFixed(2)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(2)},${cl(p2[1]-(p3[1]-p1[1])/6).toFixed(2)} ${p2[0].toFixed(2)},${p2[1].toFixed(2)}`;
  }
  return d;
}

const argmax = a => a.reduce((bi,v,i,arr)=> v>arr[bi]? i : bi, 0);
function cumDaily(list, per, len){
  let run = 0; const out = [];
  for(let d=1; d<=len; d++){ const ds = per+'-'+String(d).padStart(2,'0'); run += sum(list.filter(e=>e.tanggal===ds)); out.push(run); }
  return out;
}
function statData(h){
  const t = today();
  if(S.range==='minggu'){
    const days = Array.from({length:7}, (_,i)=>dShift(t, i-6)), prev = days.map(d=>dShift(d,-7));
    const list = expBetween(h, days[0], t), pl = expBetween(h, prev[0], prev[6]);
    const s1 = days.map(d=>sum(list.filter(e=>e.tanggal===d)));
    return { judul:'7 hari terakhir', list, s1, s2:prev.map(d=>sum(pl.filter(e=>e.tanggal===d))), n:7,
      labels:days.map(d=>HARI[new Date(d+'T00:00:00').getDay()]), tips:days.map(dRel), prevTot:sum(pl), prevName:'minggu lalu', idx:argmax(s1),
      l1:'Harian minggu ini', l2:'Minggu lalu' };
  }
  if(S.range==='tahun'){
    const end = S.period||thisPeriod(), months = Array.from({length:12}, (_,i)=>pShift(end, i-11));
    const s1 = months.map(m=>keluar(h,m));
    const list = h.expenses.filter(e=>e.tanggal.slice(0,7)>=months[0] && e.tanggal.slice(0,7)<=end).sort((a,b)=>b.tanggal.localeCompare(a.tanggal));
    return { judul:'12 bulan s/d '+pShort(end), list, s1, s2:null, n:12, labels:months.map(m=>BULAN[+m.slice(5)-1].slice(0,3)),
      tips:months.map(pShort), prevTot:null, idx:argmax(s1), l1:'Total per bulan' };
  }
  const p = S.period||thisPeriod(), n = daysIn(p), pp = pShift(p,-1);
  const isNow = p===thisPeriod(), upto = isNow? +t.slice(8) : n;
  const list = expIn(h,p), s1 = cumDaily(list, p, upto), s2 = cumDaily(expIn(h,pp), pp, Math.min(n, daysIn(pp)));
  return { judul:pLabel(p), list, s1, s2, n, labels:['1','8','15','22',String(n)],
    tips:s1.map((_,i)=>`${i+1} ${BULAN[+p.slice(5)-1].slice(0,3)}`), prevTot: isNow? (s2[upto-1]||s2[s2.length-1]||0) : sum(expIn(h,pp)),
    prevName:BULAN[+pp.slice(5)-1].slice(0,3)+(isNow?' (hari yg sama)':''), idx:s1.length-1, l1:'Akumulasi bulan ini', l2:'Bulan lalu' };
}
let CH = null;   // data grafik yang sedang tampil, dipakai untuk geser tooltip
function lineChart(sd){
  const max = Math.max(1, ...sd.s1, ...(sd.s2||[]));
  const X = i => 4 + i/Math.max(1, sd.n-1)*92, Y = v => 40 + (1 - v/max)*138;
  const path = s => smooth(s.map((v,i)=>[X(i), Y(v)]));
  CH = { ...sd, X, Y };
  const d1 = path(sd.s1);
  return `<div class="chart" id="chart" role="img" aria-label="Grafik pengeluaran ${esc(sd.judul)}">
    <svg viewBox="0 0 100 190" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFF27B" stop-opacity=".28"/><stop offset="1" stop-color="#CFF27B" stop-opacity="0"/></linearGradient></defs>
      ${sd.s2? `<path d="${path(sd.s2)}" fill="none" stroke="#2E9E83" stroke-width="2.4" vector-effect="non-scaling-stroke"/>` : ''}
      ${sd.s1.length>1? `<path d="${d1} L${X(sd.s1.length-1)},190 L${X(0)},190 Z" fill="url(#gf)"/>` : ''}
      <path d="${d1}" fill="none" stroke="#CFF27B" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    </svg>
    <span class="vl"></span><span class="cdot"></span><span class="tip"></span>
  </div>
  <div class="xl">${sd.labels.map(l=>`<span>${l}</span>`).join('')}</div>
  <div class="legend"><span><i style="background:#CFF27B"></i>${sd.l1}</span>${sd.s2? `<span><i style="background:#2E9E83"></i>${sd.l2}</span>` : ''}</div>`;
}
function paintTip(i){
  const el = document.getElementById('chart'); if(!el || !CH || !CH.s1.length) return;
  i = Math.max(0, Math.min(CH.s1.length-1, i)); CH.idx = i;
  const x = CH.X(i), y = CH.Y(CH.s1[i]);
  el.querySelector('.vl').style.left = x+'%';
  const pt = el.querySelector('.cdot'); pt.style.left = x+'%'; pt.style.top = y+'px';
  const tip = el.querySelector('.tip'); tip.style.left = Math.min(84, Math.max(16, x))+'%'; tip.style.top = y+'px';
  tip.textContent = `${CH.tips[i]} · ${nf.format(CH.s1[i])}`;
}
function vStatistik(){
  const h = house(), sd = statData(h), tot = S.range==='bulan'? (sd.s1[sd.s1.length-1]||0) : sum(sd.list);
  const cmp = sd.prevTot==null? null : pct(tot, sd.prevTot);
  const cats = perKat(sd.list);
  let list = sd.list;
  if(S.fk) list = list.filter(e=>e.kategori===S.fk);
  if(S.q){ const q = S.q.toLowerCase(); list = list.filter(e=>(e.deskripsi+' '+e.kategori+' '+(e.dicatatOleh||'')).toLowerCase().includes(q)); }
  return `<section class="dark">

        <button class="icb" data-a="focus-q" aria-label="Cari catatan">${ic('search')}</button></header>
      <div class="seg" role="tablist">${[['minggu','Minggu'],['bulan','Bulan'],['tahun','Tahun']].map(([k,l])=>
        `<button class="${S.range===k?'on':''}" data-a="range" data-v="${k}" role="tab" aria-selected="${S.range===k}">${l}</button>`).join('')}</div>
      ${S.range!=='minggu'? `<div class="mt">${pnav(S.period||thisPeriod())}</div>` : ''}
      <div class="lbl">Total pengeluaran · ${esc(sd.judul)}</div>
      <div class="big">${bigMoney(tot)}</div>
      ${cmp===null? '' : `<div class="center mt-s"><span class="pill ${cmp>0?'up':'down'}">${ic(cmp>0?'up':'down')} ${Math.abs(cmp)}% vs ${esc(sd.prevName)}</span></div>`}
      ${lineChart(sd)}
    </section>
    <section class="sheetpanel">
      <div class="grab"></div>
      ${cats.length? `<div class="sec" style="margin-top:12px"><h2>Porsi kategori</h2></div>${katBar(cats)}
      <div class="chips mt">
        <button class="chip ${!S.fk?'on':''}" data-a="fk" data-v="">Semua</button>
        ${cats.map(c=>`<button class="chip ${S.fk===c.k?'on':''}" style="${katVars(c.k)}" data-a="fk" data-v="${esc(c.k)}"><i></i>${esc(c.k)} · ${Math.round(c.v/(tot||1)*100)}%</button>`).join('')}
      </div>` : ''}
      <div class="sec"><h2>Riwayat</h2>${(S.fk||S.q)? `<span class="tag lime">${egp(sum(list))}</span>` : `<span class="tiny">${list.length} catatan</span>`}</div>
      <label class="field">${ic('search')}<input id="q-cari" type="search" placeholder="Cari belanja, kategori, nama…" value="${esc(S.q)}" autocomplete="off" enterkeyhint="search"></label>
      <div class="list" style="margin-top:4px">${txGrouped(list, 150)}</div>
    </section>`;
}

function vAnggaran(){
  const h = house(), p = S.period||thisPeriod(), cats = perKat(expIn(h,p));
  const spent = k => (cats.find(c=>c.k===k)||{v:0}).v;
  const tb = totalBudget(h), used = h.budget.reduce((a,b)=>a+spent(b.kat), 0), tot = keluar(h,p);
  const isNow = p===thisPeriod(), sisaHari = isNow? daysIn(p) - +today().slice(8) + 1 : 0;
  const sisa = tb - used;
  const tanpa = [...new Set([...h.setting.kategori, ...cats.map(c=>c.k)])].filter(k=>!budgetOf(h,k));
  return `<header class="tbar"><span class="ph"></span><h1>Anggaran</h1><span class="ph"></span></header>
    ${pnav(p)}
    <section class="hero mt">
      <div class="hin">
        <div class="lbl">Terpakai dari anggaran</div>
        <div class="big">${bigMoney(used)}</div>
        <p class="lbl" style="margin-top:2px">dari ${tb? egp(tb) : 'anggaran yang belum diatur'}</p>
        ${tb? `<div class="prog mt" style="background:rgba(255,255,255,.14);height:10px"><i style="width:${Math.min(100, used/tb*100).toFixed(1)}%;background:${used>tb?'#FF8A7A':'var(--lime)'}"></i></div>` : ''}
      </div>
      <div class="strip">
        <div class="sp"><small>${sisa>=0?'Sisa anggaran':'Lewat anggaran'}</small><b>${tb? egp(Math.abs(sisa)) : '—'}</b></div>
        <div style="text-align:right"><small>${isNow && tb && sisa>0? 'Aman per hari' : 'Total belanja'}</small><b>${isNow && tb && sisa>0? egp(Math.floor(sisa/sisaHari)) : egp(tot)}</b></div>
      </div>
    </section>

    <div class="sec"><h2>Belanja vs anggaran</h2><button class="link" data-a="sheet" data-v="budget">${ic('plus')} Atur</button></div>
    ${h.budget.length? `<div class="bud">${h.budget.map(b=>{
      const s = spent(b.kat), left = b.v - s, c = katColor(b.kat);
      return `<button class="bc" style="${katVars(b.kat)}" data-a="sheet" data-v="budget" data-id="${b.id}">
        <span class="hd"><i>${ic(katIcon(b.kat))}</i><span>${esc(b.kat)}</span></span>
        <b>${nf.format(s)}</b>
        <span class="prog"><i style="width:${b.v? Math.min(100, s/b.v*100).toFixed(1) : 100}%;${left<0?'background:var(--red)':''}"></i></span>
        <span class="left ${left<0?'over':''}">${left<0? 'lewat '+nf.format(-left) : 'sisa '+nf.format(left)}</span>
      </button>`;}).join('')}</div>`
    : `<div class="card empty">Belum ada anggaran. Atur batas belanja per kategori supaya ketahuan kalau mulai boros.
        <br><button class="btn lime sm mt-s" data-a="sheet" data-v="budget">${ic('plus')} Atur anggaran</button></div>`}

    ${tanpa.length? `<div class="sec"><h2>Tanpa anggaran</h2></div>
    <div class="card list">${tanpa.map(k=>`<div class="tx" style="${katVars(k)}"><span class="ti">${ic(katIcon(k))}</span>
      <span class="bd"><b>${esc(k)}</b><small>${egp(spent(k))} bulan ini</small></span>
      <button class="btn soft sm" data-a="sheet" data-v="budget" data-kat="${esc(k)}">Atur</button></div>`).join('')}</div>` : ''}`;
}

let viewKey = '';
function render(){
  const app = document.getElementById('app');
  const act = document.activeElement;
  const keep = (act && act.id && (act.tagName==='INPUT'||act.tagName==='TEXTAREA')) ? {id:act.id, s:act.selectionStart, e:act.selectionEnd} : null;
  const sy = window.scrollY;
  const key = [S.route, S.tab, S.page].join('/');
  const pindah = key !== viewKey; viewKey = key;
  document.body.classList.toggle('anim', pindah);

  if(S.route==='app' && !house()) S.route = 'landing';
  if(S.route==='landing') app.innerHTML = vLanding();
  else if(S.route==='aktivasi') app.innerHTML = vAktivasi();
  else if(S.route==='masuk') app.innerHTML = vMasuk();
  else if(S.route==='owner') app.innerHTML = vOwner();
  else if(S.route==='siapa') app.innerHTML = vSiapa();
  else {
    const pages = {rencana:vRencana, laporan:vLaporan, kategori:vKategori, anggota:vAnggota, peraturan:vPeraturan, log:vLog, setting:vSetting};
    const tabs = {beranda:vBeranda, statistik:vStatistik, anggaran:vAnggaran, profil:vProfil};
    const view = (S.page && pages[S.page]) || tabs[S.tab] || vBeranda;
    app.innerHTML = `<div class="app">${view()}</div>${navBar()}`;
    if(S.tab==='statistik' && !S.page && CH) paintTip(CH.idx);
  }
  renderLayer();
  if(keep){
    const el = document.getElementById(keep.id);
    if(el && el !== document.activeElement){ el.focus({preventScroll:true}); try{ el.setSelectionRange(keep.s, keep.e); }catch(e){} }
  }
  window.scrollTo({top: pindah? 0 : sy, behavior:'auto'});
}
function go(route){ S.route = route; S.page = null; S.sheet = null; render(); }
function openTab(t){ S.tab = t; S.page = null; S.sheet = null; S.period = null; if(t!=='statistik'){ S.fk=''; S.q=''; } render(); }
function closeSheet(){ S.sheet = null; renderLayer(); }
function ferr(msg){ const e = document.getElementById('err-f'); if(e){ e.textContent = msg; e.hidden = false; } else toast(msg); }
const val = id => { const el = document.getElementById(id); return el? el.value.trim() : ''; };
const chk = id => { const el = document.getElementById(id); return !!(el && el.checked); };
function maybePopup(){
  const h = house(); if(!h) return;
  const f = h.setting.popupFreq;
  if(!h.rules.some(r=>r.aktif) || f==='mati') return;
  if(f==='harian' && sessionStore.getItem('igarin:rules')===today()) return;
  sessionStore.setItem('igarin:rules', today());
  S.rulesPopup = true;
}
function afterLogin(){
  S.me = getMe();
  if(!S.me){ S.route = 'siapa'; return; }
  S.route = 'app'; S.tab = 'beranda'; maybePopup();
}
function unduh(nama, teks){
  try{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿'+teks], {type:'text/csv;charset=utf-8'})); a.download = nama;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000); toast('Berkas diunduh.');
  }catch(e){ toast('Unduhan diblokir peramban.'); }
}

/* ---------- keypad ---------- */
function paintAmt(){
  const el = document.getElementById('amt-v'); if(!el) return;
  el.innerHTML = fmtTyping(S.form.amt) + '<i class="caret"></i>';
  el.classList.toggle('zero', !S.form.amt);
}
function keyIn(k){
  const f = S.form; if(!f) return;
  let a = f.amt;
  if(k==='del') a = a.slice(0,-1);
  else if(k==='.'){ if(!a.includes('.')) a = (a||'0') + '.'; }
  else {
    const [i, d] = a.split('.');
    if(d!==undefined && d.length>=2) return;
    if(d===undefined && i.length>=7) return;
    a = (a==='0'? '' : a) + k;
  }
  f.amt = a; paintAmt();
  if(navigator.vibrate) try{ navigator.vibrate(8); }catch(e){}
}

/* =====================================================================
   AKSI
   ===================================================================== */
document.addEventListener('click', async (ev)=>{
  const el = ev.target.closest('[data-a]'); if(!el) return;
  if(el.tagName==='SELECT' || (el.tagName==='INPUT' && el.type!=='checkbox')) return;
  const a = el.dataset.a, v = el.dataset.v, id = el.dataset.id, h = house();
  if(a==='close-scrim' && ev.target !== el) return;
  const me = getMe();

  switch(a){
    /* ---- navigasi ---- */
    case 'go': return go(v);
    case 'tab': return openTab(v);
    case 'back': S.page = null; return render();
    case 'page': S.from = S.page? S.from : S.tab; S.page = v; S.sheet = null; return render();
    case 'page-from-sheet': S.from = S.tab; S.sheet = null; S.page = v; return render();
    case 'per': S.period = pShift(S.period||thisPeriod(), +v); return render();
    case 'range': S.range = v; S.period = null; return render();
    case 'fk': S.fk = v; return render();
    case 'filter-kat': S.fk = v; S.range = 'bulan'; S.tab = 'statistik'; S.page = null; S.period = null; return render();
    case 'focus-q': { const q = document.getElementById('q-cari'); if(q){ q.scrollIntoView({behavior:'smooth', block:'center'}); q.focus({preventScroll:true}); } return; }
    case 'sheet': S.sheet = {name:v, id:id||null, kat:el.dataset.kat||''}; if(v==='checkout') S.step = 1; return renderLayer();
    case 'close': case 'close-scrim': S.rulesPopup = false; return closeSheet();
    case 'rules': S.rulesPopup = true; return renderLayer();
    case 'rules-ok': S.rulesPopup = false; return renderLayer();
    case 'co-step': S.step = +v; return renderLayer();
    case 'salin-rek': try{ await navigator.clipboard.writeText(BAYAR.rekening); toast('Nomor rekening disalin.'); }catch(e){ toast('Nomor: '+BAYAR.rekening); } return;
    case 'print': return window.print();

    /* ---- masuk, aktivasi, contoh, keluar ---- */
    case 'demo': DEMO = demoBundle(); await reloadHouse(); setMe(''); S.me = ''; S.route = 'siapa'; return render();
    case 'masuk': {
      if(!sb) return ferr('Tidak bisa terhubung ke server.');
      try{
        const { error } = await sb.auth.signInWithPassword({ email:emailFor(val('user')), password:val('pass') });
        if(error) throw error;
        await reloadHouse(); afterLogin(); render();
      }catch(err){ ferr('Username atau password salah.'); }
      return;
    }
    case 'aktivasi': {
      const kode=val('kode'), nama=val('nama'), u=val('user'), p1=val('pass'), p2=val('pass2');
      if(!/^\d{9}$/.test(kode)) return ferr('Kode harus 9 angka.');
      if(!nama) return ferr('Isi nama rumah.');
      if(u.length<3) return ferr('Username minimal 3 karakter.');
      if(p1.length<6) return ferr('Password minimal 6 karakter.');
      if(p1!==p2) return ferr('Dua password belum sama.');
      try{
        let { error } = await sb.auth.signUp({ email:emailFor(u), password:p1 });
        if(error) throw error;
        ({ error } = await sb.auth.signInWithPassword({ email:emailFor(u), password:p1 }));
        if(error) throw error;
        ({ error } = await sb.rpc('redeem_code', { p_kode:kode, p_nama:nama, p_kontak:val('kontak') }));
        if(error) throw error;
        await reloadHouse(); S.route = 'siapa'; render();
      }catch(err){ ferr(/registered/i.test(err.message||'')? 'Username sudah dipakai rumah lain.' : (err.message || 'Kode tidak ditemukan atau sudah terpakai.')); }
      return;
    }
    case 'keluar': {
      if(DEMO){ DEMO = null; } else { stopRealtime(); if(sb) await sb.auth.signOut(); }
      DB = {houses:{}, session:{}}; S.page = null; S.tab = 'beranda'; return go('landing');
    }

    /* ---- identitas ---- */
    case 'ganti-aku': S.sheet = {name:'aku'}; return renderLayer();
    case 'aku': case 'aku-simpan': {
      let nama = v;
      if(a==='aku-simpan'){
        nama = val('aku-baru'); if(!nama) return ferr('Tulis dulu namamu.');
        const exists = h.members.some(m=>m.nama.toLowerCase()===nama.toLowerCase());
        if(chk('aku-daftar') && !exists){
          const ok = await doAction(async()=>{ await insertRow('members', {house_id:h.id, nama, status:'aktif', tanggal_gabung:today()}); await catatLog(nama, `Tambah penghuni ${nama}`, 'members'); });
          if(!ok) return;
        }
      }
      setMe(nama);
      if(S.route==='siapa'){ S.route = 'app'; S.tab = 'beranda'; maybePopup(); }
      S.sheet = S.afterAku && S.form ? {name:'catat'} : null; S.afterAku = false;
      render(); toast('Halo, '+nama+'.'); return;
    }

    /* ---- catat pengeluaran ---- */
    case 'catat': return openCatat(null);
    case 'edit': return openCatat(id);
    case 'key': return keyIn(v);
    case 'amt-add': {
      const n = Math.round(((parseFloat(S.form.amt)||0) + (+v))*100)/100;
      if(n < 1e7){ S.form.amt = String(n); paintAmt(); }
      return;
    }
    case 'f-kat': {
      S.form.kat = v;
      document.querySelectorAll('.kp[data-a="f-kat"]').forEach(b=>{ const on = b.dataset.v===v; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
      return;
    }
    case 'f-date': S.form.date = v; S.form.note = val('f-note'); return renderLayer();
    case 'f-simpan': {
      const f = S.form; f.note = val('f-note'); f.besar = chk('f-besar'); f.date = val('f-date') || f.date;
      const n = Math.round((parseFloat(f.amt)||0)*100)/100;
      if(!(n>0)) return ferr('Ketik nominalnya dulu.');
      if(f.date > today()) return ferr('Tanggal tidak boleh di masa depan.');
      if(locked(h, f.date.slice(0,7))) return ferr('Buku '+pLabel(f.date.slice(0,7))+' sudah ditutup.');
      if(!me){ S.afterAku = true; S.sheet = {name:'aku'}; renderLayer(); return toast('Pilih dulu namamu.'); }
      const old = f.id? h.expenses.find(x=>x.id===f.id) : null;
      const rec = { tanggal:f.date, kategori:f.kat, deskripsi:f.note||f.kat, nominal:n, besar:f.besar, dicatatOleh: old? old.dicatatOleh : me, bukti:f.bukti||'' };
      const row = { tanggal:rec.tanggal, kategori:rec.kategori, deskripsi:rec.deskripsi, nominal:n, is_besar:rec.besar, dicatat_oleh:rec.dicatatOleh, bukti_foto_url:rec.bukti||null };
      S.lastKat = f.kat;
      if(old){
        S.sheet = null;
        quick(()=>Object.assign(old, rec), async()=>{ await updateRow('expenses', old.id, row); await catatLog(me, `Ubah belanja ${rec.deskripsi} ${nf.format(n)} EGP`, 'expenses'); }, 'Perubahan disimpan.');
      } else {
        const b = budgetOf(h, f.kat);
        const spentKat = h.expenses.filter(e=>e.kategori===f.kat && e.tanggal.slice(0,7)===f.date.slice(0,7)).reduce((x,e)=>x+e.nominal, 0) + n;
        S.lastSaved = { ...rec, budget: b&&b.v? {left: b.v - spentKat} : null };
        S.sheet = {name:'struk'};
        quick(()=>h.expenses.push({id:'tmp-'+uid(), ...rec}),
          async()=>{ await insertRow('expenses', {house_id:h.id, ...row}); await catatLog(me, `Catat belanja ${rec.deskripsi} ${nf.format(n)} EGP`, 'expenses'); });
      }
      return;
    }
    case 'f-hapus': {
      const old = h.expenses.find(x=>x.id===S.form.id); if(!old) return closeSheet();
      if(!confirm(`Hapus "${old.deskripsi}" ${egp(old.nominal)}?`)) return;
      S.sheet = null;
      quick(()=>{ h.expenses = h.expenses.filter(x=>x.id!==old.id); },
        async()=>{ await deleteRow('expenses', old.id); await catatLog(me||'—', `Hapus belanja ${old.deskripsi}`, 'expenses'); }, 'Catatan dihapus.');
      return;
    }

    /* ---- anggaran ---- */
    case 'sv-budget': {
      const b = id? h.budget.find(x=>x.id===id) : null, kat = b? b.kat : val('b-kat'), n = parseFloat(val('b-v'));
      if(!kat) return ferr('Pilih kategori.');
      if(!(n>0)) return ferr('Isi batas anggaran.');
      const ok = await doAction(async()=>{
        if(b) await updateRow('iuran_types', b.id, {nominal_default:n});
        else await insertRow('iuran_types', {house_id:h.id, nama_iuran:kat, nominal_default:n});
        await catatLog(me||'—', `Atur anggaran ${kat} ${nf.format(n)} EGP`, 'iuran_types');
      });
      if(ok){ S.sheet = null; render(); toast('Anggaran '+kat+' disimpan.'); }
      return;
    }
    case 'del-budget': {
      const ok = await doAction(async()=>{ await deleteRow('iuran_types', id); await catatLog(me||'—', 'Hapus anggaran', 'iuran_types'); });
      if(ok){ S.sheet = null; render(); }
      return;
    }

    /* ---- rencana ---- */
    case 'sv-rencana': {
      const d = val('r-desk'); if(!d) return ferr('Tulis rencananya.');
      const ok = await doAction(async()=>{
        await insertRow('planned_expenses', {house_id:h.id, tanggal_rencana:val('r-tgl')||today(), deskripsi:d, estimasi_nominal:parseFloat(val('r-nom'))||0, dicatat_oleh:me||null});
        await catatLog(me||'—', `Tambah rencana ${d}`, 'planned_expenses');
      });
      if(ok){ S.sheet = null; render(); toast('Rencana dicatat.'); }
      return;
    }
    case 'sv-realisasi': {
      const pl = h.planned.find(x=>x.id===id), n = parseFloat(val('r-nom')), tgl = val('r-tgl')||today();
      if(!(n>0)) return ferr('Isi nominalnya.');
      if(locked(h, tgl.slice(0,7))) return ferr('Buku bulan itu sudah ditutup.');
      const ok = await doAction(async()=>{
        await insertRow('expenses', {house_id:h.id, tanggal:tgl, kategori:val('r-kat'), deskripsi:pl.deskripsi, nominal:n, is_besar:true, dicatat_oleh:me||'—'});
        await updateRow('planned_expenses', id, {status:'selesai'});
        await catatLog(me||'—', `Realisasi rencana ${pl.deskripsi}`, 'expenses');
      });
      if(ok){ S.sheet = null; render(); toast('Jadi pengeluaran.'); }
      return;
    }
    case 'hapus-rencana': {
      const ok = await doAction(async()=>{ await deleteRow('planned_expenses', id); await catatLog(me||'—', 'Batalkan rencana', 'planned_expenses'); });
      if(ok){ S.sheet = null; render(); }
      return;
    }

    /* ---- penghuni ---- */
    case 'q-anggota': {
      const nama = val('q-anggota'); if(!nama) return ferr('Ketik nama dulu.');
      if(h.members.some(m=>m.nama.toLowerCase()===nama.toLowerCase())) return ferr(nama+' sudah ada.');
      quick(()=>h.members.push({id:'tmp-'+uid(), nama, kamar:null, status:'aktif', tglGabung:today(), tglKeluar:null}),
        async()=>{ await insertRow('members', {house_id:h.id, nama, status:'aktif', tanggal_gabung:today()}); await catatLog(me||nama, `Tambah penghuni ${nama}`, 'members'); },
        nama+' ditambahkan.');
      return;
    }
    case 'sv-anggota': {
      const nama = val('m-nama'); if(!nama) return ferr('Isi nama.');
      const data = {nama, no_kamar:val('m-kamar')||null, status:val('m-status'), tanggal_gabung:val('m-gabung')||today(), tanggal_keluar:val('m-keluar')||null};
      const ok = await doAction(async()=>{
        if(id) await updateRow('members', id, data); else await insertRow('members', {house_id:h.id, ...data});
        await catatLog(me||'—', `${id?'Ubah':'Tambah'} penghuni ${nama}`, 'members');
      });
      if(ok){ S.sheet = null; render(); toast('Tersimpan.'); }
      return;
    }
    case 'del-anggota': {
      const m = h.members.find(x=>x.id===id);
      if(!confirm(`Hapus ${m? m.nama : 'penghuni ini'} dari daftar?`)) return;
      const ok = await doAction(async()=>{ await deleteRow('members', id); await catatLog(me||'—', `Hapus penghuni ${m?m.nama:''}`, 'members'); });
      if(ok){ S.sheet = null; render(); }
      return;
    }

    /* ---- peraturan ---- */
    case 'q-rule': {
      const teks = val('q-rule'); if(!teks) return ferr('Tulis peraturannya.');
      const ok = await doAction(async()=>{ await insertRow('house_rules', {house_id:h.id, deskripsi:teks, aktif:true, urutan:h.rules.length+1}); await catatLog(me||'—', 'Tambah peraturan', 'house_rules'); });
      if(ok){ render(); toast('Peraturan ditambahkan.'); }
      return;
    }
    case 'sv-peraturan': {
      const teks = val('p-teks'); if(!teks) return ferr('Tulis isi peraturannya.');
      const ok = await doAction(async()=>{ await updateRow('house_rules', id, {deskripsi:teks, aktif:chk('p-aktif')}); await catatLog(me||'—', 'Ubah peraturan', 'house_rules'); });
      if(ok){ S.sheet = null; render(); }
      return;
    }
    case 'del-peraturan': {
      const ok = await doAction(async()=>{
        await deleteRow('house_rules', id);
        const sisa = h.rules.filter(x=>x.id!==id).sort((x,y)=>x.urutan-y.urutan);
        for(let i=0;i<sisa.length;i++) if(sisa[i].urutan!==i+1) await updateRow('house_rules', sisa[i].id, {urutan:i+1});
        await catatLog(me||'—', 'Hapus peraturan', 'house_rules');
      });
      if(ok){ S.sheet = null; render(); }
      return;
    }
    case 'rule-move': {
      const rs = h.rules.slice().sort((x,y)=>x.urutan-y.urutan), i = rs.findIndex(x=>x.id===id);
      if(i<1) return;
      const ok = await doAction(async()=>{ await updateRow('house_rules', rs[i].id, {urutan:rs[i-1].urutan}); await updateRow('house_rules', rs[i-1].id, {urutan:rs[i].urutan}); });
      if(ok) render();
      return;
    }

    /* ---- kategori ---- */
    case 'q-kat': {
      const k = val('q-kat'); if(!k) return ferr('Tulis nama kategori.');
      if(h.setting.kategori.some(x=>x.toLowerCase()===k.toLowerCase())) return ferr('Kategori itu sudah ada.');
      const ok = await doAction(()=>updateRow('houses', h.id, {kategori:h.setting.kategori.concat(k)}));
      if(ok){ render(); toast('Kategori '+k+' ditambahkan.'); }
      return;
    }
    case 'kat-hapus': {
      if(h.setting.kategori.length<=1) return toast('Minimal satu kategori.');
      if(!confirm(`Hapus kategori ${v}? Catatan lama tetap tersimpan.`)) return;
      const ok = await doAction(()=>updateRow('houses', h.id, {kategori:h.setting.kategori.filter(k=>k!==v)}));
      if(ok) render();
      return;
    }

    /* ---- password ---- */
    case 'sv-pass': {
      if(DEMO) return ferr('Tidak tersedia di rumah contoh.');
      const p0=val('p0'), p1=val('p1'), p2=val('p2');
      if(p1.length<6) return ferr('Password baru minimal 6 karakter.');
      if(p1!==p2) return ferr('Dua password belum sama.');
      try{
        const { error:e1 } = await sb.auth.signInWithPassword({ email:emailFor(h.auth.username), password:p0 });
        if(e1) return ferr('Password lama salah.');
        const { error:e2 } = await sb.auth.updateUser({ password:p1 }); if(e2) throw e2;
        await catatLog(me||'—', 'Ganti password rumah', 'houses');
        closeSheet(); toast('Password diganti. Kabari penghuni lain.');
      }catch(err){ ferr(err.message || 'Gagal mengganti password.'); }
      return;
    }

    /* ---- laporan ---- */
    case 'csv': {
      const p = S.period||thisPeriod();
      const rows = [['Laporan pengeluaran', h.nama, pLabel(p)], [], ['Tanggal','Kategori','Deskripsi','Nominal (EGP)','Besar','Dicatat oleh']];
      expIn(h,p).slice().reverse().forEach(e=>rows.push([e.tanggal, e.kategori, e.deskripsi, e.nominal, e.besar?'ya':'', e.dicatatOleh]));
      rows.push([], ['Kategori','Total (EGP)']); perKat(expIn(h,p)).forEach(c=>rows.push([c.k, c.v]));
      rows.push([], ['Total', keluar(h,p)], ['Per orang', aktif(h).length? Math.ceil(keluar(h,p)/aktif(h).length) : '']);
      unduh(`igarin-${p}.csv`, rows.map(r=>r.map(x=>`"${String(x==null?'':x).replace(/"/g,'""')}"`).join(',')).join('\n'));
      return;
    }
    case 'tutup-buku': {
      const p = S.period||thisPeriod(), [y,m] = p.split('-').map(Number), tutup = !locked(h,p);
      if(tutup && !confirm(`Tutup buku ${pLabel(p)}? Catatan bulan itu tidak bisa diubah sampai dibuka lagi.`)) return;
      const ok = await doAction(async()=>{
        if(DEMO){ DEMO.periods = DEMO.periods.filter(x=>!(x.bulan===m&&x.tahun===y)).concat(tutup? [{bulan:m, tahun:y, status:'tertutup'}] : []); }
        else { const { error } = await sb.rpc('set_period_status', {p_bulan:m, p_tahun:y, p_status: tutup?'tertutup':'terbuka'}); if(error) throw error; }
        await catatLog(me||'—', `${tutup?'Tutup':'Buka kembali'} buku ${pLabel(p)}`, 'periods');
      });
      if(ok){ render(); toast(`Buku ${pLabel(p)} ${tutup?'ditutup':'dibuka kembali'}.`); }
      return;
    }

    /* ---- panel pemilik ---- */
    case 'owner-unlock': {
      try{
        const pass = val('ownpass'), { data, error } = await sb.rpc('owner_bundle', {p_passcode:pass});
        if(error) throw error; S.owner = data; S.ownerPass = pass; render();
      }catch(err){ ferr('Sandi salah.'); }
      return;
    }
    case 'own-filter': S.filter = v; return render();
    case 'own-batch': {
      try{
        const { data:n, error } = await sb.rpc('owner_generate_codes', {p_passcode:S.ownerPass, p_n:100}); if(error) throw error;
        S.owner = (await sb.rpc('owner_bundle', {p_passcode:S.ownerPass})).data; render(); toast(n+' kode ditambahkan.');
      }catch(err){ toast(err.message); }
      return;
    }
    case 'own-csv': {
      const rows = [['kode','status','rumah','tanggal_terpakai','batch']].concat((S.owner.codes||[]).map(c=>[c.kode, c.status, c.nama_rumah||'', c.tgl_terpakai||'', c.batch]));
      return unduh('igarin-kode.csv', rows.map(r=>r.join(',')).join('\n'));
    }
    case 'sv-sale': {
      const nama = val('o-nama'), kode = val('o-kode');
      if(!nama) return ferr('Isi nama pembeli.'); if(!kode) return ferr('Tidak ada kode tersedia.');
      try{
        const { error } = await sb.rpc('owner_record_sale', {p_passcode:S.ownerPass, p_nama:nama, p_kontak:val('o-kontak'), p_kode:kode, p_nominal:parseFloat(val('o-nom'))||0});
        if(error) throw error;
        S.owner = (await sb.rpc('owner_bundle', {p_passcode:S.ownerPass})).data; S.sheet = null; render(); toast('Tercatat. Kirim kode '+kode+' ke pembeli.');
      }catch(err){ ferr(err.message); }
      return;
    }
  }
});

/* ---------- ketik, ubah, keyboard ---------- */
let qTimer = null;
document.addEventListener('input', ev=>{
  const t = ev.target;
  if(t.id==='f-note' && S.form) S.form.note = t.value;
  if(t.id==='q-cari'){ clearTimeout(qTimer); qTimer = setTimeout(()=>{ S.q = t.value.trim(); render(); }, 220); }
});
document.addEventListener('change', async ev=>{
  const t = ev.target, h = house();
  if(t.id==='f-date' && S.form && t.value){ S.form.date = t.value; S.form.note = val('f-note'); return renderLayer(); }
  const a = t.dataset && t.dataset.a; if(!a || !h) return;
  if(a==='set-nama' && t.value.trim()){ await doAction(()=>updateRow('houses', h.id, {nama_rumah:t.value.trim()})); render(); toast('Nama rumah disimpan.'); }
  else if(a==='set-kontak'){ await doAction(()=>updateRow('houses', h.id, {kontak:t.value.trim()})); toast('Kontak disimpan.'); }
  else if(a==='set-popup'){ await doAction(()=>updateRow('houses', h.id, {popup_freq:t.value})); toast('Disimpan.'); }
});
document.addEventListener('keydown', ev=>{
  if(ev.key==='Escape'){ if(S.sheet || S.rulesPopup){ S.rulesPopup = false; closeSheet(); } return; }
  const t = ev.target, typing = t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA' || t.tagName==='SELECT');
  if(S.sheet && S.sheet.name==='catat' && !typing && !ev.ctrlKey && !ev.metaKey){
    if(/^[0-9]$/.test(ev.key)){ ev.preventDefault(); return keyIn(ev.key); }
    if(ev.key==='.' || ev.key===','){ ev.preventDefault(); return keyIn('.'); }
    if(ev.key==='Backspace'){ ev.preventDefault(); return keyIn('del'); }
  }
  if(ev.key!=='Enter' || !t || !t.id) return;
  const map = {'q-anggota':'q-anggota','q-rule':'q-rule','q-kat':'q-kat','aku-baru':'aku-simpan','pass':'masuk','f-note':'f-simpan','ownpass':'owner-unlock'};
  if(t.id==='q-cari'){ ev.preventDefault(); t.blur(); return; }
  if(t.id==='pass' && S.route==='aktivasi') return;
  const aksi = map[t.id]; if(!aksi) return;
  ev.preventDefault();
  const btn = document.querySelector(`[data-a="${aksi}"]`); if(btn) btn.click();
});
/* geser/ketuk grafik untuk melihat nilai tiap titik */
['pointerdown','pointermove'].forEach(type=>document.addEventListener(type, ev=>{
  const el = ev.target.closest && ev.target.closest('#chart'); if(!el || !CH) return;
  const r = el.getBoundingClientRect(), xp = (ev.clientX - r.left) / r.width * 100;
  paintTip(Math.round((xp - 4) / 92 * (CH.n - 1)));
}, {passive:true}));

/* ---------- mulai ---------- */
(async function(){
  if(sb){
    try{ const { data:{ session } } = await sb.auth.getSession(); if(session){ await reloadHouse(); afterLogin(); } }catch(e){}
  }
  render();
  if(!sb) toast('Gagal memuat koneksi server — hanya rumah contoh yang bisa dibuka.');
})();
</script>
</body>
</html>
