/* ---------- perhitungan (di-cache, dibuang tiap data berubah) ---------- */
let calcCache = new Map(), calcVer = 0;
function bumpCalc(){ calcVer++; calcCache = new Map(); }
function memo(key, fn){ const k = calcVer+'|'+key; if(!calcCache.has(k)) calcCache.set(k, fn()); return calcCache.get(k); }
const aktif = h => memo('aktif', ()=> h.members.filter(m=>m.status==='aktif'||m.status==='cuti'));
/* terbaru di atas: tanggal, lalu waktu dicatat (yang baru dicatat hari ini tidak tenggelam di bawah catatan lama) */
const byNewest = (a, b) => b.tanggal.localeCompare(a.tanggal) || String(b.created||'').localeCompare(String(a.created||''));
/* penghuni yang sudah bergabung pada bulan p (penghuni baru tidak ditagih untuk bulan sebelum ia masuk) */
const aktifDi = (h, p) => memo('aktifDi:'+p, ()=> aktif(h).filter(m=>!m.tglGabung || m.tglGabung.slice(0,7) <= p));
const expIn = (h, pfx) => memo('exp:'+pfx, ()=> h.expenses.filter(e=>e.tanggal.startsWith(pfx)).sort(byNewest));
const expBetween = (h, a, b) => h.expenses.filter(e=>e.tanggal>=a && e.tanggal<=b).sort(byNewest);
const sum = list => list.reduce((a,e)=>a+(+e.nominal||0), 0);
const keluar = (h, pfx) => memo('sum:'+pfx, ()=> sum(expIn(h, pfx)));
function perKat(list){
  const m = {}; list.forEach(e=>{ m[e.kategori] = (m[e.kategori]||0) + (+e.nominal||0); });
  return Object.entries(m).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);
}
const locked = (h, p) => h.closed.includes(p);
const pct = (now, before) => before ? Math.round((now-before)/before*100) : null;
/* belanja harian rutin: belanja besar (sewa, servis, dll.) tidak ikut, supaya tren hemat/boros terlihat jujur */
const dailyTotals = h => memo('daily', ()=>{ const m = {}; h.expenses.forEach(e=>{ if(!e.besar) m[e.tanggal] = (m[e.tanggal]||0) + e.nominal; }); return m; });
function rolling(h, ds, n=7){ const d = dailyTotals(h); let s = 0; for(let i=0;i<n;i++) s += d[dShift(ds,-i)]||0; return s/n; }
/* ---------- iuran per orang ----------
   Semua angka yang diinput adalah TOTAL RUMAH per bulan.
   Igar per orang        = total igar ÷ jumlah anggota aktif
   Perlengkapan per orang = total item ÷ jumlah anggota yang ikut item itu
   Iuran orang = igar per orang + jumlah perlengkapan yang dia ikut */
const r2 = n => Math.round((+n||0)*100)/100;
const ikutItems = (h, ikut) => ikut==='semua' ? h.tarif.perlengkapan : h.tarif.perlengkapan.filter(x=>ikut.includes(x.id));
const ikutPunya = (ikut, itemId) => ikut==='semua' || ikut.includes(itemId);
/* selfId: orang yang dihitung (dia selalu dianggap ikut dibagi, walau belum disimpan / baru ditambah) */
function rincianIkut(h, ikut, selfId){
  const lain = aktif(h).filter(m=>m.id!==selfId), nOrang = lain.length + 1;
  const items = ikutItems(h, ikut).map(x=>{ const n = lain.filter(m=>ikutPunya(m.profil.ikut, x.id)).length + 1;
    return {...x, n, per:r2(x.harga / n)}; });
  const igar = r2(h.tarif.igar / nOrang), perl = r2(items.reduce((a,x)=>a+x.per, 0));
  return { igar, nOrang, items, perl, total:r2(igar + perl) };
}
const rincian = (h, m) => memo('rinci:'+m.id, ()=> rincianIkut(h, m.profil.ikut, m.id));
const tagihanOf = (h, m) => memo('bill:'+m.id, ()=> rincian(h, m).total);
/* catatan singkat paket: "Full", "WiFi saja", "Tanpa WiFi", "Igar saja" */
function paketLabelIkut(h, ikut){
  const all = h.tarif.perlengkapan; if(!all.length) return '';
  const items = ikutItems(h, ikut);
  if(items.length===all.length) return 'Full';
  if(!items.length) return 'Igar saja';
  const tidak = all.filter(x=>!items.includes(x));
  return tidak.length < items.length ? 'Tanpa '+tidak.map(x=>x.nama).join(', ') : items.map(x=>x.nama).join(', ')+' saja';
}
const paketLabel = (h, m) => paketLabelIkut(h, m.profil.ikut);
const paidOf = (h, id, p) => memo('paid:'+id+':'+p, ()=> h.payments.filter(x=>x.memberId===id && x.period===p).reduce((a,b)=>a+b.nominal, 0));
/* Pembagian iuran berubah (perlengkapan dicentang/lepas, anggota ditambah/keluar, tarif diubah):
   penghuni yang SUDAH LUNAS bulan ini ikut disesuaikan nominalnya ke tagihan baru, supaya uang di kas
   (sisa saldo) sama dengan iuran yang benar. Bulan lalu & buku yang ditutup tidak disentuh. */
async function sesuaikanLunas(){
  const h = house(), p = thisPeriod();
  if(!h || locked(h, p)) return [];
  bumpCalc();
  const ubah = [];
  for(const m of aktif(h)){
    const recs = h.payments.filter(x=>x.memberId===m.id && x.period===p);
    let penuh = recs.filter(x=>x.penuh).sort(byNewest);
    /* data lama tanpa tanda 'penuh': dianggap lunas kalau sebelum perubahan jumlah bayarnya sudah menutup tagihan lama */
    if(!penuh.length && recs.length){
      const lama = tagihanLama && tagihanLama.get(m.id);
      if(lama && lama.bill > 0 && lama.paid >= lama.bill - 0.005) penuh = recs.slice().sort(byNewest);
    }
    if(!penuh.length) continue;
    const diff = r2(tagihanOf(h, m) - recs.reduce((a,x)=>a+x.nominal, 0));
    if(Math.abs(diff) < 0.01) continue;
    ubah.push({m, r:penuh[0], baru:r2(penuh[0].nominal + diff), diff});
  }
  tagihanLama = null;
  for(const u of ubah){
    if(u.baru > 0) await updateRow('payments', u.r.id, {nominal:u.baru, status_bayar:'penuh'});
    else await deleteRow('payments', u.r.id);
  }
  if(ubah.length) await catatLog(getMe()||'—', 'Iuran lunas disesuaikan ke tagihan baru: '+ubah.map(u=>`${u.m.nama} ${u.diff>0?'+':''}${nf.format(u.diff)}`).join(', '), 'payments');
  return ubah;
}
async function selesaiUbahIuran(pesan){
  let ubah = [];
  try{ ubah = await sesuaikanLunas(); if(ubah.length) await reloadHouse(); }
  catch(e){ toast('Gagal menyesuaikan iuran: '+(e.message||e)); }
  render();
  const net = r2(ubah.reduce((a,u)=>a+u.diff, 0));
  toast(!ubah.length ? pesan
    : Math.abs(net) < 0.01 ? `Iuran ${ubah.length} orang dibagi ulang · total kas tetap`
    : `Iuran ${ubah.length} orang disesuaikan · saldo ${net>0?'+':'−'}${egp(Math.abs(net))}`);
}
/* sekali ditandai lunas (geser / pelunasan), status bulan itu TETAP lunas walau pembagian perlengkapan
   berubah belakangan (mis. orang lain berhenti ikut WiFi). Data lama tanpa tanda: dibandingkan nominalnya. */
const lunasPenuh = (h, id, p) => memo('penuh:'+id+':'+p, ()=> h.payments.some(x=>x.memberId===id && x.period===p && x.penuh));
function statusOf(h, m, p){
  const paid = paidOf(h, m.id, p), bill = tagihanOf(h, m);
  if(paid<=0) return 'belum';
  if(lunasPenuh(h, m.id, p)) return 'lunas';
  return (bill && paid < bill - 0.005) ? 'kurang' : 'lunas';
}
const STATUS_LABEL = {lunas:'Sudah bayar', kurang:'Kurang', belum:'Belum bayar'};
const STATUS_CLS = {lunas:'lunas', kurang:'sebagian', belum:'belum'};
const masuk = (h, p) => memo('in:'+(p||''), ()=> h.payments.filter(x=>!p || x.period===p).reduce((a,b)=>a+b.nominal, 0));
/* uang masuk kas HANYA dari iuran (igar + perlengkapan) yang dicatat di tab Iuran */
const saldo = h => memo('saldo', ()=> h.saldoAwal + masuk(h) - sum(h.expenses));
/* uang keluar & iuran masuk jadi satu daftar (untuk Catatan terakhir) */
function arusKas(h, {keluar=true, masuk=true, p=''} = {}){
  const out = [];
  if(keluar) h.expenses.forEach(e=>{ if(!p || e.tanggal.startsWith(p)) out.push({...e, jenis:'keluar'}); });
  if(masuk){
    h.payments.forEach(x=>{ if(!p || x.period===p) out.push({id:x.id, tanggal:x.tanggal||(x.period+'-01'), created:x.created, nominal:x.nominal, dicatatOleh:x.dicatatOleh, memberId:x.memberId, period:x.period, jenis:'iuran'}); });
  }
  return out.sort(byNewest);
}
/* ---------- potongan tampilan bersama ---------- */

/* baris iuran masuk (hijau, +). Hanya tampilan; ketuk membuka tab Iuran. */
function inRow(h, x, tgl){
  const d = tgl? dRel(x.tanggal)+' · ' : '', m = h.members.find(y=>y.id===x.memberId);
  return `<button class="tx in${kelasBaru(x)}" data-a="kas-iuran" data-id="${esc(x.memberId)}" data-v="${esc(x.period)}">

    <span class="rt"><b>+${nf.format(x.nominal)}</b><small>EGP</small></span>
  </button>`;

/* flat = tanpa judul tanggal, tanggal ditulis di baris (hemat tempat di Beranda) */
function txGrouped(list, max, kosong, flat){
  if(!list.length) return `<div class="empty">${kosong||'Belum ada catatan pengeluaran.'}</div>`;
  let out = '', last = '';
  const h = house();
  list.slice(0, max||list.length).forEach(e=>{
    if(!flat && e.tanggal!==last){ out += `<div class="glabel">${dRel(e.tanggal)}</div>`; last = e.tanggal; }
    out += e.jenis==='iuran' ? inRow(h, e, flat) : txRow(e, flat);
  });
  return out;
}
function katBar(data){
  const tot = data.reduce((a,b)=>a+b.v,0) || 1;
  return `<div class="kbar" role="img" aria-label="Porsi pengeluaran per kategori">${data.map(d=>
    `<span style="flex:${(d.v/tot).toFixed(4)};background:${katColor(d.k).c}" title="${esc(d.k)}"></span>`).join('')}</div>`;
}
function smooth(pts){
  if(!pts.length) return '';
  if(pts.length===1) return `M${pts[0][0]},${pts[0][1]} L${pts[0][0]+.01},${pts[0][1]}`;
  const ys = pts.map(p=>p[1]), lo = Math.min(...ys), hi = Math.max(...ys);
  const cl = y => Math.min(hi, Math.max(lo, y));   // kurva tidak melampaui titik data (tidak "naik" palsu)
  let d = `M${pts[0][0].toFixed(2)},${pts[0][1].toFixed(2)}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    d += ` C${(p1[0]+(p2[0]-p0[0])/6).toFixed(2)},${cl(p1[1]+(p2[1]-p0[1])/6).toFixed(2)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(2)},${cl(p2[1]-(p3[1]-p1[1])/6).toFixed(2)} ${p2[0].toFixed(2)},${p2[1].toFixed(2)}`;
  }
  return d;
}

/* ---------- tren: nilai per periode (bukan akumulasi) -> hemat = garis turun ---------- */
function trendData(h){
  const t = today(), D = dailyTotals(h);
  if(S.range==='minggu'){
    const days = Array.from({length:7}, (_,i)=>dShift(t, i-6));
    const s1 = days.map(d=>D[d]||0), s2 = days.map(d=>D[dShift(d,-7)]||0);
    return { judul:'Total 7 hari terakhir', tot:s1.reduce((a,b)=>a+b,0), s1, s2, n:7,
      labels:days.map(d=>HARI[new Date(d+'T00:00:00').getDay()]), tips:days.map(dRel), l1:'Belanja rutin per hari', l2:'Minggu lalu' };
  }
  if(S.range==='tahun'){
    const months = Array.from({length:12}, (_,i)=>pShift(thisPeriod(), i-11)), s1 = months.map(m=>keluar(h,m));
    return { judul:'Total 12 bulan', tot:s1.reduce((a,b)=>a+b,0), s1, s2:null, n:12,
      labels:months.map(m=>bln1(+m.slice(5)-1)), tips:months.map(pShort), l1:'Total per bulan' };
  }
  const p = thisPeriod(), pp = pShift(p,-1), upto = +t.slice(8), n = Math.max(daysIn(p), daysIn(pp));
  const s1 = Array.from({length:upto}, (_,i)=>rolling(h, p+'-'+String(i+1).padStart(2,'0')));
  const s2 = Array.from({length:daysIn(pp)}, (_,i)=>rolling(h, pp+'-'+String(i+1).padStart(2,'0')));
  return { judul:'Total '+pLabel(p), tot:keluar(h,p), s1, s2, n, labels:['1','8','15','22',String(daysIn(p))],
    tips:s1.map((_,i)=>`${i+1} ${bln3(+p.slice(5)-1)}`), l1:'Rata-rata belanja rutin 7 hari', l2:'Bulan lalu' };
}
/* arah tren: periode ini dibanding periode sebelumnya (hari yang sama), atau 3 bulan terakhir vs 3 bulan sebelumnya */
function trendDir(sd){
  const s = sd.s1, avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
  let a, b, vs;
  if(sd.s2){ a = avg(sd.s2.slice(0, s.length)); b = avg(s); vs = 'belanja rutin vs ' + (S.range==='minggu' ? 'minggu lalu' : 'bulan lalu'); }
  else { const lalu = s.slice(0,-1).filter(v=>v>0); b = lalu.pop(); a = avg(lalu); vs = 'bulan lalu vs rata-rata sebelumnya'; }   // tahun: bulan penuh terakhir
  if(!a || !b) return {cls:'soft', icon:'arrow', label:'Belum cukup data', vs:''};
  const p = Math.round((b-a)/a*100);
  if(p <= -3) return {cls:'down', icon:'down', label:`${-p}% lebih hemat`, vs};
  if(p >= 3) return {cls:'up', icon:'up', label:`${p}% lebih boros`, vs};
  return {cls:'soft', icon:'arrow', label:'Stabil', vs};
}
let CH = null;   // grafik yang sedang tampil, dipakai untuk geser tooltip
function lineChart(sd){
  const max = Math.max(1, ...sd.s1);
  const X = i => 3 + i/Math.max(1, sd.n-1)*94, Y = v => 30 + (1 - v/max)*128;
  const path = s => smooth(s.map((v,i)=>[X(i), Y(v)]));
  const d1 = path(sd.s1), last = sd.s1.length-1;
  CH = { ...sd, X, Y, idx:last };
  return `<div class="chart" id="chart" role="img" aria-label="Grafik ${esc(sd.l1)}">
    <svg viewBox="0 0 100 170" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFCC33" stop-opacity=".45"/><stop offset="1" stop-color="#FFCC33" stop-opacity="0"/></linearGradient></defs>
      ${[30,94,158].map(y=>`<line x1="0" x2="100" y1="${y}" y2="${y}" style="stroke:var(--line)" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/>`).join('')}
      ${last>0? `<path d="${d1} L${X(last).toFixed(2)},170 L${X(0).toFixed(2)},170 Z" fill="url(#gf)"/>` : ''}
      <path d="${d1}" fill="none" style="stroke:var(--forest)" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    </svg>
    <span class="vl"></span><span class="cdot"></span><span class="tip"></span>
  </div>
  <div class="xlab">${sd.labels.map(l=>`<span>${l}</span>`).join('')}</div>
  <div class="legend"><span><i style="background:var(--forest)"></i>${sd.l1}</span></div>`;
}
function paintTip(i){
  const el = document.getElementById('chart'); if(!el || !CH || !CH.s1.length) return;
  i = Math.max(0, Math.min(CH.s1.length-1, i)); CH.idx = i;
  const x = CH.X(i), y = CH.Y(CH.s1[i]);
  el.querySelector('.vl').style.left = x+'%';
  const dot = el.querySelector('.cdot'); dot.style.left = x+'%'; dot.style.top = y+'px';
  const tip = el.querySelector('.tip'); tip.style.left = Math.min(86, Math.max(14, x))+'%'; tip.style.top = y+'px';
  tip.textContent = `${CH.tips[i]} · ${nf0.format(CH.s1[i])}`;
}
function trendCard(h){
  const sd = trendData(h), dir = trendDir(sd);

/* =====================================================================
   POIN, LEVEL & LENCANA — dihitung dari data yang sudah ada, tidak disimpan
   iuran lunas ≤ tgl 5 = 50 · lunas lewat tgl 5 = 25 · tugas selesai = 15
   ===================================================================== */
const POIN = {tepat:50, telat:25, tugas:15};
const LEVELS = [[0,'Penghuni baru'],[150,'Anak rumah'],[400,'Tangan rajin'],[800,'Andalan dapur'],[1300,'Penjaga kas'],[2000,'Sesepuh rumah'],[3000,'Legenda rumah']];
function levelOf(xp){
  let i = 0; while(i < LEVELS.length-1 && xp >= LEVELS[i+1][0]) i++;
  const min = LEVELS[i][0], nx = LEVELS[i+1];
  return {i, no:i+1, nama:LEVELS[i][1], min, next:nx? nx[0] : null, nextNama:nx? nx[1] : '', pct:nx? Math.min(1, (xp-min)/(nx[0]-min)) : 1};
}
/* tugas dianggap selesai: harian = hari ini, mingguan = 7 hari terakhir, bulanan = bulan ini */
function tugasSelesai(nama, t){
  const n = String(nama).toLowerCase(), td = today();
  const dari = t.f==='harian'? td : t.f==='mingguan'? dShift(td,-6) : thisPeriod()+'-01';
  return EXTRA.done.find(x=>x.nama.toLowerCase()===n && x.tugas===t.t && x.tanggal>=dari && x.tanggal<=td) || null;
}
/* jumlah bulan beruntun (berakhir bulan ini atau bulan lalu) */
function beruntun(periods){
  const set = new Set(periods); let p = set.has(thisPeriod())? thisPeriod() : pShift(thisPeriod(),-1), n = 0;
  while(set.has(p)){ n++; p = pShift(p,-1); }
  return n;
}
const skorRumah = h => memo('skor', ()=>{
  const p = thisPeriod(), pLalu = pShift(p,-1), map = new Map();
  aktif(h).forEach(m=>map.set(m.nama.toLowerCase(), {m, xp:0, bulan:0, lalu:0, lunas:0, tugas:0, tepat:[], hari:new Set(), streak:0, juara:false}));
  const add = (nama, pts, per) => { const s = map.get(String(nama||'').toLowerCase()); if(!s) return null; s.xp += pts; if(per===p) s.bulan += pts; if(per===pLalu) s.lalu += pts; return s; };
  map.forEach(s=>{
    [...new Set(h.payments.filter(x=>x.memberId===s.m.id).map(x=>x.period))].forEach(per=>{
      if(statusOf(h, s.m, per)!=='lunas') return;
      const tgl = h.payments.filter(x=>x.memberId===s.m.id && x.period===per).map(x=>x.tanggal||'').sort().pop();
      const ok = !!tgl && tgl <= per+'-05';
      add(s.m.nama, ok? POIN.tepat : POIN.telat, per); s.lunas++; if(ok) s.tepat.push(per);
    });
  });
  const seen = new Set();
  EXTRA.done.forEach(d=>{ const k = d.nama.toLowerCase()+'|'+d.tugas+'|'+d.tanggal; if(seen.has(k)) return; seen.add(k);
    const s = add(d.nama, POIN.tugas, d.tanggal.slice(0,7)); if(s){ s.tugas++; s.hari.add(d.tanggal); } });
  const list = [...map.values()];
  list.forEach(s=>{ let d = s.hari.has(today())? today() : dShift(today(),-1); while(s.hari.has(d)){ s.streak++; d = dShift(d,-1); } });
  const topLalu = Math.max(0, ...list.map(s=>s.lalu));
  list.forEach(s=>{ s.juara = topLalu > 0 && s.lalu===topLalu; });
  return { list, by: nama => map.get(String(nama||'').toLowerCase()) || null };
});
const peringkat = (h, key='bulan') => skorRumah(h).list.slice().sort((a,b)=>b[key]-a[key] || b.xp-a.xp || a.m.nama.localeCompare(b.m.nama));
const LENCANA = [
  {ic:'clock',  nama:'Tepat waktu',     desc:'Lunas sebelum tgl 5, 3 bulan beruntun', prog:s=>[beruntun(s.tepat), 3]},
  {ic:'flame',  nama:'Tujuh hari',      desc:'Ada tugas selesai 7 hari beruntun',     prog:s=>[s.streak, 7]},
  {ic:'coins',  nama:'Setia iuran',     desc:'Iuran lunas 6 bulan',                   prog:s=>[s.lunas, 6]},
  {ic:'broom',  nama:'Tangan rajin',    desc:'40 tugas rumah selesai',                prog:s=>[s.tugas, 40]},
  {ic:'crown',  nama:'Juara bulan lalu', desc:'Poin terbanyak bulan lalu',            prog:s=>[s.juara?1:0, 1]},
  {ic:'trophy', nama:'Sesepuh',         desc:'Mencapai level 6',                      prog:s=>[levelOf(s.xp).no, 6]}
];
function misiRumah(h){
  const p = thisPeriod(), ms = aktifDi(h,p), sk = skorRumah(h), ang = h.tarif.anggaran, pakai = keluar(h,p), out = [];
  if(ms.length){
    const n = ms.filter(m=>{ const s = sk.by(m.nama); return s && s.tepat.includes(p); }).length;
    out.push({ic:'coins', nama:'Semua lunas sebelum tanggal 5', pct:n/ms.length, done:n===ms.length, teks:`${n} dari ${ms.length} orang`});
  }
  if(ang) out.push({ic:'target', nama:'Belanja di bawah anggaran', pct:Math.min(1, pakai/ang), done:false, warn:pakai>ang,
    teks: pakai<=ang? `terpakai ${nf0.format(pakai)} dari ${nf0.format(ang)}` : `lewat ${egp(r2(pakai-ang))}`});
  let target = 0; ms.forEach(m=>m.profil.tugas.forEach(t=>{ target += t.f==='harian'? 7 : t.f==='mingguan'? 1 : 0; }));
  if(target){
    const dari = dShift(today(),-6), sel = new Set(EXTRA.done.filter(x=>x.tanggal>=dari).map(x=>x.nama+'|'+x.tugas+'|'+x.tanggal)).size;
    out.push({ic:'broom', nama:'Tugas rumah 7 hari terakhir', pct:Math.min(1, sel/target), done:sel>=target, teks:`${Math.min(sel,target)} dari ${target} tugas`});
  }
  return out;
}

const waktuPesan = x => jam(x.ts) + (x.pending? ' · mengirim' : '') + (x.gagal? ' · gagal terkirim' : '');
/* ubah status satu gelembung di tempat, supaya animasi masuknya tidak terpotong oleh gambar ulang */
function tandaPesan(x){
  const el = document.querySelector(`#chat-list [data-mid="${CSS.escape(x.id)}"]`); if(!el) return;
  el.classList.toggle('pending', !!x.pending); el.classList.toggle('gagal', !!x.gagal);
  const t = el.querySelector('time'); if(t) t.textContent = waktuPesan(x);
}
function terimaPesan(rec){
  const ada = EXTRA.chat.find(x=>x.id===rec.id);
  if(ada){ if(ada.pending || ada.gagal){ ada.pending = false; ada.gagal = false; tandaPesan(ada); } return; }
  EXTRA.chat.push(rec); EXTRA.chat.sort(byTs);
  if(S.mengetik===rec.nama) S.mengetik = null;
  if(S.route==='app' && S.page==='chat'){ pesanAnim.add(rec.id); paintChat(); return; }
  paintUnread();
  if(S.route==='app' && rec.nama.toLowerCase()!==String(getMe()).toLowerCase()) toast(`${rec.nama}: ${rec.isi}`);
}
async function kirimPesan(isi){
  const h = house(), me = getMe();
  isi = String(isi||'').trim().slice(0, 1000); if(!isi) return;
  if(!EXTRA.chatOk) return toast('Obrolan belum aktif. Jalankan supabase-chat-poin.sql di Supabase.');
  if(!me){ S.sheet = {name:'aku'}; renderLayer(); return toast('Pilih dulu namamu.'); }
  const rec = {id:newId(), nama:me, isi, ts:new Date().toISOString(), pending:true};
  EXTRA.chat.push(rec); pesanAnim.add(rec.id); S.chatDraft = '';
  const inp = document.getElementById('chat-in'); if(inp){ inp.value = ''; inp.style.height = ''; }
  paintChat(true);
  try{
    await insertRow('messages', {id:rec.id, house_id:h.id, member_nama:me, isi});
    rec.pending = false;
  }catch(e){ rec.pending = false; rec.gagal = true; toast('Pesan gagal terkirim. Periksa koneksi.'); }
  tandaPesan(rec);
  if(DEMO && !rec.gagal) demoBalas();
}
/* rumah contoh: penghuni lain membalas supaya obrolan terasa hidup */
const DEMO_BALAS = ['Siap, nanti aku bantu.', 'Oke, dicatat.', 'Aku baru pulang kuliah, mau titip apa?', 'Jazakallah khair.', 'Barusan aku cek, stok beras masih cukup sampai Kamis.', 'Insyaallah sore ini beres.'];
let demoT = null;
function demoBalas(){
  const me = String(getMe()).toLowerCase(), lain = aktif(house()).filter(m=>m.nama.toLowerCase()!==me);
  if(!lain.length || demoT) return;
  const m = lain[Math.floor(Math.random()*lain.length)], isi = DEMO_BALAS[Math.floor(Math.random()*DEMO_BALAS.length)];
  demoT = setTimeout(()=>{
    if(!DEMO){ demoT = null; return; }
    S.mengetik = m.nama; if(S.page==='chat') paintChat();
    demoT = setTimeout(()=>{
      demoT = null; if(!DEMO) return;
      const row = {id:newId(), house_id:'demo', member_nama:m.nama, isi, created_at:new Date().toISOString()};
      DEMO.messages.push(row); terimaPesan(normMsg(row));
    }, 1500);
  }, 900);
}

function occRow(h, m, p, lock){

/* tabel: Nama | Igar | Perlengkapan | Total | Catatan paket */
function ringkasanIuran(h, ms){
  const rows = ms.map(m=>{ const c = rincian(h, m); return {m, igar:c.igar, perl:c.perl, total:c.total}; });
  const tot = rows.reduce((a,r)=>({igar:a.igar+r.igar, perl:a.perl+r.perl, total:a.total+r.total}), {igar:0, perl:0, total:0});
  return `<div class="card scroll-x"><table>
    <thead><tr><th>Nama</th><th class="n">Igar</th><th class="n">Perlengkapan</th><th class="n">Total</th><th>Catatan</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td>${esc(r.m.nama)}</td><td class="n">${nf.format(r.igar)}</td><td class="n">${nf.format(r.perl)}</td>
      <td class="n"><b>${nf.format(r.total)}</b></td><td class="tiny">${esc(paketLabel(h, r.m)||'—')}</td></tr>`).join('')}
      <tr class="tot"><td>Semua</td><td class="n">${nf.format(r2(tot.igar))}</td><td class="n">${nf.format(r2(tot.perl))}</td><td class="n">${nf.format(r2(tot.total))}</td><td></td></tr>
    </tbody></table>
    <p class="tiny mt-s">Total rumah per bulan: igar ${nf.format(h.tarif.igar)}${h.tarif.perlengkapan.length? ' · '+h.tarif.perlengkapan.map(x=>`${esc(x.nama)} ${nf.format(x.harga)}`).join(' · ') : ''}. Dibagi rata ke anggota yang ikut.</p></div>`;
}

/* pil emas di navigasi meluncur dari tab lama ke tab baru (nav digambar ulang, jadi posisi lama diingat) */
let navPos = null;
function geserInd(){
  const nav = document.querySelector('#app .nav'); if(!nav){ return; }
  const ind = nav.querySelector('.ind'), on = nav.querySelector('button.on');
  if(!ind) return;
  if(!on){ ind.style.opacity = '0'; if(navPos){ ind.style.transition = 'none'; ind.style.width = navPos.w+'px'; ind.style.transform = `translateX(${navPos.x}px)`; } return; }
  const x = on.offsetLeft, w = on.offsetWidth;
  if(navPos && navPos.x !== x && !reduceMotion){
    ind.style.transition = 'none'; ind.style.width = w+'px'; ind.style.transform = `translateX(${navPos.x}px)`; ind.style.opacity = '1';
    void ind.offsetWidth; ind.style.transition = '';
  } else if(!navPos){ ind.style.transition = 'none'; ind.style.width = w+'px'; ind.style.transform = `translateX(${x}px)`; void ind.offsetWidth; ind.style.transition = ''; }
  ind.style.width = w+'px'; ind.style.transform = `translateX(${x}px)`; ind.style.opacity = '1';
  navPos = {x, w};
}
/* kartu tugas muncul sekali saat 20% bagian gridnya masuk layar; render berikutnya langsung tampil tanpa animasi */
let tugasObs = null;
function amatiTugas(){
  if(tugasObs){ tugasObs.disconnect(); tugasObs = null; }
  const grid = document.querySelector('#app .chores'); if(!grid) return;
  const tampilkan = () => { S.tugasTampil = true; grid.querySelectorAll('.flip.muncul').forEach(el=>el.classList.add('tampil')); };
  if(S.tugasTampil || reduceMotion || !('IntersectionObserver' in window)) return tampilkan();
  tugasObs = new IntersectionObserver(es=>{ if(es.some(e=>e.isIntersecting)){ tampilkan(); tugasObs.disconnect(); tugasObs = null; } }, {threshold:.2});
  tugasObs.observe(grid);
}
/* parallax ringan: elemen [data-px] bergeser pelan relatif ke posisi induknya di layar */
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let pxEls = [], pxRaf = 0;
function pxScan(){ if(reduceMotion) return; pxEls = [...document.querySelectorAll('#app [data-px]')]; pxFrame(); }
function pxFrame(){
  pxRaf = 0;
  const vh = window.innerHeight;
  for(const el of pxEls){
    const host = el.parentElement; if(!host) continue;
    const r = host.getBoundingClientRect();
    if(r.bottom < -80 || r.top > vh + 80) continue;
    const off = Math.max(-22, Math.min(22, (r.top + r.height/2 - vh/2) * -(+el.dataset.px)));
    el.style.transform = `translate3d(0,${off.toFixed(1)}px,0)`;
  }
}
window.addEventListener('scroll', ()=>{ if(!pxRaf && pxEls.length) pxRaf = requestAnimationFrame(pxFrame); }, {passive:true});
window.addEventListener('resize', ()=>{ if(pxEls.length) pxFrame(); if(CH) paintTip(CH.idx); }, {passive:true});

/* angka sisa saldo bergulir dari nilai lama ke nilai baru (feedback: toggle bayar / catat langsung terasa) */
let saldoTampil = null, saldoRaf = 0;
function gulirSaldo(pindah){
  const el = document.querySelector('#app .hero-saldo .big'), h = house();
  if(!el || !h){ return; }
  const baru = r2(saldo(h)), lama = saldoTampil;
  saldoTampil = baru;
  if(pindah || lama===null || lama===baru || reduceMotion) return;
  cancelAnimationFrame(saldoRaf);
  const t0 = performance.now(), dur = 420, ease = x => 1 - Math.pow(1 - x, 3);
  const tulis = v => { el.classList.toggle('minus', v<0); el.innerHTML = (v<0?'−':'') + bigMoney(Math.abs(v)); };
  el.classList.remove('tick'); void el.offsetWidth; el.classList.add('tick');
  const step = now => { const k = Math.min(1, (now - t0) / dur), v = Math.round(lama + (baru - lama) * ease(k));
    tulis(k<1 ? v : baru); if(k<1) saldoRaf = requestAnimationFrame(step); };
  tulis(lama); saldoRaf = requestAnimationFrame(step);
  /* jaga-jaga: kalau frame animasi tertahan (tab di latar), angka akhir tetap tertulis */

/* =====================================================================
   CADANGAN & PULIHKAN
   File .json berisi baris mentah semua tabel rumah (bukan CSV), jadi bisa dikembalikan utuh.
   Salinan otomatis juga disimpan di IndexedDB HP ini: sekali sehari + sebelum reset/pulihkan, 10 terakhir.
   ===================================================================== */
const CADANGAN_VERSI = 1, SNAP_MAKS = 10;
const IDB = (()=>{
  let dbp = null;
  const buka = () => dbp || (dbp = new Promise((ok, no)=>{
    try{
      const r = indexedDB.open('igarin-cadangan', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('snap', {keyPath:'key'}).createIndex('hid', 'hid');
      r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
    }catch(e){ no(e); }
  }).catch(e=>{ dbp = null; throw e; }));
  const jalan = (mode, fn) => buka().then(db=>new Promise((ok, no)=>{
    const t = db.transaction('snap', mode), req = fn(t.objectStore('snap'));
    t.oncomplete = () => ok(req.result); t.onerror = () => no(t.error); t.onabort = () => no(t.error);
  }));
  return { put:v=>jalan('readwrite', s=>s.put(v)), del:k=>jalan('readwrite', s=>s.delete(k)),
           get:k=>jalan('readonly', s=>s.get(k)), list:hid=>jalan('readonly', s=>s.index('hid').getAll(hid)) };
})();
const UNDUH_KEY = h => 'igarin:unduhcad:'+h.id;
function hariSejakUnduh(h){
  let t = null; try{ t = sessionStore.getItem(UNDUH_KEY(h)); }catch(e){}
  return t? Math.max(0, Math.floor((Date.now() - Date.parse(t)) / 864e5)) : null;
}

const TABEL_CADANGAN = ['members','payments','expenses','house_rules','periods','task_done','messages'];
function ringkasData(d){ const r = {}; TABEL_CADANGAN.forEach(t=>{ r[t] = (d[t]||[]).length; }); return r; }
async function ambilSemua(table, hid, cols, order){
  const out = [];
  for(let from=0; ; from+=1000){
    const {data, error} = await sb.from(table).select(cols).eq('house_id', hid).order(order, {ascending:true}).range(from, from+999);
    if(error) throw new Error(table+': '+error.message);
    out.push(...(data||[])); if(!data || data.length < 1000) break;
  }
  return out;
}

async function buatCadangan(){

  else {

    if(EXTRA.chatOk) messages = await ambilSemua('messages', h.id, 'member_nama,isi,created_at', 'created_at');
  }

    periods:b.periods||[], task_done, messages, activity_log:b.activity_log||[]};

/* cek file sebelum menyentuh database: bentuk, versi, jumlah baris cocok (file terpotong/diedit ketahuan) */
function cekCadangan(c){
  if(!c || c.app!=='igarin' || c.jenis!=='cadangan' || !c.data || !c.data.house) return 'Ini bukan file cadangan Igarin.';
  if(+c.versi > CADANGAN_VERSI) return 'File dibuat oleh Igarin versi lebih baru. Perbarui aplikasi dulu.';
  const d = c.data;
  for(const t of TABEL_CADANGAN) if(d[t]!=null && !Array.isArray(d[t])) return `Bagian ${t} di file rusak.`;
  const r = ringkasData(d);
  if(c.ringkas && TABEL_CADANGAN.some(t=>c.ringkas[t]!=null && +c.ringkas[t]!==r[t])) return 'Isi file tidak lengkap (jumlah data tidak cocok). File mungkin terpotong atau diubah.';
  const ids = new Set((d.members||[]).map(m=>String(m.id)));
  if((d.members||[]).some(m=>!m || !m.nama)) return 'Ada penghuni tanpa nama di file.';
  if((d.payments||[]).some(p=>!ids.has(String(p.member_id)))) return 'Ada iuran yang penghuninya tidak ada di file.';
  if((d.expenses||[]).some(e=>!e.tanggal || !(+e.nominal>0))) return 'Ada pengeluaran dengan tanggal/nominal tidak valid.';
  return '';
}
function namaFileCadangan(c){

}

function keyIn(k){
  const f = S.form; if(!f) return;
  if(k==='00'){ keyIn('0'); keyIn('0'); return; }
  /* nominal lama (saat ubah catatan / isi otomatis iuran) langsung diganti saat angka pertama diketik */
  if(f.fresh){ f.fresh = false; f.auto = false; if(k!=='del') f.amt = ''; }
  f.auto = false;
  let a = f.amt;
  if(k==='del') a = a.slice(0,-1);
  else if(k==='.'){ if(!a.includes('.')) a = (a||'0') + '.'; }
  else {
    const [i, d] = a.split('.');
    if(d!==undefined && d.length>=2) return;
    if(d===undefined && i.length>=7) return;
    a = (a==='0'? '' : a) + k;
  }
  f.amt = a; paintAmt();
  if(navigator.vibrate) try{ navigator.vibrate(8); }catch(e){}
}

          if(navigator.canShare && navigator.canShare({files:[file]})){
            try{ await navigator.share({files:[file], title:'Cadangan Igarin'}); try{ sessionStore.setItem(UNDUH_KEY(h), new Date().toISOString()); }catch(e){} toast('Cadangan dibagikan.'); }
            catch(e){ if(e && e.name!=='AbortError') unduhCadangan(c); }
          } else unduhCadangan(c);
        } else unduhCadangan(c);
        if(!DEMO) simpanSnap(c, 'Saat diunduh').catch(()=>{});
      }catch(err){ toast('Gagal membuat cadangan: '+(err.message||err)); }
      if(el.isConnected){ el.disabled = false; el.innerHTML = teks; }
      render();
      return;
    }
    case 'cad-buat': {
      el.disabled = true;
      try{ await simpanSnap(await buatCadangan(), 'Manual'); toast('Salinan disimpan di HP ini.'); }
      catch(err){ toast('Gagal menyimpan salinan: '+(err.message||err)); }
      if(el.isConnected) el.disabled = false;
      return;
    }
    case 'cad-hp-unduh': case 'cad-hp-pulih': {
      let rec = null; try{ rec = await IDB.get(v); }catch(e){}
      if(!rec || !rec.isi) return toast('Salinan tidak ditemukan.');
      if(a==='cad-hp-unduh') return unduhCadangan(rec.isi);
      const err = cekCadangan(rec.isi); if(err) return toast(err);
      S.pulih = {c:rec.isi, sumber:'salinan di HP'}; S.sheet = {name:'pulihkan'}; return renderLayer();
    }
    case 'pl-go': {
      if(val('pl-word')!=='PULIHKAN') return ferr('Ketik PULIHKAN dengan huruf besar.');
      const c = S.pulih && S.pulih.c; if(!c) return closeSheet();
      el.disabled = true; el.textContent = 'Menyimpan salinan data sekarang…';
      /* pengaman: data sekarang disalin dulu. Gagal simpan di HP -> diunduh sebagai file. Gagal dibaca dari server -> batal. */
      let kini;
      try{ kini = await buatCadangan(); }
      catch(err){ el.disabled = false; el.textContent = 'Coba lagi'; return ferr('Data sekarang tidak terbaca dari server, pemulihan dibatalkan supaya aman. '+(err.message||'')); }
      try{ if(!DEMO) await simpanSnap(kini, 'Sebelum pulihkan'); }
      catch(e){ unduhCadangan(kini); }
      el.textContent = 'Memulihkan…';
      try{ await pulihkanCadangan(h, c); }
      catch(err){ el.disabled = false; el.textContent = 'Coba lagi';
        return ferr('Pemulihan terhenti: '+(err.message||err)+'. Data sebelum pemulihan ada di "Salinan otomatis di HP ini".'); }
      S.sheet = null; S.pulih = null; S.page = null; S.tab = 'beranda';
      if(!aktif(house()).some(m=>m.nama===getMe())) setMe('');
      if(!getMe()) S.route = 'siapa';
      render(); toast('Data berhasil dipulihkan.');
      return;
    }
    case 'page-from-sheet': S.from = S.page? S.from : S.tab; S.sheet = null; S.rulesPopup = false; S.levelUp = null; S.page = v; return render();
    case 'lb': S.lb = v; return render();
    case 'per': S.period = pShift(S.period||thisPeriod(), +v); return render();
    case 'range': S.range = v; return render();
    case 'fk': S.fk = v; return render();
    case 'rj': S.rj = v; return render();
    case 'fstat': S.fstat = v; return render();
    case 'flip': {
      const on = el.classList.toggle('on'); el.setAttribute('aria-pressed', on);
      if(!S.flipped) S.flipped = new Set();
      if(el.dataset.id) S.flipped[on? 'add' : 'delete'](el.dataset.id);
      return;
    }
    /* centang tugas: kotak langsung tercentang (feedback), data & poin menyusul, gambar ulang setelah transisi selesai */
    case 'tugas-done': {
      if(!EXTRA.doneOk) return toast('Centang tugas belum aktif. Jalankan supabase-chat-poin.sql di Supabase.');
      const m = h.members.find(x=>x.id===id), t = m && m.profil.tugas[+v]; if(!t) return;
      if(!me){ S.sheet = {name:'aku'}; renderLayer(); return toast('Pilih dulu namamu.'); }
      const row = tugasSelesai(m.nama, t), rect = el.querySelector('.cb').getBoundingClientRect();
      el.classList.toggle('on', !row); el.setAttribute('aria-checked', !row);
      const segarkan = () => setTimeout(()=>renderBg(), 240);
      if(row){
        EXTRA.done = EXTRA.done.filter(x=>x!==row); bumpCalc(); segarkan();
        (async()=>{ try{ await deleteRow('task_done', row.id); }
          catch(e){ EXTRA.done.push(row); bumpCalc(); renderBg(); toast('Gagal membatalkan — coba lagi.'); } })();
        return;
      }
      const rec = {id:newId(), nama:m.nama, tugas:t.t, tanggal:today(), oleh:me};
      EXTRA.done.unshift(rec); bumpCalc(); segarkan();
      xpFloat(rect, `+${POIN.tugas} XP ${m.nama}`);
      if(navigator.vibrate) try{ navigator.vibrate(10); }catch(e){}
      (async()=>{
        try{ await insertRow('task_done', {id:rec.id, house_id:h.id, member_nama:m.nama, tugas:t.t, tanggal:rec.tanggal, dicatat_oleh:me});
             await catatLog(me, `Tugas selesai: ${m.nama} — ${t.t}`, 'task_done'); }
        catch(e){ EXTRA.done = EXTRA.done.filter(x=>x!==rec); bumpCalc(); renderBg(); toast('Gagal menyimpan tugas — dikembalikan.'); }
      })();
      return;
    }
    /* ---- obrolan ---- */
    case 'chat-send': { const inp = document.getElementById('chat-in'); await kirimPesan(inp? inp.value : ''); if(inp) inp.focus({preventScroll:true}); return; }
    case 'chat-cepat': return kirimPesan(t(v));
    case 'sheet':
      if(v==='member') return openMember(id);
      if(v==='tarif') return openTarif();
      if(v==='reset') S.reset = {step:1};
      if(v==='checkout') S.step = 1;
      S.sheet = {name:v, id:id||null, kat:el.dataset.kat||''}; S.rulesPopup = false;
      return renderLayer();
    case 'close': case 'close-scrim': return closeSheet();
    case 'rules': S.sheet = null; S.rulesPopup = true; S.slide = 0; return renderLayer();
    case 'sl-dot': return slideTo(+v);
    case 'sl-prev': return slideTo(S.slide-1);
    case 'sl-next': {
      const box = document.getElementById('rslides');
      if(!box || S.slide >= box.children.length-1) return closeSheet();
      return slideTo(S.slide+1);
    }
    case 'co-step': S.step = +v; return renderLayer();
    case 'salin-rek': try{ await navigator.clipboard.writeText(BAYAR.rekening); toast('Nomor rekening disalin.'); }catch(e){ toast('Nomor: '+BAYAR.rekening); } return;
    case 'print': return window.print();

    /* ---- masuk, aktivasi, contoh, keluar ---- */
    case 'demo': DEMO = demoBundle(); await reloadHouse(); setMe(''); S.route = 'siapa'; return render();
    case 'masuk': {
      if(!sb) return ferr('Tidak bisa terhubung ke server.');
      try{
        const { error } = await sb.auth.signInWithPassword({ email:emailFor(val('user')), password:val('pass') });
        if(error) throw error;
        await reloadHouse(); afterLogin(); render();
      }catch(err){ ferr('Username atau password salah.'); }
      return;
    }
    case 'aktivasi': {
      const kode=val('kode'), nama=val('nama'), u=val('user'), p1=val('pass'), p2=val('pass2');
      if(!/^\d{9}$/.test(kode)) return ferr('Kode harus 9 angka.');
      if(!nama) return ferr('Isi nama rumah.');
      if(u.length<3) return ferr('Username minimal 3 karakter.');
      if(p1.length<6) return ferr('Password minimal 6 karakter.');
      if(p1!==p2) return ferr('Dua password belum sama.');
      if(!sb) return ferr('Tidak bisa terhubung ke server.');
      try{
        let { error } = await sb.auth.signUp({ email:emailFor(u), password:p1 });
        if(error) throw error;
        ({ error } = await sb.auth.signInWithPassword({ email:emailFor(u), password:p1 }));
        if(error) throw error;
        ({ error } = await sb.rpc('redeem_code', { p_kode:kode, p_nama:nama, p_kontak:val('kontak') }));
        if(error) throw error;
        await reloadHouse(); S.route = 'siapa'; render();
      }catch(err){ ferr(/registered/i.test(err.message||'')? 'Username sudah dipakai rumah lain.' : (err.message || 'Kode tidak ditemukan atau sudah terpakai.')); }
      return;
    }
    case 'keluar': {
      if(DEMO){ DEMO = null; EXTRA = kosongExtra(); } else { stopRealtime(); if(sb) await sb.auth.signOut(); }
      S.levelUp = null; S.flipped = new Set(); S.chatDraft = ''; navPos = null;
      DB = {houses:{}, session:{}}; S.tab = 'beranda'; return go('landing');
    }

    /* ---- identitas ---- */
    case 'ganti-aku': S.sheet = {name:'aku'}; return renderLayer();
    case 'set-tema': {
      TEMA = v; try{ sessionStore.setItem(PREF_TEMA, v); }catch(e){}
      terapkanTema(true); bumpCalc(); render(); return;
    }
    case 'set-bahasa': {
      if(v===LANG) return;
      LANG = v; try{ sessionStore.setItem(PREF_BAHASA, v); }catch(e){}
      if(i18nObs){ i18nObs.disconnect(); i18nObs = null; }
      navPos = null;
      terapkanBahasa(); bumpCalc(); render(); return;
    }
    case 'aku': case 'aku-simpan': {
      let nama = v;
      if(a==='aku-simpan'){
        nama = val('aku-baru'); if(!nama) return ferr('Tulis dulu namamu.');
        const exists = h.members.some(m=>m.nama.toLowerCase()===nama.toLowerCase());
        if(chk('aku-daftar') && !exists){
          const row = {house_id:h.id, nama, status:'aktif', tanggal_gabung:today()};
          if(h.hasProfil) row.profil = {warna:null, ikut:'semua', tugas:[]};
          const ok = await doAction(async()=>{ await insertRow('members', row); await catatLog(nama, `Tambah penghuni ${nama}`, 'members'); });
          if(!ok) return;
        }
      }
      setMe(nama);
      if(S.route==='siapa'){ S.route = 'app'; S.tab = 'beranda'; maybePopup(); }
      S.sheet = S.afterAku && S.form ? {name:'catat'} : null; S.afterAku = false;
      render(); toast('Halo, '+nama+'.'); return;
    }

    /* ---- catat pengeluaran ---- */
    case 'catat': return openCatat(null);
    case 'edit': return openCatat(id);
    case 'key': return keyIn(v);
    case 'amt-add': {
      const f = S.form, base = f.fresh ? 0 : (parseFloat(f.amt)||0);
      f.fresh = false; f.auto = false;
      const n = Math.round((base + (+v))*100)/100;
      if(n < 1e7){ f.amt = String(n); paintAmt(); } else toast('Nominal terlalu besar.');
      return;
    }
    /* baris iuran di Beranda hanya tampilan: ketuk -> buka tab Iuran di bulan itu (satu pintu) */
    case 'kas-iuran': S.tab = 'iuran'; S.page = null; S.sheet = null; S.period = v; return render();
    case 'f-kat': {
      S.form.kat = v;
      document.querySelectorAll('.kp[data-a="f-kat"]').forEach(b=>{ const on = b.dataset.v===v; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
      return;
    }
    case 'f-date': syncCatat(); S.form.date = v; return renderLayer();
    case 'f-simpan': {
      const f = S.form; syncCatat();
      const n = Math.round((parseFloat(f.amt)||0)*100)/100;
      if(!(n>0)) return ferr('Ketik nominalnya dulu.');
      if(f.date > today()) return ferr('Tanggal tidak boleh di masa depan.');
      if(locked(h, f.date.slice(0,7))) return ferr('Buku '+pLabel(f.date.slice(0,7))+' sudah ditutup.');
      if(!me){ S.afterAku = true; S.sheet = {name:'aku'}; renderLayer(); return toast('Pilih dulu namamu.'); }
      const nowIso = new Date().toISOString();
      const old = f.id? h.expenses.find(x=>x.id===f.id) : null;
      const rec = { tanggal:f.date, kategori:f.kat, deskripsi:f.note||f.kat, nominal:n, besar:f.besar, dicatatOleh: old? old.dicatatOleh : me, bukti:f.bukti||'' };
      const row = { tanggal:rec.tanggal, kategori:rec.kategori, deskripsi:rec.deskripsi, nominal:n, is_besar:rec.besar, dicatat_oleh:rec.dicatatOleh, bukti_foto_url:rec.bukti||null };
      S.lastKat = f.kat;
      if(old){
        S.sheet = null;
        quick(()=>Object.assign(old, rec), async()=>{ await updateRow('expenses', old.id, row); await catatLog(me, `Ubah pengeluaran ${rec.deskripsi} ${nf.format(n)} EGP`, 'expenses'); }, 'Perubahan disimpan.');
      } else {
        S.lastSaved = { ...rec };
        S.sheet = {name:'struk'};
        quick(()=>h.expenses.push({id:'tmp-'+uid(), created:nowIso, ...rec}),
          async()=>{ await insertRow('expenses', {house_id:h.id, ...row}); await catatLog(me, `Catat pengeluaran ${rec.deskripsi} ${nf.format(n)} EGP`, 'expenses'); });
      }
      return;
    }
    case 'f-hapus': {
      const old = h.expenses.find(x=>x.id===S.form.id); if(!old) return closeSheet();
      if(!confirm(t(`Hapus "${old.deskripsi}" ${egp(old.nominal)}?`))) return;
      S.sheet = null;
      quick(()=>{ h.expenses = h.expenses.filter(x=>x.id!==old.id); },
        async()=>{ await deleteRow('expenses', old.id); await catatLog(me||'—', `Hapus pengeluaran ${old.deskripsi}`, 'expenses'); },
        `Catatan dihapus · saldo +${egp(old.nominal)}`);
      return;
    }

    /* ---- iuran ---- */
    /* geser ON  = catat sisa iuran bulan ini          -> sisa saldo bertambah
       geser OFF = batalkan pembayaran TERAKHIR saja   -> sisa saldo berkurang
       (cicilan sebelumnya tetap tersimpan, jadi salah geser bisa dibatalkan tanpa kehilangan data) */
    case 'bayar-toggle': {
      const p = S.period||thisPeriod(); if(locked(h,p)) return toast('Buku '+pLabel(p)+' sudah ditutup.');
      const m = h.members.find(x=>x.id===id); if(!m) return;
      const bill = tagihanOf(h,m), paid = paidOf(h,id,p);
      if(statusOf(h,m,p)==='lunas'){
        const last = h.payments.filter(x=>x.memberId===id && x.period===p).sort((a,b)=>byNewest(a,b))[0];
        const sisaBayar = r2(paid - last.nominal), kurang = r2(bill - sisaBayar);
        quick(()=>{ h.payments = h.payments.filter(x=>x!==last); },
          async()=>{ if(!String(last.id).startsWith('tmp-')) await deleteRow('payments', last.id);
                     await catatLog(me||'—', `Batalkan pembayaran ${m.nama} ${pShort(p)} ${nf.format(last.nominal)} EGP`, 'payments'); },
          sisaBayar<=0 ? `${m.nama} belum bayar · saldo −${egp(last.nominal)}`
            : kurang>0 ? `${m.nama} kembali kurang ${egp(kurang)} · saldo −${egp(last.nominal)}`
            : `Pembayaran terakhir ${m.nama} dibatalkan · saldo −${egp(last.nominal)}`);
        return;
      }
      const sisa = r2(bill - paid);
      if(!(sisa>0)) return toast('Tarif iuran belum diatur.');
      if(!me){ S.sheet = {name:'aku'}; renderLayer(); return toast('Pilih dulu namamu.'); }
      quick(()=>h.payments.push({id:'tmp-'+uid(), memberId:id, period:p, nominal:sisa, tanggal:today(), dicatatOleh:me, created:new Date().toISOString(), penuh:true}),
        async()=>{ await insertRow('payments', {house_id:h.id, member_id:id, periode:p, nominal:sisa, tanggal_bayar:today(), dicatat_oleh:me, status_bayar:'penuh'});
                   await catatLog(me, `Tandai sudah bayar ${m.nama} ${pShort(p)} ${nf.format(sisa)} EGP`, 'payments'); },
        `${m.nama} sudah bayar · saldo +${egp(sisa)}`);
      return;
    }
    case 'sv-bayar': {
      const p = S.period||thisPeriod(), n = parseFloat(val('b-nom')), m = h.members.find(x=>x.id===id);
      if(locked(h,p)) return ferr('Buku bulan ini sudah ditutup.');
      if(!(n>0)) return ferr('Isi jumlah yang dibayar.');
      if(!me) return ferr('Pilih dulu namamu di beranda (ikon bulat kiri atas).');
      const penuh = n >= r2(tagihanOf(h,m) - paidOf(h,id,p)) - 0.005;   // pembayaran ini melunasi -> kunci status lunas
      const ok = await doAction(async()=>{
        await insertRow('payments', {house_id:h.id, member_id:id, periode:p, nominal:n, tanggal_bayar:val('b-tgl')||today(), dicatat_oleh:me, status_bayar: penuh? 'penuh' : 'sebagian'});
        await catatLog(me, `Catat iuran ${m.nama} ${pShort(p)} ${nf.format(n)} EGP`, 'payments');
      });
      if(ok){ S.sheet = null; render(); toast('Pembayaran '+m.nama+' tercatat.'); }
      return;
    }
    case 'del-bayar': {
      const ok = await doAction(async()=>{ await deleteRow('payments', id); await catatLog(me||'—', 'Hapus catatan iuran', 'payments'); });
      if(ok) render();
      return;
    }

    /* ---- profil penghuni ---- */
    case 'q-anggota': {
      const nama = val('q-anggota'); if(!nama) return ferr('Ketik nama dulu.');
      const lama = h.members.find(m=>m.nama.toLowerCase()===nama.toLowerCase());
      if(lama && lama.status!=='keluar') return ferr(nama+' sudah ada.');
      if(lama){   // pernah keluar -> aktifkan lagi, riwayat iurannya tetap utuh
        const ok = await doAction(async()=>{ await updateRow('members', lama.id, {status:'aktif', tanggal_keluar:null}); await catatLog(me||nama, `Aktifkan lagi anggota ${lama.nama}`, 'members'); });
        if(ok) await selesaiUbahIuran(lama.nama+' aktif lagi.');
        return;
      }
      const row = {house_id:h.id, nama, status:'aktif', tanggal_gabung:today()};
      if(h.hasProfil) row.profil = {warna:null, ikut:'semua', tugas:[]};
      const ok = await doAction(async()=>{ await insertRow('members', row); await catatLog(me||nama, `Tambah penghuni ${nama}`, 'members'); });
      if(ok) await selesaiUbahIuran(nama+' ditambahkan (ikut semua perlengkapan).');
      return;
    }
    /* keluarkan anggota: punya riwayat iuran -> status "keluar" (riwayat tetap), belum pernah bayar -> dihapus */
    case 'agt-keluar': {
      const m = h.members.find(x=>x.id===id); if(!m) return;
      const punyaRiwayat = h.payments.some(x=>x.memberId===m.id);
      if(!confirm(t(`Keluarkan ${m.nama} dari anggota rumah?${punyaRiwayat? ' Riwayat iurannya tetap tersimpan.' : ''}`))) return;
      const ok = await doAction(async()=>{
        if(punyaRiwayat) await updateRow('members', m.id, {status:'keluar', tanggal_keluar:today()});
        else if(!String(m.id).startsWith('tmp-')) await deleteRow('members', m.id);
        await catatLog(me||'—', `${punyaRiwayat?'Keluarkan':'Hapus'} anggota ${m.nama}`, 'members');
      });
      if(ok) await selesaiUbahIuran(m.nama+(punyaRiwayat? ' dikeluarkan.' : ' dihapus dari anggota.'));
      return;
    }
    case 'mf-full': syncMForm(); S.mform.ikut = 'semua'; return renderLayer();
    case 'mf-ikut': {
      syncMForm(); const f = S.mform, all = h.tarif.perlengkapan.map(x=>x.id);
      let ikut = f.ikut==='semua' ? all.slice() : f.ikut.filter(x=>all.includes(x));
      ikut = ikut.includes(v) ? ikut.filter(x=>x!==v) : ikut.concat(v);
      f.ikut = ikut.length===all.length ? 'semua' : ikut;
      return renderLayer();
    }
    case 'mf-warna': syncMForm(); S.mform.warna = +v; return renderLayer();
    case 'mf-task-del': syncMForm(); S.mform.tugas.splice(+v, 1); return renderLayer();
    case 'mf-task-add': {
      syncMForm(); const f = S.mform, t = (f.newTask||'').trim();
      if(!t){ const n = document.getElementById('m-task-new'); if(n) n.focus(); return; }
      f.tugas.push({t, f:f.newF||'harian'}); f.newTask = '';
      renderLayer();
      const n = document.getElementById('m-task-new'); if(n) n.focus({preventScroll:true});
      return;
    }
    case 'sv-member': {
      syncMForm(); const f = S.mform;
      if((f.newTask||'').trim()){ f.tugas.push({t:f.newTask.trim(), f:f.newF||'harian'}); f.newTask = ''; }
      const nama = f.nama; if(!nama) return ferr('Isi nama penghuni.');
      if(h.members.some(m=>m.id!==f.id && m.nama.toLowerCase()===nama.toLowerCase())) return ferr(nama+' sudah ada di daftar.');
      const row = {nama, status:f.status, tanggal_gabung:f.gabung||today(), tanggal_keluar:f.keluar||null};
      if(h.hasProfil) row.profil = {warna:Number.isInteger(f.warna)? f.warna : warnaIdx(null, nama), ikut:f.ikut, tugas:f.tugas.filter(x=>x.t.trim()).map(x=>({t:x.t.trim(), f:x.f}))};
      const old = f.id? h.members.find(x=>x.id===f.id) : null;
      const ok = await doAction(async()=>{
        if(old) await updateRow('members', old.id, row); else await insertRow('members', {house_id:h.id, ...row});
        await catatLog(me||'—', `${old?'Ubah':'Tambah'} profil penghuni ${nama}`, 'members');
      });
      if(ok){ if(old && getMe()===old.nama && nama!==old.nama) setMe(nama); S.sheet = null; S.mform = null; await selesaiUbahIuran('Profil '+nama+' disimpan.'); }
      return;
    }
    case 'del-member': {
      const m = h.members.find(x=>x.id===S.mform.id); if(!m) return closeSheet();
      if(h.payments.some(x=>x.memberId===m.id)) return ferr('Punya riwayat iuran — ubah status jadi "Sudah keluar" supaya riwayatnya tetap utuh.');
      if(!confirm(t(`Hapus ${m.nama} dari daftar penghuni?`))) return;
      const ok = await doAction(async()=>{ await deleteRow('members', m.id); await catatLog(me||'—', `Hapus penghuni ${m.nama}`, 'members'); });
      if(ok){ S.sheet = null; await selesaiUbahIuran(m.nama+' dihapus.'); }
      return;
    }

    /* ---- tarif ---- */
    case 'tf-add': {
      syncTForm(); S.tform.items.push({id:uid(), nama:'', harga:''}); renderLayer();
      const r = document.querySelectorAll('[data-kr] [data-f=nama]'); if(r.length) r[r.length-1].focus({preventScroll:false});
      return;
    }
    case 'tf-del': syncTForm(); S.tform.items.splice(+v, 1); return renderLayer();
    case 'tf-contoh': syncTForm(); if(S.tform.igar==='') S.tform.igar = TARIF_CONTOH.igar; S.tform.items = TARIF_CONTOH.perlengkapan.map(x=>({...x})); return renderLayer();
    case 'sv-tarif': {
      syncTForm(); const f = S.tform;
      const igar = parseFloat(f.igar);
      if(f.igar==='' || !(igar>=0)) return ferr('Isi iuran igar per orang.');
      const items = f.items.map(x=>({id:x.id, nama:String(x.nama||'').trim(), harga:parseFloat(x.harga)}));

        await updateRow('houses', h.id, tarifPatch(h, {igar, perlengkapan:items}));
        await catatLog(me||'—', `Atur iuran (igar ${nf.format(igar)} · ${items.length} item perlengkapan)`, 'houses');
      });
      if(ok){ S.sheet = null; await selesaiUbahIuran('Iuran disimpan.'); }
      return;
    }

    /* ---- reset ke pengaturan awal ---- */
    case 'backup': {
      const rows = [['Cadangan data', h.nama, today()], [], ['PENGELUARAN'], ['Tanggal','Kategori','Deskripsi','Nominal (EGP)','Besar','Dicatat oleh']];
      h.expenses.slice().sort((x,y)=>x.tanggal.localeCompare(y.tanggal)).forEach(e=>rows.push([e.tanggal, e.kategori, e.deskripsi, e.nominal, e.besar?'ya':'', e.dicatatOleh]));
      rows.push([], ['IURAN'], ['Periode','Nama','Nominal (EGP)','Tanggal bayar','Dicatat oleh']);
      h.payments.forEach(p=>rows.push([p.period, (h.members.find(m=>m.id===p.memberId)||{}).nama||'—', p.nominal, p.tanggal, p.dicatatOleh]));
      rows.push([], ['IURAN & PERLENGKAPAN'], ['Igar satu rumah per bulan', h.tarif.igar], ['Anggaran bulanan', h.tarif.anggaran], ['Item perlengkapan','Total satu rumah per bulan']);
      h.tarif.perlengkapan.forEach(x=>rows.push([x.nama, x.harga]));
      rows.push([], ['PENGHUNI & TUGAS'], ['Nama','Perlengkapan','Iuran (EGP)','Status','Tugas']);
      h.members.forEach(m=>rows.push([m.nama, paketLabel(h,m), tagihanOf(h,m), m.status, m.profil.tugas.map(x=>x.t+' ('+FREQ[x.f]+')').join('; ')]));
      rows.push([], ['TATA TERTIB']); h.rules.forEach(r=>rows.push([r.teks]));
      return unduh(`igarin-cadangan-${today()}.csv`, csvText(rows));
    }
    case 'rs-next': if(!chk('rs-ok')) return; S.reset.step = 2; renderLayer(); { const w = document.getElementById('rs-word'); if(w) w.focus(); } return;
    case 'rs-back': S.reset.step = 1; return renderLayer();
    case 'rs-go': {
      if(val('rs-word')!=='RESET') return ferr('Ketik RESET dengan huruf besar untuk konfirmasi.');
      el.disabled = true; el.textContent = 'Menyimpan salinan…';
      try{ const kini = await buatCadangan(); try{ if(!DEMO) await simpanSnap(kini, 'Sebelum reset'); }catch(e){ unduhCadangan(kini); } }
      catch(err){ el.disabled = false; el.textContent = 'Coba lagi'; return ferr('Data tidak terbaca dari server, reset dibatalkan supaya aman.'); }
      el.textContent = 'Menghapus…';
      try{ await factoryReset(h); }
      catch(err){ el.disabled = false; el.textContent = 'Coba lagi'; return ferr('Reset gagal: '+(err.message||err)+'. Sebagian data mungkin sudah terhapus — muat ulang halaman.'); }
      setMe(''); S.sheet = null; S.reset = null; S.page = null; S.tab = 'beranda'; S.route = 'siapa';
      render(); toast('Data rumah sudah kembali ke pengaturan awal.');
      return;
    }

    /* ---- anggaran: satu angka untuk semua pengeluaran sebulan ---- */
    /* ---- pengaturan awal (wajib, sekali di awal) ---- */
    case 'su-add-agt': { syncSetup(); S.setup.anggota.push(''); renderLayer();
      const r = document.querySelectorAll('#layer [data-sa]'); if(r.length) r[r.length-1].focus(); return; }
    case 'su-del-agt': syncSetup(); S.setup.anggota.splice(+v, 1); if(!S.setup.anggota.length) S.setup.anggota.push(''); return renderLayer();
    case 'su-add-item': { syncSetup(); S.setup.items.push({id:uid(), nama:'', harga:''}); renderLayer();

    case 'su-del-item': syncSetup(); S.setup.items.splice(+v, 1); return renderLayer();
    case 'su-contoh': syncSetup(); S.setup.items = TARIF_CONTOH.perlengkapan.map(x=>({...x})); if(S.setup.igar==='') S.setup.igar = TARIF_CONTOH.igar; return renderLayer();
    case 'sv-setup': {
      syncSetup(); const f = S.setup;
      const names = f.anggota.map(x=>x.trim()).filter(Boolean);
      if(!names.length) return ferr('Isi minimal satu nama anggota rumah.');
      if(new Set(names.map(x=>x.toLowerCase())).size !== names.length) return ferr('Ada nama anggota yang sama.');
      const igar = parseFloat(f.igar);
      if(f.igar==='' || !(igar>=0)) return ferr('Isi iuran igar per orang.');
      const items = f.items.map(x=>({id:x.id, nama:String(x.nama||'').trim(), harga:parseFloat(x.harga)})).filter(x=>x.nama || !isNaN(x.harga));
      if(items.some(x=>!x.nama)) return ferr('Setiap perlengkapan perlu nama.');
      if(items.some(x=>!(x.harga>=0))) return ferr('Isi total harga satu rumah untuk setiap perlengkapan.');
      if(new Set(items.map(x=>x.nama.toLowerCase())).size !== items.length) return ferr('Nama perlengkapan tidak boleh sama.');
      el.disabled = true;
      const ok = await doAction(async()=>{
        await updateRow('houses', h.id, tarifPatch(h, {igar, perlengkapan:items}));
        for(const nama of names){
          const ada = h.members.find(m=>m.nama.toLowerCase()===nama.toLowerCase());
          if(ada){ if(ada.status==='keluar') await updateRow('members', ada.id, {status:'aktif', tanggal_keluar:null}); continue; }
          await insertRow('members', {house_id:h.id, nama, status:'aktif', tanggal_gabung:today(), profil:{warna:null, ikut:'semua', tugas:[]}});
        }
        await catatLog(me||names[0], `Pengaturan awal: ${names.length} anggota · igar ${nf.format(igar)} · ${items.length} perlengkapan`, 'houses');
      });
      el.disabled = false;
      if(!ok) return;
      S.sheet = null; S.setup = null;
      if(!getMe()){ S.route = 'siapa'; render(); return toast('Rumah siap. Sekarang pilih namamu.'); }
      render(); toast('Rumah siap dipakai.');
      return;
    }
    case 'sv-anggaran': case 'del-anggaran': {
      if(!h.hasProfil) return ferr('Jalankan supabase-migration.sql dulu untuk memakai anggaran.');
      const n = a==='del-anggaran' ? 0 : parseFloat(val('a-v'));

        await updateRow('houses', h.id, tarifPatch(h, {anggaran:n}));
        await catatLog(me||'—', n? `Atur anggaran bulanan ${nf.format(n)} EGP` : 'Hapus anggaran bulanan', 'houses');
      });
      if(ok){ S.sheet = null; render(); toast(n? 'Anggaran disimpan.' : 'Anggaran dihapus.'); }
      return;
    }

    /* ---- tata tertib ---- */
    case 'q-rule': {
      const teks = val('q-rule'); if(!teks) return ferr('Tulis aturannya.');
      const ok = await doAction(async()=>{ await insertRow('house_rules', {house_id:h.id, deskripsi:teks, aktif:true, urutan:h.rules.length+1}); await catatLog(me||'—', 'Tambah tata tertib', 'house_rules'); });
      if(ok){ render(); toast('Aturan ditambahkan.'); }
      return;
    }
    case 'sv-peraturan': {
      const teks = val('p-teks'); if(!teks) return ferr('Tulis isi aturannya.');
      const ok = await doAction(async()=>{ await updateRow('house_rules', id, {deskripsi:teks, aktif:chk('p-aktif')}); await catatLog(me||'—', 'Ubah tata tertib', 'house_rules'); });
      if(ok){ S.sheet = null; render(); }
      return;
    }
    case 'del-peraturan': {
      const ok = await doAction(async()=>{
        await deleteRow('house_rules', id);
        const sisa = h.rules.filter(x=>x.id!==id).sort((x,y)=>x.urutan-y.urutan);
        for(let i=0;i<sisa.length;i++) if(sisa[i].urutan!==i+1) await updateRow('house_rules', sisa[i].id, {urutan:i+1});
        await catatLog(me||'—', 'Hapus tata tertib', 'house_rules');
      });
      if(ok){ S.sheet = null; render(); }
      return;
    }
    case 'rule-move': {
      const rs = h.rules.slice().sort((x,y)=>x.urutan-y.urutan), i = rs.findIndex(x=>x.id===id);
      if(i<1) return;
      const ok = await doAction(async()=>{ await updateRow('house_rules', rs[i].id, {urutan:rs[i-1].urutan}); await updateRow('house_rules', rs[i-1].id, {urutan:rs[i].urutan}); });
      if(ok) render();
      return;
    }

    /* ---- kategori ---- */
    case 'q-kat': {
      const k = val('q-kat'); if(!k) return ferr('Tulis nama kategori.');
      if(h.setting.kategori.some(x=>x.toLowerCase()===k.toLowerCase())) return ferr('Kategori itu sudah ada.');
      if(k.toLowerCase()===KAT_MASUK.toLowerCase()) return ferr('Nama itu tidak bisa dipakai. Uang masuk dicatat di tab Iuran.');
      const ok = await doAction(()=>updateRow('houses', h.id, {kategori:h.setting.kategori.concat(k)}));
      if(ok){ render(); toast('Kategori '+k+' ditambahkan.'); }
      return;
    }
    case 'kat-hapus': {
      if(h.setting.kategori.length<=1) return toast('Minimal satu kategori.');
      if(!confirm(t(`Hapus kategori ${v}? Catatan lama tetap tersimpan.`))) return;
      const ok = await doAction(()=>updateRow('houses', h.id, {kategori:h.setting.kategori.filter(k=>k!==v)}));
      if(ok) render();
      return;
    }

    /* ---- password ---- */
    case 'sv-pass': {
      if(DEMO) return ferr('Tidak tersedia di rumah contoh.');
      const p0=val('p0'), p1=val('p1'), p2=val('p2');
      if(p1.length<6) return ferr('Password baru minimal 6 karakter.');
      if(p1!==p2) return ferr('Dua password belum sama.');
      try{
        const { error:e1 } = await sb.auth.signInWithPassword({ email:emailFor(h.auth.username), password:p0 });
        if(e1) return ferr('Password lama salah.');
        const { error:e2 } = await sb.auth.updateUser({ password:p1 }); if(e2) throw e2;
        await catatLog(me||'—', 'Ganti password rumah', 'houses');
        closeSheet(); toast('Password diganti. Kabari penghuni lain.');
      }catch(err){ ferr(err.message || 'Gagal mengganti password.'); }
      return;
    }

    /* ---- laporan ---- */
    case 'csv': {
      const p = S.period||thisPeriod();
      const rows = [['Laporan', h.nama, pLabel(p)], [], ['IURAN'], ['Nama','Igar (EGP)','Perlengkapan (EGP)','Iuran (EGP)','Catatan','Dibayar (EGP)','Status']];
      aktifDi(h,p).forEach(m=>{ const c = rincian(h,m); rows.push([m.nama, c.igar, c.perl, c.total, paketLabel(h,m), paidOf(h,m.id,p), STATUS_LABEL[statusOf(h,m,p)]]); });
      rows.push([], ['PENGELUARAN'], ['Tanggal','Kategori','Deskripsi','Nominal (EGP)','Besar','Dicatat oleh']);
      expIn(h,p).slice().reverse().forEach(e=>rows.push([e.tanggal, e.kategori, e.deskripsi, e.nominal, e.besar?'ya':'', e.dicatatOleh]));
      rows.push([], ['Kategori','Total (EGP)']); perKat(expIn(h,p)).forEach(c=>rows.push([c.k, c.v]));
      rows.push([], ['Iuran masuk', masuk(h,p)], ['Total pengeluaran', keluar(h,p)], ['Selisih', r2(masuk(h,p)-keluar(h,p))], ['Sisa saldo kas sekarang', r2(saldo(h))]);
      return unduh(`igarin-${p}.csv`, csvText(rows));
    }
    case 'tutup-buku': {
      const p = S.period||thisPeriod(), [y,m] = p.split('-').map(Number), tutup = !locked(h,p);
      if(tutup && !confirm(t(`Tutup buku ${pLabel(p)}? Catatan bulan itu tidak bisa diubah sampai dibuka lagi.`))) return;
      const ok = await doAction(async()=>{
        if(DEMO){ DEMO.periods = DEMO.periods.filter(x=>!(x.bulan===m&&x.tahun===y)).concat(tutup? [{bulan:m, tahun:y, status:'tertutup'}] : []); }
        else { const { error } = await sb.rpc('set_period_status', {p_bulan:m, p_tahun:y, p_status: tutup?'tertutup':'terbuka'}); if(error) throw error; }
        await catatLog(me||'—', `${tutup?'Tutup':'Buka kembali'} buku ${pLabel(p)}`, 'periods');
      });
      if(ok){ render(); toast(`Buku ${pLabel(p)} ${tutup?'ditutup':'dibuka kembali'}.`); }
      return;
    }

    /* ---- panel pemilik ---- */
    case 'owner-unlock': {
      if(!sb) return ferr('Tidak bisa terhubung ke server.');
      try{
        const pass = val('ownpass'), { data, error } = await sb.rpc('owner_bundle', {p_passcode:pass});
        if(error) throw error; S.owner = data; S.ownerPass = pass; render();
      }catch(err){ ferr('Sandi salah.'); }
      return;
    }
    case 'own-filter': S.filter = v; return render();
    case 'own-batch': {
      try{
        const { data:n, error } = await sb.rpc('owner_generate_codes', {p_passcode:S.ownerPass, p_n:100}); if(error) throw error;
        S.owner = (await sb.rpc('owner_bundle', {p_passcode:S.ownerPass})).data; render(); toast(n+' kode ditambahkan.');
      }catch(err){ toast(err.message); }
      return;
    }
    case 'own-csv': {
      const rows = [['kode','status','rumah','tanggal_terpakai','batch']].concat((S.owner.codes||[]).map(c=>[c.kode, c.status, c.nama_rumah||'', c.tgl_terpakai||'', c.batch]));
      return unduh('igarin-kode.csv', csvText(rows));
    }
    case 'sv-sale': {
      const nama = val('o-nama'), kode = val('o-kode');
      if(!nama) return ferr('Isi nama pembeli.'); if(!kode) return ferr('Tidak ada kode tersedia.');
      try{
        const { error } = await sb.rpc('owner_record_sale', {p_passcode:S.ownerPass, p_nama:nama, p_kontak:val('o-kontak'), p_kode:kode, p_nominal:parseFloat(val('o-nom'))||0});
        if(error) throw error;
        S.owner = (await sb.rpc('owner_bundle', {p_passcode:S.ownerPass})).data; S.sheet = null; render(); toast('Tercatat. Kirim kode '+kode+' ke pembeli.');
      }catch(err){ ferr(err.message); }
      return;
    }
  }
});

/* hapus data rumah, akun login & riwayat input tetap */
async function factoryReset(h){
  const me = getMe()||'—';
  if(DEMO){
    Object.assign(DEMO.house, {kategori:KAT_DEFAULT.slice(), tarif:{}, saldo_awal:0, popup_freq:'harian'});
    Object.assign(DEMO, {members:[], expenses:[], payments:[], iuran_types:[], house_rules:[], periods:[], task_done:[]});
  } else {
    if(EXTRA.doneOk) await sb.from('task_done').delete().eq('house_id', h.id);
    EXTRA.done = [];
    for(const t of ['payments','expenses','iuran_types','house_rules','members']){
      const { error } = await sb.from(t).delete().eq('house_id', h.id);
      if(error) throw new Error(t+': '+error.message);
    }
    const patch = {kategori:KAT_DEFAULT.slice(), saldo_awal:0, popup_freq:'harian'};
    if(h.hasProfil) patch.tarif = {};
    await updateRow('houses', h.id, patch);
    for(const p of h.closed){ const [y,m] = p.split('-').map(Number); await sb.rpc('set_period_status', {p_bulan:m, p_tahun:y, p_status:'terbuka'}); }
  }
  await catatLog(me, 'Reset data rumah ke pengaturan awal', 'houses');
  await reloadHouse();
}

document.addEventListener('keydown', ev=>{
  const t = ev.target, typing = t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA' || t.tagName==='SELECT');
  if(ev.key==='Escape'){ if(S.sheet || S.rulesPopup || S.levelUp) closeSheet(); return; }
  /* obrolan: Enter kirim, Shift+Enter baris baru */
  if(t && t.id==='chat-in' && ev.key==='Enter' && !ev.shiftKey && !ev.isComposing){ ev.preventDefault(); const b = document.querySelector('[data-a="chat-send"]'); if(b) b.click(); return; }
  if(S.rulesPopup && !typing && (ev.key==='ArrowRight' || ev.key==='ArrowLeft')){ ev.preventDefault(); return slideTo(S.slide + (ev.key==='ArrowRight'?1:-1)); }
  if(t && t.classList && t.classList.contains('flip') && (ev.key==='Enter' || ev.key===' ')){ ev.preventDefault(); t.click(); return; }
  if(S.sheet && S.sheet.name==='catat' && !typing && !ev.ctrlKey && !ev.metaKey){
    if(/^[0-9]$/.test(ev.key)){ ev.preventDefault(); return keyIn(ev.key); }
    if(ev.key==='.' || ev.key===','){ ev.preventDefault(); return keyIn('.'); }
    if(ev.key==='Backspace'){ ev.preventDefault(); return keyIn('del'); }
    if(ev.key==='Enter' && !(t && t.closest && t.closest('button'))){ ev.preventDefault(); const b = document.querySelector('#layer [data-a="f-simpan"]'); if(b) b.click(); return; }
  }
  if(ev.key!=='Enter' || !t || !t.id) return;
  if(t.id==='q-cari'){ ev.preventDefault(); t.blur(); return; }
  if(t.id==='pass' && S.route==='aktivasi') return;
  const map = {'q-anggota':'q-anggota','q-rule':'q-rule','q-kat':'q-kat','aku-baru':'aku-simpan','pass':'masuk','f-note':'f-simpan','ownpass':'owner-unlock','m-task-new':'mf-task-add','rs-word':'rs-go'};
  const aksi = map[t.id]; if(!aksi) return;
  ev.preventDefault();
  const btn = document.querySelector(`#layer [data-a="${aksi}"]`) || document.querySelector(`[data-a="${aksi}"]`); if(btn) btn.click();
});

  const sh = ev.target.closest && ev.target.closest('#layer .sheet');
  if(!sh || sh.classList.contains('setup') || ev.button > 0) return;
  if(!ev.target.closest('.grab, .sh-hd') || ev.target.closest('button, input, select, textarea, a')) return;
  tarik = {sh, scrim:sh.parentElement, y0:ev.clientY, dy:0, t0:performance.now(), last:ev.clientY, tl:performance.now(), v:0};
}, {passive:true});
document.addEventListener('pointermove', ev=>{
  if(!tarik) return;
  const now = performance.now(), raw = ev.clientY - tarik.y0;
  tarik.v = (ev.clientY - tarik.last) / Math.max(1, now - tarik.tl); tarik.last = ev.clientY; tarik.tl = now;
  tarik.dy = raw > 0 ? raw : raw / 6;   // ke atas terasa seperti karet
  if(Math.abs(raw) < 3) return;
  tarik.sh.style.animation = 'none'; tarik.sh.style.transition = 'none';
  tarik.sh.style.transform = `translateY(${tarik.dy.toFixed(1)}px)`;
  if(tarik.scrim) tarik.scrim.style.opacity = String(Math.max(.35, 1 - Math.max(0, tarik.dy) / 600));
}, {passive:true});
['pointerup','pointercancel'].forEach(type=>document.addEventListener(type, ()=>{
  if(!tarik) return;
  const {sh, scrim, dy, v} = tarik; tarik = null;
  if(Math.abs(dy) < 3) return;
  if(dy > 120 || (v > .5 && dy > 24)){
    sh.style.transition = 'transform 200ms var(--ease-out)'; sh.style.transform = 'translateY(100%)';
    closeSheet();
    if(S.sheet){ sh.style.transform = ''; }   // lembar wajib: tidak bisa ditutup, kembalikan
  } else {
    sh.style.transition = 'transform 260ms var(--ease-drawer)'; sh.style.transform = '';
    if(scrim){ scrim.style.transition = 'opacity 200ms ease'; scrim.style.opacity = ''; }
  }
}));

  if(sb){

  }
