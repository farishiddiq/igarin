<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Igarin — Buku Kas Rumah Sewa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EAF1EE;
  --card:#FFFFFF;
  --nil:#0E4A46;
  --nil-2:#17605A;
  --nil-ink:#D9EDE7;
  --ink:#102E2A;
  --ink-2:#56736D;
  --line:#D6E3DE;
  --saffron:#E09B13;
  --saffron-soft:#FBEFD3;
  --lunas:#1C8A57;
  --lunas-soft:#E0F2E7;
  --sebagian:#B47708;
  --belum:#BE3F37;
  --belum-soft:#FBE6E3;
  --r-card:16px;
  --r-input:11px;
  --shadow:0 1px 2px rgba(16,46,42,.06), 0 8px 24px -16px rgba(16,46,42,.28);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--paper); color:var(--ink);
  font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
h1,h2,h3,.display{font-family:"Bricolage Grotesque","Plus Jakarta Sans",sans-serif;font-weight:700;letter-spacing:-.02em;margin:0}
h1{font-size:1.6rem;line-height:1.15}
h2{font-size:1.15rem}
h3{font-size:1rem}
p{margin:0 0 .6em}
a{color:var(--nil)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

/* ---------- layout ---------- */
#app{min-height:100dvh}
.shell{max-width:920px;margin:0 auto;padding:0 16px 112px}
.shell.narrow{max-width:520px}
.topbar{
  position:sticky;top:0;z-index:30;background:var(--paper);
  padding:14px 16px 10px;max-width:920px;margin:0 auto;
  display:flex;align-items:center;gap:12px;
}
.topbar .house{min-width:0}
.topbar .house b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .house span{font-size:.78rem;color:var(--ink-2)}
.topbar .sp{flex:1}
.grid{display:grid;gap:12px}
@media (min-width:720px){ .grid.two{grid-template-columns:1fr 1fr} }
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.sp{flex:1}
.mt{margin-top:14px}
.mt-s{margin-top:8px}
.center{text-align:center}
.muted{color:var(--ink-2);font-size:.85rem}
.tiny{font-size:.75rem;color:var(--ink-2)}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:16px}
.card.tight{padding:12px}
.card h2,.card h3{margin-bottom:4px}
.sec-head{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.sec-head h2{flex:1}
.hair{height:1px;background:var(--line);margin:14px -16px}

/* ---------- hero saldo ---------- */
.hero{
  background:
    radial-gradient(120% 100% at 92% 0%, rgba(224,155,19,.28), transparent 58%),
    linear-gradient(168deg,var(--nil-2),var(--nil) 72%);
  color:#fff;border-radius:20px;padding:18px 18px 14px;position:relative;overflow:hidden;
}
.hero .lbl{font-size:.8rem;color:var(--nil-ink);display:flex;align-items:center;gap:6px}
.hero .amount{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:2.5rem;line-height:1.05;margin:2px 0 0}
.hero .amount small{font-size:.9rem;font-weight:600;opacity:.75;margin-left:6px;font-family:"Plus Jakarta Sans",sans-serif}
.hero .spark{position:absolute;right:0;bottom:0;width:52%;opacity:.5}
.hero .split{display:flex;gap:8px;margin-top:14px;position:relative;z-index:2}
.hero .split div{flex:1;background:rgba(255,255,255,.12);border-radius:12px;padding:8px 10px}
.hero .split b{display:block;font-size:1rem;font-family:"Bricolage Grotesque",sans-serif}
.hero .split span{font-size:.72rem;color:var(--nil-ink)}

/* ---------- dots iuran ---------- */
.dots{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.dot{width:100%;max-width:26px;height:8px;border-radius:99px;background:var(--belum)}
.dot.ok{background:var(--lunas)}
.dot.part{background:var(--sebagian)}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--nil);
  background:var(--nil);color:#fff;font-weight:600;font-size:.95rem;cursor:pointer;
  transition:transform .12s ease, background .12s ease;
}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--nil)}
.btn.soft{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.warn{background:var(--belum);border-color:var(--belum)}
.btn.gold{background:var(--saffron);border-color:var(--saffron);color:#3A2A02}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:0 12px;font-size:.85rem;border-radius:10px}
.btn.icon{min-width:38px;padding:0 10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;min-height:40px;display:inline-flex;align-items:center;gap:7px;
  padding:0 14px;border-radius:99px;border:1px solid var(--line);background:#fff;
  font-size:.85rem;font-weight:600;color:var(--ink);cursor:pointer;
}
.chip.on{background:var(--nil);color:#fff;border-color:var(--nil)}
.chip svg,.hero .lbl svg{width:18px;height:18px;flex:0 0 auto;stroke-width:1.8}

/* ---------- forms ---------- */
label.f{display:block;margin-bottom:12px}
label.f > span{display:block;font-size:.82rem;font-weight:600;margin-bottom:5px}
label.f .hint{font-weight:400;color:var(--ink-2)}
input,select,textarea{
  width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);
  border-radius:var(--r-input);background:#fff;font-family:inherit;font-size:1rem;color:var(--ink);
}
textarea{min-height:80px;resize:vertical}
input[type=checkbox]{width:22px;min-height:22px;height:22px;accent-color:var(--nil)}
.check{display:flex;align-items:center;gap:10px;font-size:.9rem;min-height:44px}
.err{color:var(--belum);font-size:.82rem;margin-top:-6px;margin-bottom:10px}
fieldset{border:1px solid var(--line);border-radius:var(--r-card);padding:12px;margin:0 0 12px}
legend{font-size:.78rem;font-weight:700;padding:0 6px;color:var(--ink-2)}

/* ---------- list rows ---------- */
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .body{flex:1;min-width:0}
.item .body b{display:block;font-size:.95rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .body span{font-size:.78rem;color:var(--ink-2)}
.item .val{font-weight:700;font-size:.95rem;white-space:nowrap}
.val.in{color:var(--lunas)}
.val.out{color:var(--belum)}
.avatar{
  width:38px;height:38px;border-radius:11px;background:var(--nil-ink);color:var(--nil);
  display:grid;place-items:center;font-weight:700;font-size:.9rem;flex:0 0 auto;
}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:.7rem;font-weight:700;border:1px solid transparent}
.badge.ok{background:var(--lunas-soft);color:var(--lunas)}
.badge.no{background:var(--belum-soft);color:var(--belum)}
.badge.part{background:var(--saffron-soft);color:var(--sebagian)}
.badge.neutral{background:var(--paper);color:var(--ink-2);border-color:var(--line)}
.badge.big{background:var(--saffron-soft);color:var(--sebagian)}

/* ---------- board ---------- */
.board{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:560px){.board{grid-template-columns:1fr 1fr}}
.pay{
  display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;
  border:1px solid var(--line);background:#fff;text-align:left;width:100%;cursor:pointer;min-height:60px;
}
.pay .bar{width:5px;align-self:stretch;border-radius:99px;background:var(--belum)}
.pay.ok .bar{background:var(--lunas)}
.pay.part .bar{background:var(--sebagian)}
.pay .body{flex:1;min-width:0}
.pay .body b{display:block;font-size:.92rem}
.pay .body span{font-size:.75rem;color:var(--ink-2)}

/* ---------- table ---------- */
.tw{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;color:var(--ink-2);font-weight:700}
td.n,th.n{text-align:right}
tr.total td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}

/* ---------- bottom nav ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(255,255,255,.94);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
}
.nav-in{max-width:920px;margin:0 auto;display:flex}
.nav button{
  flex:1;background:none;border:0;padding:6px 2px;cursor:pointer;color:var(--ink-2);
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.68rem;font-weight:600;
  min-height:52px;border-radius:10px;
}
.nav button.on{color:var(--nil)}
.nav button.on svg{stroke:var(--nil)}
.nav svg{width:22px;height:22px;stroke:var(--ink-2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- fab ---------- */
.fab{
  position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:41;
  min-height:52px;padding:0 18px;border-radius:99px;border:0;background:var(--saffron);color:#3A2A02;
  font-weight:700;box-shadow:0 10px 24px -10px rgba(224,155,19,.9);cursor:pointer;
}
@media(min-width:920px){.fab{right:calc(50vw - 444px)}}

/* ---------- sheet / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(16,46,42,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:600px){.scrim{align-items:center}}
.sheet{
  background:var(--paper);width:100%;max-width:520px;max-height:92dvh;overflow:auto;
  border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));
}
@media(min-width:600px){.sheet{border-radius:20px;max-height:88dvh}}
.sheet-head{position:sticky;top:0;background:var(--paper);padding:8px 0 12px;display:flex;align-items:center;gap:10px;z-index:2}
.sheet-head h2{flex:1}
.x{background:none;border:0;font-size:1.4rem;line-height:1;color:var(--ink-2);cursor:pointer;min-width:44px;min-height:44px}
.grab{width:42px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 0}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom));
  background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;z-index:80;font-size:.88rem;
  max-width:88vw;box-shadow:var(--shadow)
}

/* ---------- landing ---------- */
.land{max-width:520px;margin:0 auto;padding:26px 18px 60px}
.brand{display:flex;align-items:center;gap:10px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.2rem}
.mark{width:34px;height:34px;border-radius:10px;background:var(--nil);color:#fff;display:grid;place-items:center;font-size:1rem}
.land h1{font-size:2.1rem;margin:24px 0 10px}
.land .lede{font-size:1.02rem;color:var(--ink-2);margin-bottom:20px}
.price{display:flex;align-items:baseline;gap:8px;margin:6px 0 2px}
.price b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.9rem}
.feat{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.feat:last-child{border-bottom:0}
.feat svg{width:18px;height:18px;flex:0 0 auto;margin-top:3px;stroke:var(--nil);fill:none;stroke-width:2}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;position:relative;padding-left:34px;margin-bottom:12px;font-size:.9rem}
.steps li::before{
  content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:8px;
  background:var(--nil-ink);color:var(--nil);display:grid;place-items:center;font-size:.75rem;font-weight:700
}

/* ---------- code input ---------- */
.code{font-size:1.5rem;letter-spacing:.28em;text-align:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:700}

/* ---------- charts ---------- */
.legend{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.legend div{display:flex;align-items:center;gap:8px;font-size:.8rem}
.legend i{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.legend .v{margin-left:auto;font-weight:700}
.empty{padding:22px 10px;text-align:center;color:var(--ink-2);font-size:.88rem;border:1px dashed var(--line);border-radius:12px}

/* ---------- rules ---------- */
.rule{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.rule:last-child{border-bottom:0}
.rule .no{width:22px;height:22px;border-radius:7px;background:var(--saffron-soft);color:var(--sebagian);display:grid;place-items:center;font-size:.72rem;font-weight:700;flex:0 0 auto}
.scrollbox{max-height:168px;overflow:auto}

@media print{
  .nav,.fab,.topbar,.noprint{display:none !important}
  body{background:#fff}
  .shell{padding:0;max-width:none}
  .card{border:0;padding:0}
  .tw{margin:0;padding:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>

<body>
<div id="app"></div>
<div id="layer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* =====================================================================
   IGARIN — buku kas rumah sewa mahasiswa
   Data disimpan sungguhan di Supabase (Postgres + Auth + Realtime).
   Lihat igarin-supabase.sql dan igarin-supabase-part2.sql untuk skemanya.
   ===================================================================== */
const SUPABASE_URL = 'https://mlowsqxwvpejpxewdwrh.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_221A2i1lT8Gxkt49RIhoRQ_3RsyZ_QS';
const EMAIL_DOMAIN = 'igarin.local';   // login rumah pakai username, bukan email asli
const HARGA_IDR = 149000;
const RANGE = [1200, 3500];
const KAT_DEFAULT = ['Dapur','Listrik','Air','Gas','Internet','Kebersihan','Sewa','Lain-lain'];
const IURAN_DEFAULT = [
  {nama:'Sewa (ijar)', nominal:750}, {nama:'Listrik (kahraba)', nominal:150}, {nama:'Air', nominal:50},
  {nama:'Gas', nominal:45}, {nama:'Dapur', nominal:500}, {nama:'Internet', nominal:70},
];

// Sesi login disimpan di localStorage supaya penghuni tetap masuk saat app
// dibuka lagi. Sebagian lingkungan (preview di dalam Claude, mode privasi
// ketat, iframe terkunci) memblokir localStorage — di situ otomatis mundur
// ke penyimpanan memori: app tetap jalan, hanya perlu login ulang tiap buka.
const sessionStore = (()=>{
  try{
    const probe = '__igarin_test__';
    window.localStorage.setItem(probe, '1');
    window.localStorage.removeItem(probe);
    return window.localStorage;
  }catch(e){
    const m = {};
    return { getItem:k=> (k in m? m[k] : null), setItem:(k,v)=>{m[k]=v;}, removeItem:k=>{delete m[k];} };
  }
})();
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession:true, autoRefreshToken:true, storage: sessionStore }
});
const emailFor = u => `${String(u).trim().toLowerCase()}@${EMAIL_DOMAIN}`;

let DB = { houses:{}, session:{} };   // cache lokal hasil dari Supabase, bentuknya tetap sama seperti sebelumnya
let S  = { route:'landing', tab:'beranda', period:null, filter:'semua', pending:{} };
let realtimeChannel = null;
let stokTersedia = null;   // diisi async saat boot, dipakai vLanding()

/* ---------- helper Supabase ---------- */
async function insertRow(table, row){ const {error} = await sb.from(table).insert(row); if(error) throw error; }
async function updateRow(table, id, patch){ const {error} = await sb.from(table).update(patch).eq('id', id); if(error) throw error; }
async function deleteRow(table, id){ const {error} = await sb.from(table).delete().eq('id', id); if(error) throw error; }
async function catatLog(nama, aksi, tabel){
  const h = house(); if(!h) return;
  try{ await insertRow('activity_log', {house_id:h.id, member_nama:nama||'—', aksi, tabel_terkait:tabel}); }
  catch(e){ /* jejak aktivitas tidak fatal kalau gagal */ }
}
// Bungkus tiap aksi simpan: jalankan panggilan Supabase, lalu muat ulang cache dari server.
// Kalau gagal (mis. jaringan putus, RLS menolak), tampilkan pesan tanpa mengubah tampilan.
async function doAction(fn){
  try{ await fn(); await reloadHouse(); return true; }
  catch(e){ ferr(e && e.message ? e.message : 'Gagal menyimpan, coba lagi.'); return false; }
}

/* ---------- ambil & petakan data rumah dari Supabase ---------- */
function normalize(bundle, username){
  const hh = bundle.house;
  return {
    id: hh.id, nama: hh.nama_rumah, kontak: hh.kontak||'', kodeAktivasi: hh.kode_aktivasi,
    tanggalAktivasi: hh.tanggal_aktivasi, status: hh.status,
    auth: { username },
    setting: {
      waktuPenagihan: hh.waktu_penagihan, popupFreq: hh.popup_freq, saldoAwal: +hh.saldo_awal||0,
      kategori: hh.kategori || KAT_DEFAULT.slice(),
      iuranTypes: (bundle.iuran_types||[]).map(x=>({id:x.id, nama:x.nama_iuran, nominal:+x.nominal_default}))
    },
    members: (bundle.members||[]).map(m=>({id:m.id, nama:m.nama, kamar:m.no_kamar, status:m.status, tglGabung:m.tanggal_gabung, tglKeluar:m.tanggal_keluar})),
    payments: (bundle.payments||[]).map(p=>({id:p.id, memberId:p.member_id, period:p.periode, nominal:+p.nominal, status:p.status_bayar, tanggal:p.tanggal_bayar, dicatatOleh:p.dicatat_oleh})),
    expenses: (bundle.expenses||[]).map(e=>({id:e.id, tanggal:e.tanggal, kategori:e.kategori, deskripsi:e.deskripsi, nominal:+e.nominal, besar:e.is_besar, dicatatOleh:e.dicatat_oleh, bukti:e.bukti_foto_url||''})),
    planned: (bundle.planned_expenses||[]).map(x=>({id:x.id, tanggalRencana:x.tanggal_rencana, deskripsi:x.deskripsi, estimasi:+x.estimasi_nominal, status:x.status})),
    rules: (bundle.house_rules||[]).map(r=>({id:r.id, teks:r.deskripsi, urutan:r.urutan, aktif:r.aktif})),
    log: (bundle.activity_log||[]).map(l=>({id:l.id, nama:l.member_nama, aksi:l.aksi, tabel:l.tabel_terkait, ts:l.created_at})),
    closed: (bundle.periods||[]).filter(p=>p.status==='tertutup').map(p=>`${p.tahun}-${String(p.bulan).padStart(2,'0')}`)
  };
}
async function reloadHouse(){
  const { data: bundle, error } = await sb.rpc('get_house_bundle');
  if(error || !bundle) throw error || new Error('Rumah tidak ditemukan.');
  const { data:{ user } } = await sb.auth.getUser();
  const username = user ? user.email.split('@')[0] : '';
  const h = normalize(bundle, username);
  DB.houses = { [h.id]: h };
  DB.session.houseId = h.id;
  subscribeRealtime(h.id);
}
function subscribeRealtime(houseId){
  if(realtimeChannel){ sb.removeChannel(realtimeChannel); realtimeChannel = null; }
  let t = null;
  const kick = () => { clearTimeout(t); t = setTimeout(async()=>{ try{ await reloadHouse(); render(); }catch(e){} }, 500); };
  const ch = sb.channel('house-'+houseId);
  ['payments','expenses','members','house_rules','planned_expenses','iuran_types','periods'].forEach(tbl=>{
    ch.on('postgres_changes', {event:'*', schema:'public', table:tbl, filter:`house_id=eq.${houseId}`}, kick);
  });
  ch.on('postgres_changes', {event:'*', schema:'public', table:'houses', filter:`id=eq.${houseId}`}, kick);
  ch.subscribe();
  realtimeChannel = ch;
}
function stopRealtime(){ if(realtimeChannel){ sb.removeChannel(realtimeChannel); realtimeChannel=null; } }

/* ---------- util ---------- */
const uid = () => Math.random().toString(36).slice(2,10);
const today = () => new Date().toISOString().slice(0,10);
const thisPeriod = () => new Date().toISOString().slice(0,7);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat('id-ID', {maximumFractionDigits:0});
const egp = n => nf.format(Math.round(n||0)) + ' EGP';
const idr = n => 'Rp' + nf.format(Math.round(n||0));
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function pLabel(p){ if(!p) return '—'; const [y,m]=p.split('-'); return BULAN[+m-1] + ' ' + y; }
function pShort(p){ const [y,m]=p.split('-'); return BULAN[+m-1].slice(0,3) + ' ' + y.slice(2); }
function pShift(p, d){ const [y,m]=p.split('-').map(Number); const dt=new Date(y, m-1+d, 1); return dt.toISOString().slice(0,7); }
function dLabel(d){ if(!d) return '—'; const [y,m,dd]=d.split('-'); return `${+dd} ${BULAN[+m-1].slice(0,3)} ${y}`; }
function initials(n){ return String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function house(){ return DB.houses[DB.session.houseId] || null; }
function toast(msg){
  const old = document.querySelector('.toast'); if(old) old.remove();
  const t = document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 3000);
}

/* ---------- perhitungan ---------- */
function aktif(h){ return h.members.filter(m=>m.status==='aktif'||m.status==='cuti'); }
function tagihan(h){ return (h.setting.iuranTypes||[]).reduce((a,b)=>a+(+b.nominal||0),0); }
function paidOf(h, memberId, period){
  return h.payments.filter(p=>p.memberId===memberId && p.period===period).reduce((a,b)=>a+(+b.nominal||0),0);
}
function statusOf(h, memberId, period){
  const p = paidOf(h, memberId, period), t = tagihan(h);
  if(p<=0) return 'belum';
  if(t>0 && p < t) return 'sebagian';
  return 'lunas';
}
function masuk(h, period){ return h.payments.filter(p=>!period||p.period===period).reduce((a,b)=>a+(+b.nominal||0),0); }
function keluar(h, period){ return h.expenses.filter(e=>!period||e.tanggal.slice(0,7)===period).reduce((a,b)=>a+(+b.nominal||0),0); }
function saldo(h){ return (+h.setting.saldoAwal||0) + masuk(h) - keluar(h); }
function saldoHingga(h, period){
  const mIn = h.payments.filter(p=>p.period<=period).reduce((a,b)=>a+(+b.nominal||0),0);
  const mOut = h.expenses.filter(e=>e.tanggal.slice(0,7)<=period).reduce((a,b)=>a+(+b.nominal||0),0);
  return (+h.setting.saldoAwal||0) + mIn - mOut;
}
function lastPeriods(n){
  const out=[]; let p=thisPeriod();
  for(let i=0;i<n;i++){ out.unshift(p); p=pShift(p,-1); }
  return out;
}
function locked(h, period){ return (h.closed||[]).includes(period); }

/* ---------- grafik (SVG tangan sendiri) ---------- */
const PIE_COLORS = ['#0E4A46','#E09B13','#1C8A57','#8A5FBF','#C2443B','#2C7DA0','#B47708','#56736D','#4E9A6B','#9A4E78'];
function donut(data){
  const total = data.reduce((a,b)=>a+b.v, 0);
  if(!total) return `<div class="empty">Belum ada pengeluaran pada periode ini.</div>`;
  const R=54, C=2*Math.PI*R; let off=0;
  const arcs = data.map((d,i)=>{
    const len = C*(d.v/total);
    const s = `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${PIE_COLORS[i%10]}" stroke-width="22"
      stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"
      transform="rotate(-90 70 70)"><title>${esc(d.k)}: ${egp(d.v)}</title></circle>`;
    off += len; return s;
  }).join('');
  const legend = data.map((d,i)=>`<div><i style="background:${PIE_COLORS[i%10]}"></i>${esc(d.k)}
    <span class="v">${Math.round(d.v/total*100)}% · ${egp(d.v)}</span></div>`).join('');
  return `<div class="row" style="align-items:center;gap:14px;flex-wrap:wrap">
    <svg viewBox="0 0 140 140" style="width:140px;height:140px;flex:0 0 auto" role="img" aria-label="Proporsi pengeluaran per kategori">
      ${arcs}
      <text x="70" y="66" text-anchor="middle" font-size="9" fill="#56736D" font-family="Plus Jakarta Sans">Total</text>
      <text x="70" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#102E2A" font-family="Bricolage Grotesque">${nf.format(total)}</text>
    </svg>
    <div class="legend sp" style="min-width:190px">${legend}</div></div>`;
}
function bars(rows){
  const max = Math.max(1, ...rows.map(r=>Math.max(r.in, r.out)));
  const W=320, H=150, pad=22, gw=(W-pad)/rows.length;
  const body = rows.map((r,i)=>{
    const x = pad + i*gw, bw=(gw-12)/2;
    const hi = (H-34)*(r.in/max), ho=(H-34)*(r.out/max);
    return `<rect x="${x+2}" y="${H-24-hi}" width="${bw}" height="${Math.max(hi,1)}" rx="3" fill="#1C8A57"><title>Masuk ${pShort(r.p)}: ${egp(r.in)}</title></rect>
      <rect x="${x+bw+6}" y="${H-24-ho}" width="${bw}" height="${Math.max(ho,1)}" rx="3" fill="#C2443B"><title>Keluar ${pShort(r.p)}: ${egp(r.out)}</title></rect>
      <text x="${x+gw/2-3}" y="${H-8}" font-size="9" text-anchor="middle" fill="#56736D">${pShort(r.p).split(' ')[0]}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Pemasukan dan pengeluaran 6 bulan terakhir" font-family="Plus Jakarta Sans">
    <line x1="${pad}" y1="${H-24}" x2="${W}" y2="${H-24}" stroke="#D6E3DE"/>
    <text x="0" y="14" font-size="9" fill="#56736D">${nf.format(max)}</text>${body}</svg>
    <div class="legend"><div><i style="background:#1C8A57"></i>Iuran masuk</div><div><i style="background:#C2443B"></i>Pengeluaran</div></div>`;
}
function line(rows){
  const vals = rows.map(r=>r.v), max=Math.max(...vals,1), min=Math.min(...vals,0);
  const W=320,H=120,pad=8;
  const x = i => pad + i*((W-pad*2)/Math.max(1,rows.length-1));
  const y = v => 14 + (H-34) * (1 - (v-min)/Math.max(1,(max-min)));
  const pts = rows.map((r,i)=>`${x(i).toFixed(1)},${y(r.v).toFixed(1)}`).join(' ');
  const dots = rows.map((r,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(r.v).toFixed(1)}" r="3" fill="#0E4A46"><title>${pShort(r.p)}: ${egp(r.v)}</title></circle>`).join('');
  const labels = rows.map((r,i)=>`<text x="${x(i).toFixed(1)}" y="${H-4}" font-size="9" text-anchor="middle" fill="#56736D">${pShort(r.p).split(' ')[0]}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Tren saldo kas" font-family="Plus Jakarta Sans">
    <polygon points="${pts} ${x(rows.length-1).toFixed(1)},${H-20} ${pad},${H-20}" fill="rgba(14,74,70,.10)"/>
    <polyline points="${pts}" fill="none" stroke="#0E4A46" stroke-width="2.2" stroke-linejoin="round"/>${dots}${labels}</svg>`;
}
function sparkline(rows){
  const vals = rows.map(r=>r.v), max=Math.max(...vals,1), min=Math.min(...vals,0);
  const pts = rows.map((r,i)=>`${i*(100/Math.max(1,rows.length-1))},${(40-36*((r.v-min)/Math.max(1,max-min))).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 100 44" preserveAspectRatio="none" aria-hidden="true">
    <polygon points="${pts} 100,44 0,44" fill="rgba(255,255,255,.16)"/>
    <polyline points="${pts}" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="1.6"/></svg>`;
}

      <p class="tiny mt-s">Tagihan per orang bulan ini ${egp(t)}. ${ms.length-lunas} orang belum lunas.</p>
      <button class="btn soft sm mt-s" data-a="tab" data-v="iuran">Buka papan status</button>
    </div>

    <div class="row wrap mt">
      <button class="chip" data-a="page" data-v="anggota">${ic('users')} Anggota</button>
      <button class="chip" data-a="page" data-v="simulasi">${ic('calc')} Simulasi iuran</button>
      <button class="chip" data-a="page" data-v="log">${ic('clock')} Riwayat input</button>
    </div>

    <div class="sec-head"><h2>Pengeluaran ${pShort(p)}</h2><span class="muted">${egp(keluar(h,p))}</span></div>
    <div class="card">${donut(donutData)}</div>

    <div class="grid two mt">
      <div class="card"><h3>Masuk vs keluar</h3><p class="tiny">Enam bulan terakhir</p>${bars(barRows)}</div>
      <div class="card"><h3>Tren saldo kas</h3><p class="tiny">Posisi akhir tiap bulan</p>${line(trend)}</div>
    </div>

    <div class="sec-head"><h2>Catatan terakhir</h2></div>
    <div class="card"><div class="list">${recent.map(r=>`<div class="item">
        <div class="body"><b>${esc(r.l)}</b><span>${dLabel(r.d)} · dicatat ${esc(r.by||'—')}</span></div>
        ${r.besar?'<span class="badge big">besar</span>':''}
        <div class="val ${r.t}">${r.t==='in'?'+':'−'}${nf.format(r.n)}</div></div>`).join('') || '<div class="empty">Belum ada transaksi. Mulai dari tombol Catat.</div>'}</div></div>

    ${plan.length?`<div class="sec-head"><h2>Rencana pengeluaran</h2></div>
    <div class="card"><div class="list">${plan.map(x=>`<div class="item">
      <div class="body"><b>${esc(x.deskripsi)}</b><span>rencana ${dLabel(x.tanggalRencana)}</span></div>
      <div class="val">${nf.format(x.estimasi)}</div></div>`).join('')}</div>
      <button class="btn soft sm mt-s" data-a="tab" data-v="pengeluaran">Lihat semua rencana</button></div>`:''}

    <div class="sec-head"><h2>Peraturan rumah</h2><button class="btn ghost sm" data-a="page" data-v="peraturan">Ubah</button></div>
    <div class="card"><div class="scrollbox">${rules.length? rules.map((r,i)=>`<div class="rule"><span class="no">${i+1}</span><div>${esc(r.teks)}</div></div>`).join('')
      : '<div class="empty">Belum ada peraturan. Isi dari Setting supaya muncul sebagai pengingat saat app dibuka.</div>'}</div></div>

    <button class="fab" data-a="sheet" data-v="pilih-catat">+ Catat</button>`;
}

/* ---------- iuran ---------- */
function vIuran(){
  const h = house(), p = S.period || thisPeriod(), t = tagihan(h), ms = aktif(h);
  const lock = locked(h,p);
  const cards = ms.map(m=>{
    const st = statusOf(h,m.id,p), paid = paidOf(h,m.id,p);
    const last = h.payments.filter(x=>x.memberId===m.id&&x.period===p).sort((a,b)=>(b.tanggal||'').localeCompare(a.tanggal||''))[0];
    return `<button class="pay ${st==='lunas'?'ok':st==='sebagian'?'part':''}" data-a="sheet" data-v="bayar" data-id="${m.id}">
      <span class="bar"></span>
      <span class="body"><b>${esc(m.nama)}${m.status==='cuti'?' · cuti':''}</b>
        <span>${st==='belum'? 'Belum bayar' : (st==='sebagian'? `Sebagian ${nf.format(paid)}/${nf.format(t)}` : `Lunas ${nf.format(paid)}`)}${last&&last.tanggal?` · ${dLabel(last.tanggal)}`:''}</span></span>
      <span class="badge ${st==='lunas'?'ok':st==='sebagian'?'part':'no'}">${st==='lunas'?'lunas':st==='sebagian'?'sebagian':'belum'}</span>
    </button>`;
  }).join('');
  const sum = masuk(h,p), target = t*ms.length;
  return `<div class="sec-head"><h2>Papan status iuran</h2></div>
    ${periodNav(p)}
    <div class="card mt-s">
      <div class="row"><div class="sp"><div class="tiny">Terkumpul ${pLabel(p)}</div>
        <div class="display" style="font-size:1.5rem">${egp(sum)}</div>
        <div class="tiny">dari target ${egp(target)} · ${target?Math.round(sum/target*100):0}%</div></div>
        ${lock?'<span class="badge neutral">buku ditutup</span>':''}</div>
    </div>
    <div class="board mt">${cards || '<div class="empty">Belum ada anggota aktif. Tambah dulu dari Beranda → Anggota.</div>'}</div>
    <p class="tiny mt">Papan ini murni informasi bersama. Igarin tidak mengirim peringatan atau tagihan otomatis ke siapa pun.</p>
    <div class="sec-head"><h2>Jenis iuran</h2><button class="btn ghost sm" data-a="page" data-v="jenis-iuran">Atur</button></div>
    <div class="card"><div class="list">${(h.setting.iuranTypes||[]).map(x=>`<div class="item">
        <div class="body"><b>${esc(x.nama)}</b></div><div class="val">${nf.format(x.nominal)}</div></div>`).join('')}
      <div class="item total" style="border-top:2px solid var(--ink)"><div class="body"><b>Total per orang</b></div><div class="val">${nf.format(t)}</div></div></div></div>`;
}
function periodNav(p){
  return `<div class="row">
    <button class="btn soft icon sm" data-a="per" data-v="-1" aria-label="Bulan sebelumnya">←</button>
    <div class="sp center"><b>${pLabel(p)}</b></div>
    <button class="btn soft icon sm" data-a="per" data-v="1" aria-label="Bulan berikutnya" ${p>=thisPeriod()?'disabled':''}>→</button>
  </div>`;
}

/* ---------- pengeluaran ---------- */
function vPengeluaran(){
  const h = house(), p = S.period || thisPeriod();
  const lock = locked(h,p);
  const list = h.expenses.filter(e=>e.tanggal.slice(0,7)===p).sort((a,b)=>b.tanggal.localeCompare(a.tanggal));
  const besar = list.filter(e=>e.besar);
  const plan = (h.planned||[]).sort((a,b)=>a.tanggalRencana.localeCompare(b.tanggalRencana));
  return `<div class="sec-head"><h2>Pengeluaran</h2></div>
    ${periodNav(p)}
    <div class="grid two mt-s">
      <div class="card tight"><div class="tiny">Total ${pShort(p)}</div><div class="display" style="font-size:1.4rem">${egp(keluar(h,p))}</div>
        <div class="tiny">${list.length} catatan</div></div>
      <div class="card tight"><div class="tiny">Termasuk belanja besar</div><div class="display" style="font-size:1.4rem">${egp(besar.reduce((a,b)=>a+ +b.nominal,0))}</div>
        <div class="tiny">${besar.length} item ditandai besar</div></div>
    </div>
    ${lock?'<p class="tiny mt-s">Buku periode ini ditutup. Buka kembali dari Laporan untuk mengoreksi.</p>':''}
    <div class="card mt"><div class="list">${list.map(e=>`<div class="item">
        <div class="body"><b>${esc(e.deskripsi)}</b><span>${dLabel(e.tanggal)} · ${esc(e.kategori)} · ${esc(e.dicatatOleh||'—')}</span></div>
        ${e.besar?'<span class="badge big">besar</span>':''}
        <div class="val out">−${nf.format(e.nominal)}</div>
        <button class="btn soft sm" data-a="sheet" data-v="pengeluaran" data-id="${e.id}" ${lock?'disabled':''}>Ubah</button>
      </div>`).join('') || '<div class="empty">Belum ada pengeluaran bulan ini.</div>'}</div></div>

    <div class="sec-head"><h2>Rencana pengeluaran</h2>
      <button class="btn ghost sm" data-a="sheet" data-v="rencana">Tambah</button></div>
    <div class="card"><div class="list">${plan.map(x=>`<div class="item">
        <div class="body"><b>${esc(x.deskripsi)}</b><span>rencana ${dLabel(x.tanggalRencana)} · ${x.status}</span></div>
        <div class="val">${nf.format(x.estimasi)}</div>
        ${x.status==='rencana'? `<button class="btn sm" data-a="sheet" data-v="realisasi" data-id="${x.id}">Realisasi</button>`
          : `<span class="badge neutral">${x.status}</span>`}
        <button class="btn soft sm" data-a="hapus-rencana" data-id="${x.id}" aria-label="Hapus rencana">×</button>
      </div>`).join('') || '<div class="empty">Belum ada rencana. Catat dulu rencana beli galon, perbaikan AC, dan sejenisnya.</div>'}</div></div>
    <button class="fab" data-a="sheet" data-v="pengeluaran">+ Catat belanja</button>`;
}

/* ---------- laporan ---------- */
function vLaporan(){
  const h = house(), p = S.period || thisPeriod();
  const lock = locked(h,p);
  const kat = {};
  h.expenses.filter(e=>e.tanggal.slice(0,7)===p).forEach(e=>{ kat[e.kategori]=(kat[e.kategori]||0)+ +e.nominal; });
  const rows = Object.entries(kat).sort((a,b)=>b[1]-a[1]);
  const inn = masuk(h,p), out = keluar(h,p);
  const awal = saldoHingga(h, pShift(p,-1)), akhir = awal + inn - out;
  const byMember = aktif(h).map(m=>({nama:m.nama, v:paidOf(h,m.id,p), st:statusOf(h,m.id,p)}));
  const barRows = lastPeriods(6).map(x=>({p:x, in:masuk(h,x), out:keluar(h,x)}));
  return `<div class="sec-head"><h2>Laporan bulanan</h2></div>
    ${periodNav(p)}
    <div class="card mt-s" id="laporan">
      <h3>${esc(h.nama)} — ${pLabel(p)}</h3>
      <p class="tiny">Semua nilai dalam EGP. Dicetak ${dLabel(today())}.</p>
      <div class="tw"><table>
        <tbody>
          <tr><td>Saldo awal</td><td class="n">${nf.format(awal)}</td></tr>
          <tr><td>Iuran masuk</td><td class="n">${nf.format(inn)}</td></tr>
          <tr><td>Pengeluaran</td><td class="n">−${nf.format(out)}</td></tr>
          <tr class="total"><td>Saldo akhir</td><td class="n">${nf.format(akhir)}</td></tr>
        </tbody></table></div>
      <div class="hair"></div>
      <h3>Pengeluaran per kategori</h3>
      <div class="tw"><table><thead><tr><th>Kategori</th><th class="n">Nominal</th><th class="n">Porsi</th></tr></thead>
        <tbody>${rows.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${nf.format(v)}</td><td class="n">${out?Math.round(v/out*100):0}%</td></tr>`).join('')
          || '<tr><td colspan="3">Tidak ada pengeluaran.</td></tr>'}</tbody></table></div>
      <div class="hair"></div>
      <h3>Iuran per anggota</h3>
      <div class="tw"><table><thead><tr><th>Anggota</th><th class="n">Dibayar</th><th>Status</th></tr></thead>
        <tbody>${byMember.map(m=>`<tr><td>${esc(m.nama)}</td><td class="n">${nf.format(m.v)}</td><td>${m.st}</td></tr>`).join('')}</tbody></table></div>
    </div>
    <div class="row wrap mt noprint">
      <button class="btn soft sm" data-a="csv">Unduh CSV</button>
      <button class="btn soft sm" data-a="print">Cetak / simpan PDF</button>
      <button class="btn ${lock?'gold':'soft'} sm" data-a="tutup-buku">${lock?'Buka kembali buku':'Tutup buku periode'}</button>
    </div>
    <div class="card mt noprint"><h3>Tren enam bulan</h3>${bars(barRows)}</div>`;
}

/* ---------- simulasi ---------- */
function vSimulasi(){
  const h = house();
  const d = S.sim || { orang: aktif(h).length||6, items: (h.setting.iuranTypes||[]).map(x=>({nama:x.nama, v:+x.nominal * (aktif(h).length||6)})), mode:'maju', iuran:1500 };
  S.sim = d;
  const total = d.items.reduce((a,b)=>a+ (+b.v||0),0);
  const per = d.orang? total/d.orang : 0;
  const ok = per>=RANGE[0] && per<=RANGE[1];
  const dana = d.iuran * d.orang;
  return `<div class="row"><button class="btn ghost sm" data-a="tab" data-v="beranda">← Beranda</button></div>
    <div class="sec-head"><h2>Simulasi iuran</h2></div>
    <div class="chips">
      <button class="chip ${d.mode==='maju'?'on':''}" data-a="sim-mode" data-v="maju">Dari pengeluaran → iuran</button>
      <button class="chip ${d.mode==='balik'?'on':''}" data-a="sim-mode" data-v="balik">Dari iuran → dana</button>
    </div>
    <div class="card mt-s">
      <label class="f"><span>Jumlah anggota yang ikut iuran</span>
        <input type="number" min="1" max="40" value="${d.orang}" data-a="sim-orang" inputmode="numeric"></label>
      ${d.mode==='maju'? `
        <fieldset><legend>Estimasi pengeluaran rumah per bulan (EGP)</legend>
          ${d.items.map((it,i)=>`<label class="f"><span>${esc(it.nama)}</span>
            <input type="number" min="0" value="${it.v}" data-a="sim-item" data-i="${i}" inputmode="numeric"></label>`).join('')}
          <button class="btn soft sm" data-a="sim-add">Tambah pos pengeluaran</button>
        </fieldset>
        <div class="tw"><table><tbody>
          <tr><td>Total pengeluaran</td><td class="n">${nf.format(total)}</td></tr>
          <tr><td>Jumlah anggota</td><td class="n">${d.orang} orang</td></tr>
          <tr class="total"><td>Saran iuran per orang</td><td class="n">${nf.format(Math.ceil(per))}</td></tr>
        </tbody></table></div>
        <div class="card tight mt" style="background:${ok?'var(--lunas-soft)':'var(--saffron-soft)'};border-color:transparent">
          <b>${ok?'Masih di rentang wajar':'Di luar rentang umum'}</b>
          <p class="tiny" style="margin:4px 0 0">Rentang umum rumah mahasiswa ${nf.format(RANGE[0])}–${nf.format(RANGE[1])} EGP per orang. ${ok?'Angka ini aman dipakai sebagai kesepakatan.':'Cek ulang pos pengeluaran atau jumlah anggota sebelum disepakati.'}</p></div>
        <button class="btn block mt" data-a="sim-pakai" data-v="${Math.ceil(per)}">Pakai sebagai nominal iuran</button>
      ` : `
        <label class="f"><span>Iuran per orang per bulan (EGP)</span>
          <input type="number" min="0" value="${d.iuran}" data-a="sim-iuran" inputmode="numeric"></label>
        <div class="tw"><table><tbody>
          <tr><td>Dana terkumpul per bulan</td><td class="n">${nf.format(dana)}</td></tr>
          <tr><td>Rencana pengeluaran tercatat</td><td class="n">${nf.format((h.planned||[]).filter(x=>x.status==='rencana').reduce((a,b)=>a+ +b.estimasi,0))}</td></tr>
          <tr><td>Rata-rata pengeluaran 3 bulan</td><td class="n">${nf.format(lastPeriods(3).reduce((a,p)=>a+keluar(h,p),0)/3)}</td></tr>
          <tr class="total"><td>Selisih vs rata-rata</td><td class="n">${nf.format(dana - lastPeriods(3).reduce((a,p)=>a+keluar(h,p),0)/3)}</td></tr>
        </tbody></table></div>
        <button class="btn block mt" data-a="sim-pakai" data-v="${d.iuran}">Pakai sebagai nominal iuran</button>
      `}
    </div>`;
}

/* ---------- anggota ---------- */
function vAnggota(){
  const h = house(), p = thisPeriod();
  const grup = [['aktif','Aktif'],['cuti','Cuti / pulang kampung'],['keluar','Sudah keluar']];
  return `<div class="row"><button class="btn ghost sm" data-a="tab" data-v="beranda">← Beranda</button></div>
    <div class="sec-head"><h2>Anggota rumah</h2><button class="btn sm" data-a="sheet" data-v="anggota">Tambah</button></div>
    ${grup.map(([g,label])=>{
      const ms = h.members.filter(m=>m.status===g);
      if(!ms.length) return '';
      return `<div class="sec-head" style="margin:16px 0 6px"><h3>${label}</h3><span class="muted">${ms.length}</span></div>
      <div class="card"><div class="list">${ms.map(m=>`<div class="item">
        <div class="avatar">${initials(m.nama)}</div>
        <div class="body"><b>${esc(m.nama)}</b><span>${m.kamar?'Kamar '+esc(m.kamar)+' · ':''}gabung ${dLabel(m.tglGabung)}${m.tglKeluar?' · keluar '+dLabel(m.tglKeluar):''}</span></div>
        ${g!=='keluar'? `<span class="badge ${statusOf(h,m.id,p)==='lunas'?'ok':statusOf(h,m.id,p)==='sebagian'?'part':'no'}">${statusOf(h,m.id,p)}</span>`:''}
        <button class="btn soft sm" data-a="sheet" data-v="anggota" data-id="${m.id}">Ubah</button></div>`).join('')}</div></div>`;
    }).join('') || '<div class="empty">Belum ada anggota. Tambah nama penghuni satu per satu.</div>'}
    <div class="sec-head"><h2>Riwayat iuran per anggota</h2></div>
    <div class="card tight"><div class="tw"><table>
      <thead><tr><th>Anggota</th>${lastPeriods(6).map(p=>`<th class="n">${pShort(p).split(' ')[0]}</th>`).join('')}</tr></thead>
      <tbody>${aktif(h).map(m=>`<tr><td>${esc(m.nama)}</td>${lastPeriods(6).map(p=>{
        const st=statusOf(h,m.id,p);
        return `<td class="n">${st==='belum'?'—':nf.format(paidOf(h,m.id,p))}</td>`;}).join('')}</tr>`).join('')}</tbody>
    </table></div></div>`;
}

/* ---------- peraturan & jenis iuran ---------- */

  const h = house(), rs = (h.rules||[]).slice().sort((a,b)=>a.urutan-b.urutan);

    <div class="card mt-s"><div class="list">${rs.map((r,i)=>`<div class="item">
        <span style="width:24px;height:24px;border-radius:7px;background:var(--saffron-soft);color:var(--sebagian);display:grid;place-items:center;font-size:.72rem;font-weight:700;flex:0 0 auto">${i+1}</span>

    <div class="card mt">
      <label class="f"><span>Frekuensi popup pengingat</span>
        <select data-a="set-popup">
          <option value="harian" ${h.setting.popupFreq==='harian'?'selected':''}>Sekali sehari</option>
          <option value="setiap" ${h.setting.popupFreq==='setiap'?'selected':''}>Setiap kali app dibuka</option>
          <option value="mati" ${h.setting.popupFreq==='mati'?'selected':''}>Jangan tampilkan</option>

    </div>`;
}
function vJenisIuran(){
  const h = house(), t = tagihan(h);
  return `<div class="row"><button class="btn ghost sm" data-a="tab" data-v="iuran">← Iuran</button></div>
    <div class="sec-head"><h2>Jenis & nominal iuran</h2><button class="btn sm" data-a="sheet" data-v="jenis">Tambah</button></div>
    <p class="muted">Nominal per orang per bulan. Totalnya jadi tagihan tiap anggota di papan status.</p>
    <div class="card mt-s"><div class="list">${(h.setting.iuranTypes||[]).map(x=>`<div class="item">
      <div class="body"><b>${esc(x.nama)}</b></div>
      <div class="val">${nf.format(x.nominal)}</div>
      <button class="btn soft sm" data-a="sheet" data-v="jenis" data-id="${x.id}">Ubah</button></div>`).join('')
      || '<div class="empty">Belum ada jenis iuran.</div>'}
      <div class="item"><div class="body"><b>Total per orang</b></div><div class="val">${nf.format(t)}</div></div></div></div>
    ${t && (t<RANGE[0]||t>RANGE[1]) ? `<p class="tiny mt-s">Total ${nf.format(t)} EGP di luar rentang umum ${nf.format(RANGE[0])}–${nf.format(RANGE[1])} EGP. Bukan larangan, cuma penanda.</p>`:''}`;
}

function memberSelect(sel){
  const h = house();
  const ms = aktif(h);
  // Rumah yang baru aktif belum punya anggota, jadi dropdown akan kosong dan
  // anggota pertama mustahil ditambahkan. Untuk kasus itu, kolomnya jadi
  // isian teks supaya orang bisa menulis namanya sendiri.
  if(!ms.length){
    return `<label class="f"><span>Dicatat oleh <span class="hint">tulis namamu — daftar anggota masih kosong</span></span>
      <input id="by" value="${esc(sel||'')}" placeholder="Nama kamu" autocomplete="off"></label>`;
  }
  const opts = ms.map(m=>`<option value="${esc(m.nama)}" ${sel===m.nama?'selected':''}>${esc(m.nama)}</option>`).join('');
  return `<label class="f"><span>Dicatat oleh <span class="hint">wajib, karena akun dipakai bersama</span></span>
    <select id="by"><option value="">— pilih nama —</option>${opts}</select></label>`;
}
function katSelect(sel){
  const h = house();
  return `<label class="f"><span>Kategori</span><select id="kategori">
    ${(h.setting.kategori||[]).map(k=>`<option ${sel===k?'selected':''}>${esc(k)}</option>`).join('')}</select></label>`;
}

    <div class="sheet-head"><h2>${esc(title)}</h2><button class="x" data-a="close" aria-label="Tutup">×</button></div>

function render(){
  const app = document.getElementById('app');
  if(S.route==='landing') app.innerHTML = vLanding();
  else if(S.route==='aktivasi') app.innerHTML = vAktivasi();
  else if(S.route==='masuk') app.innerHTML = vMasuk();
  else if(S.route==='owner') app.innerHTML = vOwner();
  else if(S.route==='app'){
    if(!house()){ S.route='landing'; return render(); }
    let inner = '';
    if(S.page==='anggota') inner = vAnggota();
    else if(S.page==='simulasi') inner = vSimulasi();
    else if(S.page==='log') inner = vLog();
    else if(S.page==='peraturan') inner = vPeraturan();
    else if(S.page==='jenis-iuran') inner = vJenisIuran();
    else if(S.tab==='iuran') inner = vIuran();
    else if(S.tab==='pengeluaran') inner = vPengeluaran();
    else if(S.tab==='laporan') inner = vLaporan();
    else if(S.tab==='setting') inner = vSetting();
    else inner = vBeranda();
    app.innerHTML = chrome(inner);
  }
  renderLayer();
}
function go(route){ S.route=route; S.page=null; S.sheet=null; window.scrollTo(0,0); render(); }
function openTab(t){ S.tab=t; S.page=null; S.sheet=null; S.period=null; window.scrollTo(0,0); render(); }
function closeSheet(){ S.sheet=null; renderLayer(); }
function ferr(msg){
  const e = document.getElementById('err-f');
  if(e){ e.textContent=msg; e.hidden=false; } else toast(msg);
}
const val = id => { const el=document.getElementById(id); return el? el.value.trim() : ''; };
const num = id => { const v=parseFloat(val(id)); return isNaN(v)?0:v; };
const chk = id => { const el=document.getElementById(id); return !!(el&&el.checked); };
function needBy(){
  const by = val('by');
  if(!by){
    const el = document.getElementById('by');
    const ketik = el && el.tagName === 'INPUT';
    ferr((ketik? 'Tulis dulu nama pencatat.' : 'Pilih dulu nama pencatat.') + ' Semua catatan harus ada penanggung jawabnya.');
    return null;
  }
  S.lastBy = by; return by;
}
function maybePopup(){
  const h = house(); if(!h) return;
  const rs = (h.rules||[]).filter(r=>r.aktif);
  const f = h.setting.popupFreq;
  if(!rs.length || f==='mati') return;
  if(f==='harian' && DB.session.rulesSeen === today()) return;
  DB.session.rulesSeen = today();
  S.rulesPopup = true;
}

/* ---------- akun & aktivasi rumah ---------- */
async function signUpAndSignIn(username, password){
  const email = emailFor(username);
  const { error: e1 } = await sb.auth.signUp({ email, password });
  if(e1 && !/registered/i.test(e1.message)) throw e1;
  const { data, error: e2 } = await sb.auth.signInWithPassword({ email, password });
  if(e2) throw new Error('Akun dibuat tapi belum bisa masuk otomatis — pastikan "Confirm email" dimatikan di Supabase Authentication settings, lalu coba masuk manual.');
  return data;
}

  await sb.from('expenses').insert(exps);

  await sb.from('planned_expenses').insert([
    {house_id:h.id, tanggal_rencana: pShift(thisPeriod(),1)+'-05', deskripsi:'Ganti kasur kamar 3', estimasi_nominal:1200, dicatat_oleh:'Fikri'},
    {house_id:h.id, tanggal_rencana: pShift(thisPeriod(),1)+'-20', deskripsi:'Cat ulang dapur', estimasi_nominal:800, dicatat_oleh:'Fikri'}
  ]);

  await sb.from('house_rules').insert([
    'Dilarang merokok di dalam rumah, silakan di balkon.',
    'Tamu menginap maksimal 3 hari, izin dulu ke grup rumah.',
    'Piket dapur sesuai jadwal, cuci alat masak setelah dipakai.',
    'Uang kas hanya dipakai untuk kebutuhan rumah, catat di app hari itu juga.',
    'Lampu dan AC dimatikan kalau kamar kosong.'
  ].map((teks,i)=>({house_id:h.id, deskripsi:teks, urutan:i+1, aktif:true})));

  await catatLog('Fikri', 'Membuka rumah contoh', 'houses');
  await reloadHouse();
}

/* =====================================================================
   AKSI
   ===================================================================== */
document.addEventListener('click', async (ev)=>{
  const el = ev.target.closest('[data-a]');
  if(!el) return;
  const a = el.dataset.a, v = el.dataset.v, id = el.dataset.id;
  const h = house();

  if(a==='close-scrim' && ev.target !== el) return;
  switch(a){
    case 'go': go(v); return;
    case 'close': case 'close-scrim': closeSheet(); return;
    case 'tab': openTab(v); return;
    case 'page': S.page=v; S.sheet=null; window.scrollTo(0,0); render(); return;
    case 'per': S.period = pShift(S.period||thisPeriod(), +v); render(); return;
    case 'sheet': S.sheet={name:v, id:id||null}; renderLayer(); return;
    case 'rules-ok': S.rulesPopup=false; renderLayer(); return;
    case 'keluar': {
      stopRealtime(); await sb.auth.signOut();
      DB = { houses:{}, session:{} }; go('landing'); return;
    }

    case 'demo': {
      try{ await seedDemo(); S.route='app'; S.tab='beranda'; maybePopup(); render(); }
      catch(e){ toast(e.message || 'Gagal menyiapkan rumah contoh.'); }
      return;
    }
    case 'aktivasi': {
      const kode = val('kode'), nama = val('nama'), kontak = val('kontak'), u = val('user'), p1 = val('pass'), p2 = val('pass2');
      const e = document.getElementById('err-kode');
      const show = m => { e.textContent=m; e.hidden=false; };
      e.hidden = true;
      if(!/^\d{9}$/.test(kode)) return show('Kode harus 9 angka.');
      if(!nama) return show('Isi nama rumah.');
      if(!u || u.length<3) return show('Username minimal 3 karakter.');
      if(p1.length<6) return show('Password minimal 6 karakter.');
      if(p1!==p2) return show('Dua password belum sama.');
      try{
        await signUpAndSignIn(u, p1);
        const { error } = await sb.rpc('redeem_code', { p_kode:kode, p_nama:nama, p_kontak:kontak });
        if(error) throw error;
        await reloadHouse();
        S.route='app'; S.tab='setting'; render();
        toast('Rumah aktif. Lanjut isi anggota dan nominal iuran.');
      }catch(err){
        show(err.message && /registered/i.test(err.message) ? 'Username sudah dipakai rumah lain.'
          : (err.message || 'Kode tidak ditemukan atau sudah terpakai. Hubungi admin.'));
      }
      return;
    }
    case 'masuk': {
      const u = val('user'), p = val('pass');
      const e = document.getElementById('err-login'); e.hidden=true;
      try{
        const { error } = await sb.auth.signInWithPassword({ email: emailFor(u), password: p });
        if(error) throw error;
        await reloadHouse();
        S.route='app'; S.tab='beranda'; maybePopup(); render();
      }catch(err){ e.textContent='Username atau password salah.'; e.hidden=false; }
      return;
    }

    /* ---- panel pemilik ---- */
    case 'owner-unlock': {
      const pass = val('ownpass');
      try{
        const { data, error } = await sb.rpc('owner_bundle', { p_passcode: pass });
        if(error) throw error;
        S.owner = data; S.ownerPass = pass; render();
      }catch(err){ const e=document.getElementById('err-own'); e.textContent='Sandi salah.'; e.hidden=false; }
      return;
    }
    case 'own-filter': S.filter=v; render(); return;
    case 'own-batch': {
      try{
        const { data:n, error } = await sb.rpc('owner_generate_codes', { p_passcode:S.ownerPass, p_n:100 });
        if(error) throw error;
        const { data } = await sb.rpc('owner_bundle', { p_passcode:S.ownerPass });
        S.owner = data; render();
        toast(n + ' kode baru ditambahkan.');
      }catch(err){ toast(err.message); }
      return;
    }
    case 'own-csv': {
      const rows = [['kode','status','rumah','tanggal_terpakai','batch']].concat(
        (S.owner.codes||[]).map(c=>[c.kode, c.status, c.nama_rumah||'', c.tgl_terpakai||'', c.batch]));
      unduh('igarin-kode.csv', rows.map(r=>r.join(',')).join('\n')); return;
    }
    case 'sv-sale': {
      const nama=val('nama'); if(!nama) return ferr('Isi nama pembeli.');
      const kode=val('kode'); if(!kode) return ferr('Tidak ada kode tersedia untuk dipilih.');
      try{
        const { error } = await sb.rpc('owner_record_sale', { p_passcode:S.ownerPass, p_nama:nama, p_kontak:val('kontak'), p_kode:kode, p_nominal:num('nominal') });
        if(error) throw error;
        const { data } = await sb.rpc('owner_bundle', { p_passcode:S.ownerPass });
        S.owner = data; closeSheet(); render();
        toast('Penjualan dicatat. Kirim kode ' + kode + ' ke pembeli.');
      }catch(err){ ferr(err.message); }
      return;
    }

    /* ---- iuran ---- */
    case 'sv-bayar': {
      const p = val('period');
      if(locked(h,p)) return ferr('Buku periode itu ditutup.');
      const by = needBy(); if(!by) return;
      const mid = val('member'); if(!mid) return ferr('Pilih anggota.');
      const n = num('nominal'); if(n<=0) return ferr('Nominal harus lebih dari 0.');
      const m = h.members.find(x=>x.id===mid);
      const ok = await doAction(async()=>{
        await insertRow('payments', {house_id:h.id, member_id:mid, periode:p, nominal:n, tanggal_bayar:val('tanggal')||today(), dicatat_oleh:by});
        await catatLog(by, `Catat iuran ${m?m.nama:''} ${pShort(p)} ${nf.format(n)} EGP`, 'payments');
      });
      if(ok){ closeSheet(); render(); toast('Iuran tercatat.'); }
      return;
    }
    case 'del-bayar': {
      const rec = h.payments.find(x=>x.id===id);
      const ok = await doAction(async()=>{
        await deleteRow('payments', id);
        await catatLog(S.lastBy||'—', `Hapus catatan iuran ${nf.format(rec?rec.nominal:0)} EGP`, 'payments');
      });
      if(ok){ closeSheet(); render(); toast('Catatan dihapus.'); }
      return;
    }

    /* ---- pengeluaran ---- */
    case 'sv-pengeluaran': {
      const tgl = val('tanggal')||today();
      if(locked(h, tgl.slice(0,7))) return ferr('Buku periode itu ditutup.');
      const by = needBy(); if(!by) return;
      const d = val('deskripsi'); if(!d) return ferr('Tulis pengeluaran ini untuk apa.');
      const n = num('nominal'); if(n<=0) return ferr('Nominal harus lebih dari 0.');
      const data = {tanggal:tgl, kategori:val('kategori'), deskripsi:d, nominal:n, is_besar:chk('besar'), dicatat_oleh:by, bukti_foto_url:val('bukti')||null};
      const ok = await doAction(async()=>{
        if(id){ await updateRow('expenses', id, data); await catatLog(by, `Ubah pengeluaran ${d}`, 'expenses'); }
        else { await insertRow('expenses', {house_id:h.id, ...data}); await catatLog(by, `Catat pengeluaran ${d} ${nf.format(n)} EGP`, 'expenses'); }
      });
      if(ok){ closeSheet(); render(); toast('Pengeluaran tersimpan.'); }
      return;
    }
    case 'del-pengeluaran': {
      const rec = h.expenses.find(x=>x.id===id);
      const ok = await doAction(async()=>{
        await deleteRow('expenses', id);
        await catatLog(S.lastBy||'—', `Hapus pengeluaran ${rec?rec.deskripsi:''}`, 'expenses');
      });
      if(ok){ closeSheet(); render(); toast('Catatan dihapus.'); }
      return;
    }
    case 'sv-rencana': {
      const by = needBy(); if(!by) return;
      const d = val('deskripsi'); if(!d) return ferr('Tulis rencananya.');
      const ok = await doAction(async()=>{
        await insertRow('planned_expenses', {house_id:h.id, tanggal_rencana:val('tanggal')||today(), deskripsi:d, estimasi_nominal:num('nominal'), dicatat_oleh:by});
        await catatLog(by, `Tambah rencana ${d}`, 'planned_expenses');
      });
      if(ok){ closeSheet(); render(); toast('Rencana dicatat.'); }
      return;
    }
    case 'sv-realisasi': {
      const by = needBy(); if(!by) return;
      const pl = h.planned.find(x=>x.id===id);
      const tgl = val('tanggal')||today();
      if(locked(h, tgl.slice(0,7))) return ferr('Buku periode itu ditutup.');
      const ok = await doAction(async()=>{
        await insertRow('expenses', {house_id:h.id, tanggal:tgl, kategori:val('kategori'), deskripsi:pl.deskripsi, nominal:num('nominal'), is_besar:chk('besar'), dicatat_oleh:by});
        await updateRow('planned_expenses', id, {status:'selesai'});
        await catatLog(by, `Realisasi rencana ${pl.deskripsi}`, 'expenses');
      });
      if(ok){ closeSheet(); render(); toast('Rencana jadi pengeluaran.'); }
      return;
    }
    case 'hapus-rencana': {
      const ok = await doAction(async()=>{
        await deleteRow('planned_expenses', id);
        await catatLog(S.lastBy||'—','Hapus rencana pengeluaran','planned_expenses');
      });
      if(ok) render();
      return;
    }

    /* ---- anggota ---- */
    case 'sv-anggota': {
      const by = needBy(); if(!by) return;
      const nama = val('nama'); if(!nama) return ferr('Isi nama anggota.');
      const data = {nama, no_kamar:val('kamar')||null, status:val('status'), tanggal_gabung:val('gabung')||today(), tanggal_keluar:val('keluar')||null};
      const ok = await doAction(async()=>{
        if(id){ await updateRow('members', id, data); await catatLog(by, `Ubah data anggota ${nama}`, 'members'); }
        else { await insertRow('members', {house_id:h.id, ...data}); await catatLog(by, `Tambah anggota ${nama}`, 'members'); }
      });
      if(ok){ closeSheet(); render(); toast('Data anggota tersimpan.'); }
      return;
    }
    case 'del-anggota': {
      const rec = h.members.find(x=>x.id===id);
      const ok = await doAction(async()=>{
        await deleteRow('members', id);
        await catatLog(S.lastBy||'—', `Hapus anggota ${rec?rec.nama:''}`, 'members');
      });
      if(ok){ closeSheet(); render(); }
      return;
    }

    /* ---- peraturan ---- */
    case 'sv-peraturan': {
      const by = needBy(); if(!by) return;
      const teks = val('teks'); if(!teks) return ferr('Tulis isi peraturannya.');
      const ok = await doAction(async()=>{
        if(id){ await updateRow('house_rules', id, {deskripsi:teks, aktif:chk('aktif')}); await catatLog(by,'Ubah peraturan rumah','house_rules'); }
        else { await insertRow('house_rules', {house_id:h.id, deskripsi:teks, aktif:chk('aktif'), urutan:(h.rules.length+1)}); await catatLog(by,'Tambah peraturan rumah','house_rules'); }
      });
      if(ok){ closeSheet(); render(); toast('Peraturan tersimpan.'); }
      return;
    }
    case 'del-peraturan': {
      const ok = await doAction(async()=>{
        await deleteRow('house_rules', id);
        const sisa = h.rules.filter(x=>x.id!==id).sort((a,b)=>a.urutan-b.urutan);
        await Promise.all(sisa.map((r,i)=> r.urutan!==i+1 ? updateRow('house_rules', r.id, {urutan:i+1}) : null));
        await catatLog(S.lastBy||'—','Hapus peraturan rumah','house_rules');
      });
      if(ok){ closeSheet(); render(); }
      return;
    }
    case 'rule-move': {
      const rs = h.rules.slice().sort((a,b)=>a.urutan-b.urutan);
      const i = rs.findIndex(x=>x.id===id), j = i + (+v);
      if(i<0||j<0||j>=rs.length) return;
      const ok = await doAction(async()=>{
        await updateRow('house_rules', rs[i].id, {urutan: rs[j].urutan});
        await updateRow('house_rules', rs[j].id, {urutan: rs[i].urutan});
      });
      if(ok) render();
      return;
    }

    /* ---- jenis iuran ---- */
    case 'sv-jenis': {
      const by = needBy(); if(!by) return;
      const nama = val('nama'); if(!nama) return ferr('Isi nama iuran.');
      const n = num('nominal');
      const ok = await doAction(async()=>{
        if(id){ await updateRow('iuran_types', id, {nama_iuran:nama, nominal_default:n}); await catatLog(by,`Ubah iuran ${nama}`,'iuran_types'); }
        else { await insertRow('iuran_types', {house_id:h.id, nama_iuran:nama, nominal_default:n}); await catatLog(by,`Tambah iuran ${nama}`,'iuran_types'); }
      });
      if(ok){ closeSheet(); render(); toast('Jenis iuran tersimpan.'); }
      return;
    }
    case 'del-jenis': {
      const ok = await doAction(async()=>{
        await deleteRow('iuran_types', id);
        await catatLog(S.lastBy||'—','Hapus jenis iuran','iuran_types');
      });
      if(ok){ closeSheet(); render(); }
      return;
    }

    /* ---- kategori ---- */
    case 'kat-tambah': {
      const k = val('kat-baru'); if(!k) return;
      if(h.setting.kategori.includes(k)) return;
      const ok = await doAction(async()=>{ await updateRow('houses', h.id, {kategori: h.setting.kategori.concat(k)}); });
      if(ok) render();
      return;
    }
    case 'kat-hapus': {
      const ok = await doAction(async()=>{ await updateRow('houses', h.id, {kategori: h.setting.kategori.filter(k=>k!==v)}); });
      if(ok) render();
      return;
    }

    /* ---- password ---- */
    case 'sv-pass': {
      const p0=val('p0'), p1=val('p1'), p2=val('p2');
      if(p1.length<6) return ferr('Password baru minimal 6 karakter.');
      if(p1!==p2) return ferr('Dua password belum sama.');
      try{
        const { error: e1 } = await sb.auth.signInWithPassword({ email: emailFor(h.auth.username), password: p0 });
        if(e1) return ferr('Password lama salah.');
        const { error: e2 } = await sb.auth.updateUser({ password: p1 });
        if(e2) throw e2;
        await catatLog(S.lastBy||'—','Ganti password rumah','houses');
        closeSheet(); toast('Password diganti. Kabari penghuni lain.');
      }catch(err){ ferr(err.message || 'Gagal mengganti password.'); }
      return;
    }

    /* ---- laporan ---- */
    case 'print': window.print(); return;
    case 'csv': {
      const p = S.period||thisPeriod();
      const rows = [['Laporan', h.nama, pLabel(p)], [], ['Anggota','Dibayar (EGP)','Status']];
      aktif(h).forEach(m=>rows.push([m.nama, paidOf(h,m.id,p), statusOf(h,m.id,p)]));
      rows.push([], ['Tanggal','Kategori','Deskripsi','Nominal (EGP)','Besar','Dicatat oleh']);
      h.expenses.filter(e=>e.tanggal.slice(0,7)===p).forEach(e=>rows.push([e.tanggal,e.kategori,e.deskripsi,e.nominal,e.besar?'ya':'',e.dicatatOleh]));
      rows.push([], ['Saldo awal', saldoHingga(h,pShift(p,-1))], ['Iuran masuk', masuk(h,p)], ['Pengeluaran', keluar(h,p)], ['Saldo akhir', saldoHingga(h,p)]);
      unduh(`igarin-${p}.csv`, rows.map(r=>r.map(x=>`"${String(x==null?'':x).replace(/"/g,'""')}"`).join(',')).join('\n'));
      return;
    }
    case 'tutup-buku': {
      const p = S.period||thisPeriod();
      const [y,m] = p.split('-').map(Number);
      const akanTutup = !locked(h,p);
      const ok = await doAction(async()=>{
        const { error } = await sb.rpc('set_period_status', { p_bulan:m, p_tahun:y, p_status: akanTutup?'tertutup':'terbuka' });
        if(error) throw error;
        await catatLog(S.lastBy||'—', akanTutup? `Tutup buku ${pLabel(p)}` : `Buka kembali buku ${pLabel(p)}`, 'periods');
      });
      if(ok){ render(); toast(akanTutup? 'Buku ' + pLabel(p) + ' ditutup, data jadi read-only.' : 'Buku ' + pLabel(p) + ' dibuka kembali.'); }
      return;
    }

    /* ---- simulasi ---- */
    case 'sim-mode': S.sim.mode=v; render(); return;
    case 'sim-add': {
      const nama = prompt('Nama pos pengeluaran');
      if(nama) S.sim.items.push({nama, v:0});
      render(); return;
    }
    case 'sim-pakai': {
      const target = +v, h2 = house(), types = h2.setting.iuranTypes||[];
      const cur = tagihan(h2);
      const ok = await doAction(async()=>{
        if(!types.length || !cur){
          await insertRow('iuran_types', {house_id:h2.id, nama_iuran:'Iuran bulanan', nominal_default:target});
        } else {
          const f = target/cur;
          await Promise.all(types.map(t=> updateRow('iuran_types', t.id, {nominal_default: Math.round(t.nominal*f)})));
        }
        await catatLog(S.lastBy||'—', `Set nominal iuran jadi ${nf.format(target)} EGP per orang`, 'iuran_types');
      });
      if(ok){ S.page=null; S.tab='iuran'; render(); toast('Nominal iuran diperbarui jadi ' + egp(target) + ' per orang.'); }
      return;
    }
  }
});
document.addEventListener('change', async (ev)=>{
  const el = ev.target.closest('[data-a]'); if(!el) return;
  const a = el.dataset.a, h = house();
  if(a==='sim-orang'){ S.sim.orang = Math.max(1, parseInt(el.value)||1); render(); }
  else if(a==='sim-item'){ S.sim.items[+el.dataset.i].v = parseFloat(el.value)||0; render(); }
  else if(a==='sim-iuran'){ S.sim.iuran = parseFloat(el.value)||0; render(); }
  else if(a==='set-nama'){ const nv=el.value.trim()||h.nama; await doAction(()=>updateRow('houses', h.id, {nama_rumah:nv})); render(); }
  else if(a==='set-kontak'){ await doAction(()=>updateRow('houses', h.id, {kontak: el.value.trim()})); }
  else if(a==='set-waktu'){ await doAction(()=>updateRow('houses', h.id, {waktu_penagihan: el.value})); render(); }
  else if(a==='set-saldo'){ await doAction(()=>updateRow('houses', h.id, {saldo_awal: parseFloat(el.value)||0})); render(); }
  else if(a==='set-popup'){ await doAction(()=>updateRow('houses', h.id, {popup_freq: el.value})); render(); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ if(S.rulesPopup){S.rulesPopup=false;} S.sheet=null; renderLayer(); } });

function unduh(nama, teks){
  try{
    const b = new Blob([teks], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = nama; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    toast('Berkas diunduh.');
  }catch(e){
    const w = window.open('', '_blank');
    if(w){ w.document.write('<pre>'+esc(teks)+'</pre>'); toast('Unduhan diblokir, data dibuka di tab baru.'); }
    else toast('Unduhan diblokir peramban.');
  }
}

/* ---------- mulai ---------- */
(async function(){
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if(session){ await reloadHouse(); S.route='app'; S.tab='beranda'; maybePopup(); }
  }catch(e){ /* belum login / sesi kedaluwarsa, tetap tampil landing */ }
  render();
  sb.rpc('stok_tersedia').then(({data,error})=>{ if(!error){ stokTersedia = data; if(S.route==='landing') render(); } });
})();
